    src: 'Annalen und Reliefs Thutmosis’ III. in Karnak (zeitgenössisch, königliche Propaganda), zusammengefasst bei Breasted, Ancient Records II, und Grimal' + ON('https://en.wikipedia.org/wiki/Thutmose_III') },
  { who: 'Hattusili III.', meta: 'Hethiterreich, Anatolien · reg. um 1267–1237 v. Chr. · Feldherr und König', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Nach eigenen Worten war er ein kränkliches Kind, mit dessen Überleben niemand rechnete. Er glaubte, die Göttin Ischtar habe ihn gerettet, verehrte sie sein Leben lang glühend und heiratete ihre Priesterin Puduhepa. Seinen Aufstieg rechtfertigte er in einer selbst verfassten Lebensgeschichte, der sogenannten „Apologie“.',
    kurz: 'schreibt jeden Erfolg seiner persönlichen Schutzgottheit zu',
    use: 'Ein Feldherr, der jeden Sieg seiner Schutzgottheit zuschreibt, gewinnt Legitimität und gerät in Not, sobald ein Vorzeichen zeigt, dass sie ihm „widerspricht“.',
    src: 'Hattusili III., „Apologie“ (eigene Schrift aus seiner Regierungszeit, bewusst eigennützig)' + ON('https://en.wikipedia.org/wiki/Hattusili_III') },
  { who: 'Asarhaddon', meta: 'Assyrien · reg. 681–669 v. Chr. · König', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Sagten Finsternisse oder andere Vorzeichen den Tod des Königs voraus, saß bis zu hundert Tage lang ein Ersatzkönig in königlichen Gewändern auf dem Thron. Asarhaddon blieb so lange unsichtbar, und die Briefe seiner Gelehrten nennen ihn „den Bauern“. Danach wurde der Ersatzmann getötet, damit sich das Omen erfüllte; 671 v. Chr. starb ein Mann namens Damqi in dieser Rolle.',
    kurz: 'hält für böse Vorzeichen einen Doppelgänger auf dem Thron bereit',
    use: 'Ein Ersatzkönig für schlechte Omen ist eine fertige Tarnung, um zu verschwinden, und ein Todesurteil für den, den die Wahl trifft.',
    src: 'Briefe seiner Astrologen und Beschwörer, etwa des Mar-Issar, in State Archives of Assyria 10 (zeitgenössisch)' },
  { who: 'Der persische Großkönig', meta: 'Persien · um 500–330 v. Chr. · Hof der Achämeniden', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'B',
    text: 'Der König speiste meist allein, seine Gäste saßen in einem Raum gegenüber: Durch einen Vorhang an der Tür konnte er sie sehen, sie ihn aber nicht. Nach dem Essen rief ein Eunuch etwa ein Dutzend „Mittrinker“ herein, die auf dem Boden saßen, während der König auf einer Liege mit goldenen Füßen lag, und sie tranken einen anderen Wein als er. Für den Hof wurden täglich rund tausend Tiere geschlachtet, Pferde, Kamele, Rinder und Vögel.',
    kurz: 'beobachtet seine Offiziere beim Essen hinter einem Vorhang',
    use: 'Lass deinen Feldherrn seine Offiziere unbemerkt beim Essen beobachten: Wer danach hinter den Vorhang gerufen wird, gehört zum wahren inneren Kreis.',
    src: 'Herakleides von Kyme, Persika, Buch 2 (um 350 v. Chr., zur Zeit der Achämeniden), zitiert bei Athenaios, Deipnosophistai 4,145 (um 200 n. Chr.)' + ON(ATH) },
  { who: 'Dareios I.', meta: 'Persien · um 550–486 v. Chr. · Großkönig', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Nach dem Brand von Sardes befahl er einem Diener, ihm jedes Mal, wenn das Essen aufgetragen wurde, dreimal zu sagen: „Herr, gedenke der Athener.“',
    kurz: 'lässt sich bei jeder Mahlzeit dreimal an seine offene Rechnung erinnern',
    use: 'Ein Diener, der deinen Feldherrn bei jeder Mahlzeit an seine Rache erinnert, macht aus einem Groll eine Pflicht, die er nicht mehr vergessen darf.',
    src: 'Herodot 5,105 (um 430 v. Chr., rund 60 Jahre später)' },
  { who: 'Xerxes I.', meta: 'Persien · um 519–465 v. Chr. · Großkönig', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Auf dem Marsch nach Griechenland fand er in Lydien eine Platane, die ihm so gefiel, dass er sie mit goldenem Schmuck behängte und einen seiner „Unsterblichen“ als Wächter bei ihr zurückließ.',
    kurz: 'schmückt einen schönen Baum mit Gold und lässt ihn bewachen',
    use: 'Lass deinen Feldherrn mitten im Feldzug etwas Schönes ehren und bewachen, und seine Männer sich fragen, ob sie ihm weniger wert sind als ein Baum.',
    src: 'Herodot 7,31 (um 430 v. Chr.)' },
  { who: 'Kyros der Jüngere', meta: 'Persien · um 424–401 v. Chr. · Prinz und Statthalter', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'B',
    text: 'Dem Spartaner Lysander zeigte er in Sardes seinen Park, den er zu einem guten Teil selbst gepflanzt und in Reihen angelegt hatte. Er schwor bei Mithras, er setze sich nie zum Essen, ohne vorher bei Kriegsübungen oder Gartenarbeit ins Schwitzen gekommen zu sein.',
    kurz: 'setzt sich nie zu Tisch, ohne vorher geschwitzt zu haben',
    use: 'Ein Besucher, der die Gartenarbeit deines Feldherrn für Spielerei hält, unterschätzt einen Mann, der jeden Fußbreit Boden mit eigenen Händen kennt.',
    src: 'Xenophon, Oikonomikos 4 (Xenophon zog 401 v. Chr. mit Kyros’ Heer)' },

  /* ---------- Griechenland und Makedonien ---------- */
  { who: 'Themistokles', meta: 'Athen und Persien · um 524–459 v. Chr. · Feldherr und Staatsmann', era: A, grp: F, cat: 'Sprache & Humor', rel: 'A',
    text: 'Als Flüchtling am persischen Hof bat er den König um ein Jahr Aufschub vor der Audienz. Dieses Jahr nutzte er, um die persische Sprache und die Sitten des Landes zu lernen. Schon als Politiker in Athen soll er sich den Namen jedes einzelnen Wählers gemerkt haben.',
    kurz: 'erbittet sich Aufschub und lernt in der Zeit die Sprache des Feindes',
    use: 'Lass deinen Feldherrn mit einem glaubwürdigen Vorwand Zeit gewinnen und dann zur Überraschung aller in der Sprache des Gegners das Wort ergreifen.',
    src: 'Thukydides 1,137–138 (um 430–400 v. Chr., eine Generation später); zu den Namen Plutarch, Themistokles (um 100 n. Chr.)' + ON('https://en.wikipedia.org/wiki/Themistocles') },
  { who: 'Nikias', meta: 'Athen und Sizilien · um 470–413 v. Chr. · Feldherr', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Er opferte jeden Tag und hielt sich einen Wahrsager im Haus, den er vor allem nach seinen Silberminen befragte. Er ging kaum aus, die Türen blieben verriegelt, und Freunde vertrösteten Besucher, er sei mit Staatsgeschäften beschäftigt. Als sich 413 v. Chr. vor Syrakus der Mond verfinsterte, war sein vertrauter Seher Stilbides kurz zuvor gestorben, und Nikias ließ das Heer voller Angst einen ganzen Mondmonat warten.',
    kurz: 'verlässt sich ganz auf einen Seher und ist ohne ihn gelähmt',
    use: 'Lass deinen frommen, vorsichtigen Feldherrn sich auf einen einzigen Berater stützen und zeig, wie er nach dessen Tod im entscheidenden Moment erstarrt.',
    src: 'Plutarch, Nikias 4, 5 und 23 (um 100 n. Chr., rund 500 Jahre später), gestützt auf Thukydides (zeitgenössisch)' + ON(PLUT('Nicias')) },
  { who: 'Epaminondas', meta: 'Theben · Sieger von Leuktra 371 v. Chr. · Feldherr', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Vor Leuktra liefen Meldungen durchs thebanische Lager: Ein Orakel sage Spartas Niederlage am Grab der „Jungfrauen“ voraus, das die Thebaner prompt schmückten; zu Hause hätten sich Tempeltüren von selbst geöffnet; aus dem Heraklestempel seien die Waffen verschwunden, als sei der Held selbst ausgezogen. Xenophon merkt trocken an, manche hielten all das für Kunstgriffe der Anführer. Epaminondas selbst galt als schweigsam und freiwillig arm.',
    kurz: 'inszeniert in der Nacht vor der Schlacht kleine Wunder',
    use: 'Lass deinen schweigsamen Feldherrn, der nie prahlt, in der Nacht vor der Schlacht „Wunder“ arrangieren, und einen Zeitgenossen, der es trocken durchschaut.',
    src: 'Xenophon, Hellenika 6,4,7–8 (um 360–355 v. Chr., Zeitgenosse und spartafreundlich); Diodor nennt Epaminondas als Urheber' + ON('https://cts.perseids.org/read/greekLit/tlg0032/tlg001/perseus-eng2/6.4.4-6.4.20') },
  { who: 'Epaminondas', meta: 'Theben · Sieger von Leuktra 371 v. Chr. · Feldherr', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'C',
    text: 'Eine späte Anekdote erzählt, er habe nur einen einzigen Mantel besessen. Wurde der gewaschen, blieb er zu Hause.',
    kurz: 'besitzt nur einen Mantel und bleibt zu Hause, wenn er gewaschen wird',
    use: 'Zeig die Armut deines Feldherrn an einem Waschtag: Ein Bote findet ihn zu Hause im Unterkleid, während in der Stadt beraten wird.',
    src: 'Ailianos, Varia historia 5,5 (um 200 n. Chr.)' },
  { who: 'Philipp II. von Makedonien', meta: 'Makedonien · 382–336 v. Chr. · König', era: A, grp: F, cat: 'Führungsstil', rel: 'C',
    text: 'Als ihn Soldaten mitten in einem Ringkampf umringten und ihren Sold forderten, gab er ihnen recht, sprang in ein Wasserbecken und blieb darin, bis sie aufgaben und abzogen; später erzählte er gern von diesem Trick. Warme Bäder verbot er im Heer, denn makedonische Sitte gönne warmes Wasser nicht einmal einer Frau im Kindbett. Beides steht erst bei späten Anekdotensammlern.',
    kurz: 'entkommt einer Meuterei mit einem Sprung ins Wasser',
    use: 'Lass deinen Feldherrn eine gefährliche Forderung seiner Männer mit Clownerie und einem überraschenden Abgang entschärfen, über den später alle lachen.',
    src: 'Polyainos, Strategemata 4,2,6 und 4,2,1 (um 163 n. Chr., rund 500 Jahre später)' + ON('https://www.attalus.org/translate/polyaenus4A.html') },
  { who: 'Philipp II. von Makedonien', meta: 'Makedonien · 382–336 v. Chr. · König', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Der König, der Makedonien groß machte, war von seinen Feldzügen gezeichnet: Bei der Belagerung von Methone nahm ihm ein Pfeil das rechte Auge, und eine Beinwunde ließ ihn hinken.',
    kurz: 'trägt die Narben seiner Feldzüge offen, einäugig und hinkend',
    use: 'Lass die sichtbaren Wunden deines Feldherrn für ihn sprechen: Veteranen folgen dem Hinkenden, weil sie wissen, wo er sich das Bein geholt hat.',
    src: 'Gut belegt, hier nach einer modernen Zusammenfassung' + ON('https://en.wikipedia.org/wiki/Philip_II_of_Macedon') },
  { who: 'Philipp II. von Makedonien', meta: 'Makedonien · 382–336 v. Chr. · König', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'C',
    text: 'Nach seinem Sieg bei Chaironeia soll er sich jeden Morgen von einem Diener haben sagen lassen: „Philipp, du bist ein sterblicher Mensch.“ Das ist eine späte Anekdote, über 500 Jahre nach seinem Tod aufgeschrieben.',
    kurz: 'lässt sich jeden Morgen daran erinnern, dass er sterblich ist',
    use: 'Ein Diener, dessen einzige Aufgabe die tägliche Mahnung ist, wird zur Figur mit Macht: Was geschieht, wenn er eines Morgens schweigt?',
    src: 'Ailianos, Varia historia 8,15 (um 200 n. Chr., über 500 Jahre später)' },
  { who: 'Alexander der Große', meta: 'Makedonien · 356–323 v. Chr. · König und Feldherr', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'B',
    text: 'In der Nacht vor Gaugamela vollzog er mit seinem Seher Aristandros vor dem Zelt geheime Riten und opferte dem Phobos, der Furcht. Einen Nachtangriff lehnte er ab, er wolle seinen Sieg nicht stehlen; dann schlief er tiefer als sonst, sodass die Offiziere das Frühstück der Soldaten selbst anordneten und Parmenion an seinem Bett zwei-, dreimal seinen Namen rufen musste. Gefragt, wie er schlafen könne, sagte er, sie hätten schon gewonnen, denn nun müssten sie Dareios nicht mehr hinterherjagen.',
    kurz: 'opfert vor der Schlacht der Furcht und schläft dann wie ein Stein',
    use: 'Lass deinen Feldherrn heimlich ein Ritual an die Angst vollziehen und danach so ruhig schlafen, dass man ihn wecken muss; diese Ruhe verunsichert seine Generäle mehr als jede Rede.',
    src: 'Plutarch, Alexander 31–32 (um 100 n. Chr., rund 430 Jahre später, nach zeitgenössischen Historikern)' + ON('https://johndclare.net/AncientHistory/Alexander_Sources6.html') },
  { who: 'Alexander der Große', meta: 'Makedonien · 356–323 v. Chr. · König und Feldherr', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Nach dem Tod des Dareios setzte er das purpurne, weiß gebänderte Diadem des Perserkönigs auf, trug persische Kleidung, ließ seine Gefährten und Reiter persische Gewänder anlegen und hielt 365 Konkubinen, so viele wie Dareios. Briefe nach Europa siegelte er mit seinem alten Siegelring, Briefe nach Asien mit dem Ring des Dareios.',
    kurz: 'siegelt mit zwei Ringen, je nachdem, wohin der Brief geht',
    use: 'Zwei Siegelringe für zwei Rollen verraten auf jedem Brief, welches „Ich“ deines Feldherrn gerade spricht, und ein gefälschtes Siegel kann genau diese Gewissheit ausnutzen.',
    src: 'Curtius Rufus, Geschichte Alexanders 6,6,4–8 (1. Jh. n. Chr., rund 370 Jahre später; den Ring erwähnt wohl nur er)' + ON('https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Curtius/6*.html') },
  { who: 'Alexander der Große', meta: 'Makedonien · 356–323 v. Chr. · König und Feldherr', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Er hielt den Kopf leicht zur linken Schulter geneigt und hatte einen „schmelzenden“ Blick. Der Bildhauer Lysipp hielt beides in seinen Statuen fest, und viele seiner Nachfolger und Freunde ahmten die Haltung später nach.',
    kurz: 'hält den Kopf stets leicht zur linken Schulter geneigt',
    use: 'Eine Haltung, die Untergebene nachahmen, zeigt, wer die Macht hat: Lass einen ehrgeizigen Offizier die Kopfneigung seines Feldherrn kopieren, und den Feldherrn es bemerken.',
    src: 'Plutarch, Alexander 4 (um 100 n. Chr., gut 400 Jahre später)' },
  { who: 'Alexander der Große', meta: 'Makedonien · 356–323 v. Chr. · König und Feldherr', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Die Ilias nannte er seine Wegzehrung für die Kriegskunst. Ein Exemplar in der Ausgabe des Aristoteles lag zusammen mit seinem Dolch unter seinem Kopfkissen; Plutarch beruft sich dafür auf Onesikritos, der unter ihm diente.',
    kurz: 'schläft mit einem Lieblingsbuch und einem Dolch unter dem Kissen',
    use: 'Buch und Dolch unter einem Kissen erzählen in einem einzigen Bild, wovon dein Feldherr träumt und wovor er sich fürchtet.',
    src: 'Plutarch, Alexander 8 (um 100 n. Chr., nach Onesikritos, einem Teilnehmer des Feldzugs)' },
  { who: 'Eumenes von Kardia', meta: 'Kleinasien und Iran · um 362–316 v. Chr. · Sekretär Alexanders, später Feldherr', era: A, grp: F, cat: 'Führungsstil', rel: 'B',
    text: 'Die stolzen makedonischen Generäle wollten einem griechischen Ex-Sekretär nicht gehorchen, also erzählte Eumenes, Alexander sei ihm im Traum erschienen. Fortan beriet man in einem Königszelt vor einem leeren Thron, „in Gegenwart Alexanders“. Als er einmal krank in einer Sänfte hinter der Front getragen wurde und die Veteranen ohne ihn nicht vorrücken wollten, ließ er die Träger nach vorn laufen, zog die Vorhänge zurück und streckte ihnen die Hand entgegen.',
    kurz: 'hält Kriegsrat vor dem leeren Thron eines toten Helden',
    use: 'Lass deinen Feldherrn durch einen leeren Stuhl regieren: Die Autorität eines toten Helden wagt kein Rivale anzufechten.',
    src: 'Plutarch, Eumenes 1, 13 und 14 (um 100 n. Chr., wohl nach Hieronymos von Kardia, der mit Eumenes diente)' + ON(PLUT('Eumenes')) },
  { who: 'Eumenes von Kardia', meta: 'Kleinasien und Iran · um 362–316 v. Chr. · Sekretär Alexanders, später Feldherr', era: A, grp: F, cat: 'Arbeitsweise', rel: 'B',
    text: 'Er ließ seine Sänfte auf einem Hügel halten, damit die Verfolger eine versteckte Reserve vermuteten. Er fälschte einen Brief „in syrischer Schrift“ und ließ zusätzliche Reihen von Lagerfeuern anzünden, um ein größeres Lager vorzutäuschen.',
    kurz: 'lässt zusätzliche Lagerfeuer anzünden, um ein größeres Heer vorzutäuschen',
    use: 'Diese kleinen Listen kosten fast nichts; lass deinen Feldherrn sie so beiläufig einsetzen, dass seine eigenen Offiziere sie erst im Nachhinein bemerken.',
    src: 'Plutarch, Eumenes (um 100 n. Chr.); Polyainos, Strategemata 4,8,1–4 (um 163 n. Chr.)' + ON('https://www.attalus.org/translate/polyaenus4B.html') },
  { who: 'Antiochos IV.', meta: 'Syrien · reg. 175–164 v. Chr. · Seleukidenkönig', era: A, grp: F, cat: 'Führungsstil', rel: 'A',
    text: 'Er entwischte seinen Höflingen, trieb sich in Antiochia in den Werkstätten der Silber- und Goldschmiede herum, trank mit den einfachsten Fremden und badete in den vollen öffentlichen Bädern. Bei seinem Fest in Daphne 166 v. Chr. ritt er auf einem armseligen Pony den Festzug auf und ab, wies Gäste an ihre Plätze und ließ sich am Ende von Mimen wie ein Bündel eingewickelt hereintragen, sprang auf und tanzte mit ihnen. Statt Epiphanes, „der erschienene Gott“, nannte man ihn Epimanes, „der Verrückte“.',
    kurz: 'entwischt seinen Wachen und trinkt in Werkstätten mit einfachen Leuten',
    use: 'Ein Herrscher, der in der Menge verschwindet, ist vielleicht ein Genie der Straßenaufklärung, vielleicht einfach verrückt, und sein Hof kann es nie sicher sagen.',
    src: 'Polybios 26,1 und 30,25–26 (Zeitgenosse, feindselig und auf Klatsch gestützt; erhalten durch Zitate bei Athenaios)' + ON('https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/26*.html') },

  /* ---------- Karthago und Rom ---------- */
  { who: 'Hamilkar Barkas', meta: 'Karthago und Spanien · um 275–228 v. Chr. · Feldherr', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: '237 v. Chr., vor dem Aufbruch nach Spanien, opferte er dem Gott, den Polybios „Zeus“ nennt, schickte die Diener ein Stück zurück und fragte seinen neunjährigen Sohn Hannibal, ob er mitkommen wolle. Dann führte er ihn an der Hand zum Altar, ließ ihn die Hand auf das Opfertier legen und schwören, niemals ein Freund der Römer zu werden. Polybios hat die Geschichte von Hannibal selbst, der sie später König Antiochos III. erzählte.',
    kurz: 'nimmt seinen Sohn mit zum Altar und lässt ihn ewige Feindschaft schwören',
    use: 'Ein Kinderschwur am Altar kann einen ganzen Feldzug antreiben, eine Schuld, die der Sohn nie abtragen kann.',
    src: 'Polybios 3,11,5–7 (um 150 v. Chr., rund 85 Jahre später, nach Hannibals eigener Erzählung)' + ON('https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/3*.html') },
  { who: 'Hannibal', meta: 'Karthago · 247–183 v. Chr. · Feldherr', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Im Winter 218/217 v. Chr. lebte er unter gallischen Verbündeten, deren Häuptlinge ihn töten wollten. Er ließ sich eine Reihe Perücken machen, von denen ihn jede wie einen Mann anderen Alters aussehen ließ, und wechselte ständig: mal ein anderes Gewand, mal falsches Haar.',
    kurz: 'wechselt Perücken und Kleider, um für Attentäter unkenntlich zu bleiben',
    use: 'Ein Feldherr mit einer Kiste voller Gesichter hält Attentäter im Ungewissen und lehrt seine eigenen Leute, dass er nie ganz der ist, der er scheint.',
    src: 'Polybios 3,78,1–4 (um 150 v. Chr., rund 70 Jahre später; Polybios befragte Überlebende und überquerte selbst die Alpen); Livius 22,1,3 (um 25 v. Chr.)' + ON('https://www.yorku.ca/pswarney/Texts/livy-22.htm') },
  { who: 'Hannibal', meta: 'Karthago · 247–183 v. Chr. · Feldherr', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Im Frühjahr 217 v. Chr. kämpfte sich das Heer vier Tage und drei Nächte ohne Schlaf durch die überfluteten Sümpfe am Arno. Hannibal, dessen Augen schon entzündet waren, ritt auf dem einzigen überlebenden Elefanten, um etwas höher über dem Wasser zu sein, und verlor das Sehvermögen auf einem Auge. Nepos schreibt, das rechte Auge habe er nie wieder so gut gebrauchen können.',
    kurz: 'trägt eine bleibende Wunde von seinem kühnsten Marsch',
    use: 'Eine bleibende Wunde vom kühnsten eigenen Marsch erinnert deinen Feldherrn an den Preis, und seine Gegner können lernen, auf welcher Seite er schlechter sieht.',
    src: 'Livius 22,2,10–11 (um 25 v. Chr., rund 190 Jahre später); Cornelius Nepos, Hannibal 4,3 (um 35 v. Chr.)' + ON('https://www.yorku.ca/pswarney/Texts/livy-22.htm') },
  { who: 'Hannibal', meta: 'Karthago · 247–183 v. Chr. · Feldherr', era: A, grp: F, cat: 'Führungsstil', rel: 'B',
    text: 'Für Schlaf und Wachen hatte er keine feste Zeit, weder bei Tag noch bei Nacht; er schlief erst, wenn die Arbeit getan war, ohne weiches Bett und ohne Stille. Viele sahen ihn in einen gewöhnlichen Soldatenmantel gewickelt zwischen den Wachen und Posten auf dem Boden liegen. Seine Kleidung hob ihn nicht von Gleichaltrigen ab, nur Waffen und Pferde fielen auf, und er ging als Erster in die Schlacht und verließ sie als Letzter.',
    kurz: 'schläft in einen einfachen Soldatenmantel gewickelt zwischen den Wachen',
    use: 'Lass Soldaten deinen Feldherrn nachts zwischen den Posten am Boden entdecken: Diese Begegnung erzählen sie weiter, lange nach jeder Rede.',
    src: 'Livius 21,4 (um 25 v. Chr., knapp 200 Jahre später; Livius schreibt sonst feindselig über ihn)' },
  { who: 'Fabius Maximus', meta: 'Rom · um 280–203 v. Chr. · Feldherr und Diktator', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Seinen Beinamen Verrucosus verdankte er einer kleinen Warze über der Lippe. Als Junge nannte man ihn wegen seiner Sanftheit und seines Ernstes „Lämmchen“ (Ovicula), und wer ihn nicht näher kannte, hielt ihn für langsam und dumm. 217 v. Chr. lagerte er stets in den Hügeln und folgte Hannibal mit Abstand, und seine eigenen Soldaten verspotteten ihn als „Hannibals Pädagogen“, als Sklaven, der hinter dem Schuljungen hergeht.',
    kurz: 'erträgt den Spott seiner Soldaten und folgt dem Feind weiter mit Abstand',
    use: 'Lass den Spottnamen, den die Soldaten deinem Feldherrn geben, im Rückblick genau seine Strategie beschreiben.',
    src: 'Plutarch, Fabius Maximus 1 und 5 (um 100 n. Chr., rund 300 Jahre später)' + ON('https://johndclare.net/AncientHistory/Hannibal_Sources5.html') },
  { who: 'Scipio Africanus', meta: 'Rom, Spanien und Afrika · 236–183 v. Chr. · Feldherr', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Im letzten Teil der Nacht stieg er oft aufs Kapitol, ließ den Schrein Jupiters öffnen und blieb lange allein darin, als berate er sich mit dem Gott; die Tempelhunde, die jeden anderen anfielen, bellten ihn nie an. Vor Neukarthago erklärte er dem Heer, Neptun habe ihm den Angriff im Schlaf eingegeben. Polybios, der Scipios Freund Laelius befragen konnte, hält dagegen: Mit einem Traum habe das gar nichts zu tun gehabt.',
    kurz: 'geht vor Tagesanbruch allein in einen Tempel, bevor er entscheidet',
    use: 'Sichtbare nächtliche Besuche bei einem Gott lassen die Befehle deines Feldherrn wie Offenbarungen klingen, und ein nüchterner Freund weiß, dass sie es nicht sind.',
    src: 'Aulus Gellius, Attische Nächte 6,1,6 (um 170 n. Chr., nach Autoren des 1. Jh. v. Chr.); Polybios 10,2–5 und 10,11 (um 150 v. Chr., eine Generation nach Scipios Tod)' + ON(GELL('6')) },
  { who: 'Cato der Ältere', meta: 'Rom · 234–149 v. Chr. · Feldherr, Konsul und Zensor', era: A, grp: F, cat: 'Sprache & Humor', rel: 'B',
    text: 'In den 150er Jahren v. Chr. ließ er im Senat eine libysche Feige aus seiner Toga fallen, um zu zeigen, wie nah und fruchtbar Karthago war. Seinen Abstimmungen fügte er immer denselben Satz an: „Meiner Meinung nach muss Karthago zerstört werden.“ Ein Spottvers begann: „Rothaarig, ein Schnapper und Beißer, mit trotzig blitzenden grauen Augen“.',
    kurz: 'beendet jede Rede mit demselben Satz',
    use: 'Ein Satz, der nach jeder Rede wiederkehrt, und ein Requisit im Gewand: So zermürbt dein Feldherr seine Gegner im Rat mit Worten.',
    src: 'Plutarch, Cato der Ältere 1 und 27 (um 100 n. Chr., rund 250 Jahre später, nach Catos eigenen Schriften)' + ON(PLUT('Cato_Major')) },
  { who: 'Cato der Ältere', meta: 'Rom · 234–149 v. Chr. · Feldherr, Konsul und Zensor', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'B',
    text: 'Im Feld trank er Wasser, bei großem Durst Essig, und auch als Prätor und Konsul trank er denselben Wein wie seine Sklaven. Sein Vorbild war Manius Curius, den samnitische Gesandte an seinem Herd beim Rübenkochen angetroffen hatten.',
    kurz: 'trinkt im Feld Wasser und denselben Wein wie seine Knechte',
    use: 'Lass die Genügsamkeit deines Feldherrn zur stillen Anklage gegen verwöhnte Offiziere werden, die sich an seinem Tisch nicht mehr trauen, nach besserem Wein zu fragen.',
    src: 'Plutarch, Cato der Ältere 1, 2 und 4 (um 100 n. Chr.)' + ON(PLUT('Cato_Major')) },
  { who: 'Scipio Aemilianus', meta: 'Rom · 185–129 v. Chr. · Feldherr, Zerstörer Karthagos', era: A, grp: F, cat: 'Körper & Gesten', rel: 'A',
    text: 'Als Karthago 146 v. Chr. brannte, weinte er offen um seine Feinde und zitierte Homer: „Einst wird kommen der Tag, da die heilige Ilios hinsinkt.“ Dann nahm er Polybios bei der Hand und sagte, er fürchte dasselbe Schicksal für Rom. Als junger Mann war er errötet, als er Polybios fragte, warum der immer nur mit seinem Bruder spreche.',
    kurz: 'weint um die Stadt, die er gerade niederbrennt',
    use: 'Die Tränen des Siegers über der brennenden Stadt sind echt und zugleich eine Vorstellung für den Chronisten an seiner Seite; lass den Leser beides sehen.',
    src: 'Polybios 38,21–22 (Augenzeuge, erhalten bei Plutarch und Appian, Punica 132) und 31,23–29 (Polybios war sein Lehrer und Freund)' + ON('https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/38*.html') },
  { who: 'Gaius Marius', meta: 'Rom · 157–86 v. Chr. · Feldherr', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Er hatte Krampfadern an beiden Beinen und ließ sich für die Operation nicht festbinden: Er hielt ein Bein hin und ertrug den Schnitt, ohne zu zucken. Als der Arzt zum zweiten Bein übergehen wollte, hielt er ihn auf, die Heilung sei den Schmerz nicht wert.',
    kurz: 'lässt sich ohne Fesseln operieren, bricht aber nach der Hälfte ab',
    use: 'Dein Feldherr erträgt Schmerz öffentlich als Beweis seiner Autorität und gesteht nur ein einziges Mal eine Grenze ein; dieser Moment sagt mehr über ihn als jede Heldentat.',
    src: 'Plutarch, Marius 6 (um 100 n. Chr., rund 190 Jahre später)' + ON(PLUT('Marius')) },
  { who: 'Gaius Marius', meta: 'Rom · 157–86 v. Chr. · Feldherr', era: A, grp: F, cat: 'Führungsstil', rel: 'B',
    text: 'Seine Soldaten mussten ihr Gepäck selbst tragen und ihr Essen selbst kochen. Wer das klaglos ertrug, hieß bald „Maultier des Marius“.',
    kurz: 'lässt seine Soldaten ihr Gepäck selbst tragen und ihr Essen selbst kochen',
    use: 'Lass deine Soldaten den Spottnamen, den ihnen die harte Schule ihres Feldherrn einträgt, irgendwann mit Stolz tragen.',
    src: 'Plutarch, Marius 13 (um 100 n. Chr.)' + ON(PLUT('Marius')) },
  { who: 'Gaius Marius', meta: 'Rom · 157–86 v. Chr. · Feldherr', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Im Krieg gegen Kimbern und Teutonen ließ er eine syrische Prophetin namens Martha in einer Sänfte mitführen und opferte nach ihren Anweisungen; dabei trug sie ein doppeltes Purpurgewand mit Spange und einen mit Bändern und Kränzen umwundenen Speer. Vor Siegen sah man stets zwei Geier über seinem Heer. Die Soldaten hatten sie einst gefangen und ihnen Bronzeringe angelegt, erkannten sie daran und jubelten, wenn sie erschienen.',
    kurz: 'führt eine eigene Seherin in einer Sänfte mit',
    use: 'Ein Feldherr mit eigener Seherin und markierten Vorzeichen vereint Frömmigkeit und Bühnentechnik, und ein Gegner, der die beringten Vögel abschießen lässt, trifft das Heer ins Herz.',
    src: 'Plutarch, Marius 17 (um 100 n. Chr., rund 200 Jahre später)' + ON(PLUT('Marius')) },
  { who: 'Sulla', meta: 'Rom · 138–78 v. Chr. · Feldherr und Diktator', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'In der Schlacht trug er stets ein kleines goldenes Apollonbild aus Delphi im Bausch seiner Tunika. Als 82 v. Chr. am Collinischen Tor seine Linie zu brechen drohte, zog er es hervor und betete laut zu ihm. Er glaubte an Träume, schrieb seine Erfolge dem Glück zu und nannte sich Felix, „der Glückliche“.',
    kurz: 'trägt im Kampf ein kleines goldenes Götterbild am Leib',
    use: 'Ein Talisman, den dein Feldherr im entscheidenden Moment berührt, wird für seine Männer zum Signal, und sein Verlust wäre eine Katastrophe.',
    src: 'Plutarch, Sulla 29 und 34 (um 100 n. Chr., teils nach Sullas eigenen Memoiren)' + ON(PLUT('Sulla')) },
  { who: 'Sulla', meta: 'Rom · 138–78 v. Chr. · Feldherr und Diktator', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Seine grauen Augen hatten einen schrecklich scharfen, kraftvollen Glanz, noch beängstigender durch ein Gesicht voller grober roter Flecken mit Weiß dazwischen. Spötter in Athen sangen, er sei eine „mit Mehl bestäubte Maulbeere“.',
    kurz: 'hat ein fleckiges Gesicht, über das der Feind Spottlieder singt',
    use: 'Ein auffälliges Gesicht macht deinen Feldherrn zur leichten Beute für Spottverse, und wie er auf den Spott antwortet, sagt mehr über ihn als jede Schlacht.',
    src: 'Plutarch, Sulla 2 (um 100 n. Chr.)' + ON(PLUT('Sulla')) },
  { who: 'Sertorius', meta: 'Spanien · um 126–73 v. Chr. · römischer Rebellenfeldherr', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Ein spanischer Bauer namens Spanus schenkte ihm eine schneeweiße Hirschkuh, die er so zähmte, dass sie auf Ruf kam und ihn auf Spaziergängen begleitete. Er erklärte sie zum Geschenk Dianas, das ihm Verborgenes enthülle: Hatte er geheime Nachrichten über den Feind, sagte er, die Hirschkuh habe ihn im Traum gewarnt. Als sie einmal verloren ging und wiedergefunden wurde, bezahlte er die Finder für ihr Schweigen, verkündete Tage später einen glückverheißenden Traum und ließ sie vor seinem Richterstuhl frei; sie sprang zu ihm, legte den Kopf in seinen Schoß, und die Menge jubelte.',
    kurz: 'erklärt, ein zahmes weißes Tier verrate ihm im Traum Geheimnisse',
    use: 'Ein Tier, das für deinen Feldherrn „spricht“, erklärt Wissen, dessen Quelle er nicht verraten darf, und erlaubt ihm inszenierte Wiedersehen.',
    src: 'Plutarch, Sertorius 11 und 20 (um 100 n. Chr., rund 170 Jahre später; Plutarch nennt es offen einen Kunstgriff)' + ON(PLUT('Sertorius')) },
  { who: 'Surena', meta: 'Parthien und Mesopotamien · um 84–52 v. Chr. · Feldherr, Sieger von Carrhae', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Er war der größte und schönste Mann im Heer der Parther, von fast weiblicher Schönheit, und kämpfte nach medischer Art mit geschminktem Gesicht und gescheiteltem Haar, während die anderen ihr Haar lang und furchterregend über der Stirn trugen. Auf privaten Reisen begleiteten ihn tausend Lastkamele, zweihundert Wagen für seine Konkubinen und tausend gepanzerte Reiter. Nach <a href="#carrhae">Carrhae</a> inszenierte er einen Spott-Triumph, bei dem ein Gefangener, der Crassus ähnelte, in königlichem Frauengewand mitritt.',
    kurz: 'zieht geschminkt und mit gescheiteltem Haar in die Schlacht',
    use: 'Lass Gegner das geschminkte Gesicht deines Feldherrn unterschätzen, bis es zu spät ist, und ihn nach dem Sieg den Spott als Waffe einsetzen.',
    src: 'Plutarch, Crassus 21, 24 und 32 (um 100 n. Chr., rund 150 Jahre später, aus römischer Sicht)' + ON(PLUT('Crassus')) },
  { who: 'Pompeius', meta: 'Rom · 106–48 v. Chr. · Feldherr', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: '56 v. Chr. stimmten die Banden des Clodius auf dem Forum einen Sprechchor gegen ihn an: „Wer kratzt sich mit einem Finger am Kopf?“ Und die Menge brüllte jedes Mal zurück: „Pompeius!“',
    use: 'Eine harmlose Geste wird zur Waffe, sobald Gegner sie zum Sprechchor machen; lass deinen Feldherrn hören, wie die Menge seine Eigenheit gegen ihn skandiert.',
    src: 'Plutarch, Pompeius 48 (um 100 n. Chr.)' },
  { who: 'Gaius Iulius Caesar', meta: 'Rom · 100–44 v. Chr. · Feldherr und Diktator', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Er pflegte seinen Körper peinlich genau, manche sagten, er lasse sich sogar überflüssige Haare auszupfen. Die Glatze quälte ihn: Er kämmte sein dünnes Haar nach vorn und schätzte von allen Ehren das Recht am meisten, ständig einen Lorbeerkranz zu tragen. Cicero sagte, wenn er Caesars sorgfältig gelegtes Haar sehe und wie er sich mit einem Finger am Kopf kratze, könne er nicht glauben, dass dieser Mann die Republik stürzen werde.',
    kurz: 'kratzt sich mit einem Finger am Kopf, um die Frisur zu schonen',
    use: 'Eine kleine Geste, die eine Eitelkeit schützt: Wer sie als harmlose Geckenhaftigkeit abtut, irrt sich tödlich.',
    src: 'Sueton, Caesar 45 (um 120 n. Chr., rund 165 Jahre später); Plutarch, Caesar 4 (um 100 n. Chr., nach Cicero, einem Zeitgenossen)' + ON(SUET_I) },
  { who: 'Gaius Iulius Caesar', meta: 'Rom · 100–44 v. Chr. · Feldherr und Diktator', era: A, grp: F, cat: 'Arbeitsweise', rel: 'B',
    text: 'Er war schmächtig und blass, litt an Kopfschmerzen und epileptischen Anfällen und behandelte das Soldatenleben selbst als Kur. Meist schlief er in Wagen oder Sänften, neben sich einen Sklaven, der unterwegs Diktate aufnahm, und zu Pferd diktierte er zwei Schreibern gleichzeitig Briefe. Plinius der Ältere spricht sogar von vier Briefen zugleich, sieben, wenn er sonst nichts zu tun hatte.',
    kurz: 'diktiert vom Pferd aus zwei Schreibern gleichzeitig Briefe',
    use: 'Der Wagen deines Feldherrn ist ein rollendes Amtszimmer, und seine Anfälle sind das Geheimnis, das sein Stab um jeden Preis hüten muss.',
    src: 'Plutarch, Caesar 17 (um 100 n. Chr.); Sueton, Caesar 45 (um 120 n. Chr.); Plinius der Ältere, Naturalis historia 7,91 (77 n. Chr.)' + ON(PLUT('Caesar')) },
  { who: 'Gaius Iulius Caesar', meta: 'Rom · 100–44 v. Chr. · Feldherr und Diktator', era: A, grp: F, cat: 'Sprache & Humor', rel: 'B',
    text: 'Als er 47 v. Chr. beim Landen in Afrika stolperte und fiel, rief er „Ich halte dich fest, Afrika!“ und machte so aus dem bösen Omen ein gutes. Weil eine Prophezeiung sagte, die Scipionen könnten in Afrika nicht verlieren, hielt er einen verachteten Angehörigen der Familie mit dem Spitznamen Salvito in seinem Lager. Seine Truppen nannte er „Kameraden“ und scherzte, sie kämpften selbst nach Parfum duftend gut.',
    kurz: 'verwandelt einen Sturz beim Landen mit einem Satz in ein gutes Omen',
    use: 'Dein Feldherr ist schneller als das Omen: Ein einziger Satz verwandelt die Panik seiner Männer in Zuversicht.',
    src: 'Sueton, Caesar 59 und 67 (um 120 n. Chr.)' + ON(SUET_I) },
  { who: 'Gaius Iulius Caesar', meta: 'Rom · 100–44 v. Chr. · Feldherr und Diktator', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'C',
    text: 'Sueton erzählt, wohl schon halb als Legende, Caesar habe ein Pferd mit fast menschlichen, zehenartigen Hufen geritten. Die Opferschauer sagten, es verheiße seinem Herrn die Herrschaft über die Welt, und es ließ niemand anderen aufsitzen.',
    kurz: 'reitet ein seltsames Pferd, das niemand sonst auf seinem Rücken duldet',
    use: 'Ein Pferd, das nur seinen Herrn trägt, ist ein Zeichen, an das die Soldaten glauben wollen, und eine Gelegenheit für einen Gegner, der es stehlen lässt.',
    src: 'Sueton, Caesar 61 (um 120 n. Chr.)' + ON(SUET_I) },
  { who: 'Augustus', meta: 'Rom · 63 v. Chr.–14 n. Chr. · erster Kaiser', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Als 9 n. Chr. drei Legionen unter Varus in Germanien vernichtet wurden, ließ er sich monatelang Bart und Haar nicht schneiden. Manchmal schlug er den Kopf gegen eine Tür und rief: „Quintilius Varus, gib mir die Legionen zurück!“ Den Jahrestag beging er als Trauertag.',
    kurz: 'lässt nach einer Katastrophe monatelang Bart und Haar wachsen',
    use: 'Der beherrschte Herrscher bricht ein einziges Mal zusammen, hinter einer geschlossenen Tür, und die Diener flüstern noch Jahre später davon.',
    src: 'Sueton, Augustus 23 (um 120 n. Chr., rund 110 Jahre später); Cassius Dio 56,23 (um 220 n. Chr.)' + ON(SUET_A) },
  { who: 'Augustus', meta: 'Rom · 63 v. Chr.–14 n. Chr. · erster Kaiser', era: A, grp: F, cat: 'Führungsstil', rel: 'B',
    text: 'Seine Lieblingssprüche lauteten „Eile mit Weile“ (griechisch speude bradeos, später lateinisch festina lente), „Ein vorsichtiger Feldherr ist besser als ein kühner“ und „Schnell genug geschieht, was gut genug geschieht“. Wer für kleine Gewinne viel riskierte, glich für ihn einem, der mit goldenem Haken angelt: Kein Fang wiegt den Verlust des Hakens auf. Vor einer Seeschlacht 36 v. Chr. schlief er so tief, dass ihn seine Freunde zum Signalgeben wecken mussten, und Antonius spottete, er habe auf dem Rücken gelegen und in den Himmel gestarrt.',
    kurz: 'zitiert ständig „Eile mit Weile“ und meidet jedes unnötige Risiko',
    use: 'Ein unheroischer Feldherr, der durch Geduld siegt: Die Witze seiner Feinde über seine Feigheit werden Teil seiner Tarnung.',
    src: 'Sueton, Augustus 16 und 25 (um 120 n. Chr.); Antonius’ Spott ist zeitgenössische Propaganda' + ON(SUET_A) },
  { who: 'Augustus', meta: 'Rom · 63 v. Chr.–14 n. Chr. · erster Kaiser', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Seit ihn auf einem nächtlichen Marsch ein Blitz gestreift hatte, fürchtete er Donner und Blitz. Er trug immer und überall ein Robbenfell als Schutz bei sich und zog sich bei jedem Anzeichen eines schweren Unwetters in einen unterirdischen, gewölbten Raum zurück.',
    kurz: 'flieht bei Gewitter in ein Gewölbe und trägt ein Robbenfell als Schutz',
    use: 'Eine Angst mit klarer Ursache und festem Gegenmittel macht deinen Feldherrn menschlich, und ein Gewitter am Morgen der Schlacht wird zur Prüfung.',
    src: 'Sueton, Augustus 29 und 90 (um 120 n. Chr., gut 100 Jahre später)' },
  { who: 'Augustus', meta: 'Rom · 63 v. Chr.–14 n. Chr. · erster Kaiser', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Wurde ihm morgens der Schuh falsch angezogen, der linke statt des rechten, hielt er das für ein böses Vorzeichen. Fiel dagegen leichter Regen, wenn er zu einer langen Reise aufbrach, verhieß das eine schnelle und glückliche Rückkehr.',
    kurz: 'deutet einen falsch angezogenen Schuh am Morgen als böses Zeichen',
    use: 'Ein Diener, der die Schuhe verwechselt, kann deinem Feldherrn den Tag verderben, und ein Gegenspieler, der davon weiß, kann es absichtlich geschehen lassen.',
    src: 'Sueton, Augustus 92 (um 120 n. Chr.)' },
  { who: 'Augustus', meta: 'Rom · 63 v. Chr.–14 n. Chr. · erster Kaiser', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Er trug Schuhe mit etwas erhöhten Sohlen, um größer zu wirken. Zu Hause trug er meist Kleidung, die seine Schwester, seine Frau, seine Tochter und seine Enkelinnen gewebt hatten.',
    kurz: 'trägt Schuhe mit erhöhten Sohlen, um größer zu wirken',
    use: 'Eine kleine Eitelkeit wie erhöhte Sohlen verrät, wo sich dein mächtiger Feldherr selbst für zu klein hält.',
    src: 'Sueton, Augustus 73 (um 120 n. Chr.)' },
  { who: 'Augustus', meta: 'Rom · 63 v. Chr.–14 n. Chr. · erster Kaiser', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'B',
    text: 'Er schlief nie mehr als sieben Stunden, und auch die nicht am Stück: Drei- oder viermal wachte er auf. Konnte er nicht wieder einschlafen, ließ er Vorleser oder Erzähler kommen.',
    kurz: 'lässt sich nachts Geschichten erzählen, wenn er nicht schlafen kann',
    use: 'Die nächtlichen Erzähler deines Feldherrn hören mehr, als ihnen lieb ist, und jemand am Hof wird versuchen, sie auszufragen.',
    src: 'Sueton, Augustus 78 (um 120 n. Chr.)' },
  { who: 'Tiberius', meta: 'Rom · 42 v. Chr.–37 n. Chr. · Feldherr und Kaiser', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Vor Donner hatte er über alle Maßen Angst. Sah der Himmel bedrohlich aus, trug er stets einen Lorbeerkranz, weil der Blitz diese Blätter angeblich nie trifft.',
    kurz: 'setzt bei drohendem Gewitter einen Lorbeerkranz auf',
    use: 'Ein Kranz als Blitzschutz ist ein Aberglaube, den jeder sehen kann: Lass Soldaten am Himmel ablesen, ob ihr Feldherr heute den Kranz tragen wird.',
    src: 'Sueton, Tiberius 69 (um 120 n. Chr.)' },
  { who: 'Claudius', meta: 'Rom · 10 v. Chr.–54 n. Chr. · Kaiser', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Er war ein leidenschaftlicher Würfelspieler, schrieb sogar ein Buch über das Spiel und spielte auch auf Reisen, auf einem Brett, das so in seinen Wagen eingepasst war, dass nichts verrutschte.',
    kurz: 'spielt auf Reisen an einem in den Wagen eingebauten Spielbrett',
    use: 'Ein Spielbrett im Reisewagen verrät, wo dein Feldherr Ruhe findet, und wer mit ihm spielen darf, gehört zum engsten Kreis.',
    src: 'Sueton, Claudius 33 (um 120 n. Chr.)' },
  { who: 'Claudius', meta: 'Rom · 10 v. Chr.–54 n. Chr. · Kaiser', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Sueton beschreibt einen Körper, der ihn verriet: Sein Lachen war unschicklich, sein Zorn noch hässlicher, mit Schaum vor dem Mund und laufender Nase. Er stotterte, und sein Kopf zitterte ständig, am stärksten bei der kleinsten Anstrengung.',
    use: 'Lass Gegner deinen Herrscher wegen seines zitternden Kopfes unterschätzen, und zeig dem Leser, wie viel Kraft es ihn kostet, trotzdem vor den Rat zu treten.',
    src: 'Sueton, Claudius 30 (um 120 n. Chr.)' },
  { who: 'Vespasian', meta: 'Rom · 9–79 n. Chr. · Feldherr und Kaiser', era: A, grp: F, cat: 'Sprache & Humor', rel: 'B',
    text: 'Schon todkrank scherzte er: „Weh mir, ich glaube, ich werde ein Gott.“ Am Ende sagte er, ein Kaiser müsse stehend sterben, und starb in den Armen derer, die ihm aufhalfen.',
    kurz: 'scherzt noch auf dem Sterbebett über seinen eigenen Nachruhm',
    use: 'Ein Feldherr, der noch im Sterben scherzt, nimmt seinen Männern die Angst, und ein letzter Satz wie dieser wird im Heer zur Legende.',
    src: 'Sueton, Vespasian 23–24 (um 120 n. Chr., rund 40 Jahre später)' },
  { who: 'Domitian', meta: 'Rom · 51–96 n. Chr. · Kaiser', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Zu Beginn seiner Herrschaft verbrachte er täglich Stunden allein damit, Fliegen zu fangen und mit einem spitzen Schreibgriffel aufzuspießen. Als jemand fragte, ob jemand beim Kaiser sei, antwortete Vibius Crispus: „Nicht einmal eine Fliege.“',
    kurz: 'spießt in einsamen Stunden Fliegen mit einem Schreibgriffel auf',
    use: 'Eine einsame, grausame Spielerei, über die der Hof heimlich Witze reißt, verrät mehr über deinen Herrscher als jede öffentliche Grausamkeit.',
    src: 'Sueton, Domitian 3 (um 120 n. Chr.)' },
  { who: 'Mark Aurel', meta: 'Rom · 121–180 · Kaiser', era: A, grp: F, cat: 'Arbeitsweise', rel: 'A',
    text: 'Seine „Selbstbetrachtungen“, griechische Notizen an sich selbst, schrieb er während der Kriege an der Donau. Das erste Buch endet mit dem Vermerk „Bei den Quaden am Granua“, ein anderes mit „In Carnuntum“.',
    kurz: 'schreibt im Feldlager Notizen an sich selbst, nicht für andere',
    use: 'Ein Heft mit Ermahnungen an sich selbst ist das gefährlichste Dokument im Lager deines Feldherrn: Wer es liest, kennt seine Zweifel.',
    src: 'Mark Aurel, Selbstbetrachtungen 1 und 2 (um 170–180, eigene Notizen)' },
  { who: 'Constantius II.', meta: 'Rom · 317–361 · Kaiser', era: A, grp: F, cat: 'Körper & Gesten', rel: 'A',
    text: 'Bei seinem Einzug in Rom 357 stand er im Wagen „wie ein Standbild“: Obwohl er klein war, bückte er sich unter hohen Toren, blickte starr geradeaus und drehte den Kopf weder nach rechts noch nach links. Er spuckte nicht, wischte sich nicht die Nase und bewegte keine Hand.',

  ['Nero spielte Geige, während Rom brannte.', 'Geigen gab es noch nicht: Tacitus lässt Nero beim Ausbruch des Feuers in Antium sein und erwähnt nur ein Gerücht, er habe vom Untergang Trojas gesungen, Sueton lässt ihn im Bühnenkostüm „Die Einnahme Trojas“ singen.', 'Tacitus, Annalen 15,39; Sueton, Nero 38'],
  ['Caligula machte sein Pferd zum Konsul.', 'Sueton schreibt nur, er habe es angeblich vorgehabt, Cassius Dio, er habe es versprochen; geschehen ist es nie.', 'Sueton, Caligula 55; Cassius Dio 59,14'],
  ['Caesar starb mit den Worten „Et tu, Brute?“', 'Das ist Shakespeare: Sueton schreibt, Caesar sei vielleicht stumm gestorben oder habe Brutus auf Griechisch geantwortet: „Auch du, mein Kind?“', 'Sueton, Caesar 82'],

  ['Hannibal sprengte Alpenfelsen mit Feuer und Essig.', 'Das erzählt nur Livius; im Parallelbericht des Polybios gibt es weder Feuer noch Essig, die Geschichte ist also umstritten.', 'Livius 21,37; Polybios 3,54–56'],

  ['Ramses II. gewann die Schlacht bei Kadesch allein.', 'Das ist seine eigene Propaganda: Ägyptische Verstärkung erreichte das Schlachtfeld noch während der Kämpfe (siehe <a href="#kadesch">Kadesch</a>).', 'Forschungsstand'],
