    src: 'Sima Qian, Shiji 109 (um 94 v. Chr.; Sima Qian kannte ihn persönlich)' },
  { who: 'Huo Qubing', meta: 'China · 140–117 v. Chr. · General der Han', era: A, grp: F, cat: 'Führungsstil', rel: 'A',
    text: 'Der Kaiser schickte ihm Dutzende Wagen mit Essen aus der Palastküche; auf dem Rückweg wurden gutes Getreide und Fleisch weggeworfen, während manche seiner Soldaten hungerten. Jenseits der Grenze, als die Vorräte so knapp waren, dass manche Männer nicht mehr stehen konnten, ließ er noch einen Platz zum Ballspielen anlegen.',
    kurz: 'lässt Ball spielen, während seine Männer vor Hunger kaum stehen',
    use: 'Gib einem glänzenden jungen Rivalen deines Feldherrn diese Blindheit für den Hunger seiner Leute, damit der Unterschied ohne ein Wort sichtbar wird.',
    src: 'Sima Qian, Shiji 111 (um 94 v. Chr., Zeitgenosse)' },
  { who: 'Lian Po', meta: 'China · 3. Jh. v. Chr. · General von Zhao', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'B',
    text: 'Um dem Gesandten des Königs zu zeigen, dass er im Alter noch kämpfen konnte, aß er auf einen Sitz einen Dou Reis und zehn Jin Fleisch und stieg in Rüstung aufs Pferd. Der Gesandte, von einem Rivalen bestochen, meldete: „General Lian ist alt, isst aber noch gut. Während er mit mir saß, musste er allerdings dreimal austreten.“',
    kurz: 'isst vor fremden Zeugen gewaltig, um seine Kraft zu beweisen',
    use: 'Lass einen alten Feldherrn seine Kraft vorführen und mach ihn abhängig vom Bericht eines Zeugen, den sein Rivale bestochen hat.',
    src: 'Sima Qian, Shiji 81 (um 94 v. Chr., rund 150 Jahre später)' },
  { who: 'Cao Cao', meta: 'China · 155–220 · Kriegsherr und Kanzler der Han, Begründer von Wei', era: A, grp: F, cat: 'Sprache & Humor', rel: 'C',
    text: 'Eine feindselige Schmähschrift aus dem Rivalenstaat Wu zeigt ihn in leichter Seide, mit einem Lederbeutelchen am Gürtel für Taschentuch und Kleinkram, von morgens bis abends umgeben von Musikern und Schauspielern. Bei Tisch lachte er so heftig, dass sein Kopf in Becher und Schüsseln sank und sein Kopftuch voller Essen war.',
    kurz: 'lacht bei Tisch so heftig, dass sein Kopf in die Schüssel fällt',
    use: 'Lass deinen Feldherrn im Kreis der Vertrauten jede Würde ablegen, und lass einen Feind genau diese Szenen sammeln und verbreiten.',
    src: 'Cao Man zhuan, anonyme Schmähschrift aus Wu (3. Jh.), überliefert in Pei Songzhis Kommentar zum Sanguozhi 1 (429)' },
  { who: 'Cao Cao', meta: 'China · 155–220 · Kriegsherr und Kanzler der Han, Begründer von Wei', era: A, grp: F, cat: 'Führungsstil', rel: 'C',
    text: 'Auf einem Marsch durch Weizenfelder hatte er seinen Truppen verboten, das Korn zu zertreten. Als sein eigenes Pferd scheute und in den Weizen sprang, zog er das Schwert und schnitt sich anstelle eines Todesurteils die Haare ab: „Ein Feldherr kann sich nicht selbst töten.“ Das erzählt dieselbe feindselige Schrift, doch das Abschneiden der Haare war damals eine anerkannte Strafe.',
    kurz: 'bestraft sich selbst öffentlich, wenn er gegen eigene Befehle verstößt',
    use: 'Eine theatralische Selbstbestrafung zeigt dem Heer, dass die Regeln für alle gelten; lass den Leser merken, dass sie deinen Feldherrn fast nichts kostet.',
    src: 'Cao Man zhuan, anonyme Schmähschrift aus Wu (3. Jh.), überliefert in Pei Songzhis Kommentar zum Sanguozhi 1 (429)' },
  { who: 'Liu Bei', meta: 'China · 161–223 · Kriegsherr und Kaiser von Shu', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Seine Arme reichten bis unter die Knie, und er konnte seine eigenen Ohren sehen.',
    kurz: 'hat Arme, die ihm bis unter die Knie reichen',
    use: 'Gib deinem Feldherrn ein einziges auffälliges Körpermerkmal, an dem Freund und Feind ihn schon von Weitem erkennen.',
    src: 'Chen Shou, Sanguozhi 32 (um 285, gut 60 Jahre später)' },
  { who: 'Liu Bei', meta: 'China · 161–223 · Kriegsherr und Kaiser von Shu', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Nach Jahren ohne Feldzug als Gast Liu Biaos bemerkte er auf dem Abtritt, dass an der Innenseite seiner Schenkel wieder Fett gewachsen war, und weinte: Er sei so lange nicht mehr im Sattel gewesen, dass sein Leben ohne Taten verrinne.',
    kurz: 'weint, als er merkt, dass er zu lange nicht im Sattel saß',
    use: 'Lass deinen Feldherrn den Frieden als körperlichen Verfall spüren, dann sucht er jeden Vorwand für einen Krieg, und sein Gastgeber ahnt es.',
    src: 'Jiuzhou chunqiu, zitiert in Pei Songzhis Anmerkungen zum Sanguozhi (429)' },
  { who: 'Liu Bei', meta: 'China · 161–223 · Kriegsherr und Kaiser von Shu', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'C',
    text: 'Eine Anekdote: Jemand schenkte ihm Yakschwänze, und er saß da und flocht eigenhändig Zierrat daraus, bis Zhuge Liang ihn fragte, ob ein Feldherr mit großen Zielen nichts Besseres zu tun habe.',
    kurz: 'flicht eigenhändig Zierrat aus Tierhaaren, bis ein Berater ihn tadelt',
    use: 'Gib deinem Feldherrn eine Handarbeit, die ihn beruhigt und die seine Berater für Müßiggang halten.',
    src: 'Weilüe, zitiert bei Pei Songzhi (429)' },
  { who: 'Guan Yu', meta: 'China · gest. 220 · General Liu Beis', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Ein Pfeil hatte ihm einst den linken Arm durchschlagen; die Wunde heilte, doch bei nassem Wetter schmerzte der Knochen, und ein Arzt erklärte, die Spitze sei vergiftet gewesen. Guan Yu ließ sich den Arm beim Essen mit seinen Offizieren aufschneiden und den Knochen abschaben, das Blut füllte die Schüsseln, und er schnitt weiter Fleisch, trank Wein, redete und lachte wie immer. Der Arzt bleibt namenlos, und von einem Brettspiel weiß die Geschichtsschreibung nichts.',
    kurz: 'lässt sich beim Essen den Knochen abschaben und lacht dabei',
    use: 'Mach Schmerz zur Vorstellung vor Publikum, und lass einen Offizier bemerken, wie viel Kraft das Lachen deinen Feldherrn kostet.',
    src: 'Chen Shou, Sanguozhi 36 (um 280–290, rund 60–70 Jahre später)' },
  { who: 'Guan Yu', meta: 'China · gest. 220 · General Liu Beis', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Auf seinen Bart war er eitel. Als er auf einen neu angekommenen General eifersüchtig war, beruhigte ihn Zhuge Liang mit einem Brief, der ihn einfach „den Bart“ nannte, und Guan Yu zeigte den Brief seinen Gästen.',
    kurz: 'ist eitel auf seinen Bart und zeigt jedes Lob herum',
    use: 'Gib deinem Feldherrn eine einzige Eitelkeit, durch die ein kluger Verbündeter jederzeit zu ihm durchdringen kann.',
    src: 'Chen Shou, Sanguozhi 36 (um 280–290, rund 60–70 Jahre später)' },
  { who: 'Sima Yi', meta: 'China · 179–251 · General und Regent von Wei', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Er war ein Meister des Krankspielens: Um 201 stellte er sich gelähmt, um Cao Caos Ruf nicht folgen zu müssen. Im Jahr 249, wenige Wochen vor seinem Staatsstreich, empfing er den Boten eines Rivalen, ließ sein Gewand herabgleiten, verstand die Fragen falsch und ließ sich Reisbrei über die Brust laufen.',
    kurz: 'spielt den hinfälligen Greis, bis der Augenblick zum Zuschlagen kommt',
    use: 'Lass deinen Feldherrn so überzeugend krank spielen, dass auch der Leser ihn abschreibt, bis zum Schlag.',
    src: 'Wei mo zhuan, in Pei Songzhis Anmerkungen zum Sanguozhi 9 (429); Jin shu 1 (646–648, rund 400 Jahre später)' },
  { who: 'Sima Yi', meta: 'China · 179–251 · General und Regent von Wei', era: A, grp: F, cat: 'Arbeitsweise', rel: 'B',
    text: 'Im Feldzug gegen Zhuge Liang 234 fragte er den feindlichen Boten nichts über das Heer, nur nach Schlaf, Essen und Arbeitslast seines Herrn. Als er hörte, Zhuge stehe früh auf, gehe spät zu Bett, prüfe jede Strafe ab zwanzig Stockschlägen selbst und esse sehr wenig, sagte er: „Zhuge Liang wird bald sterben.“',
    kurz: 'fragt Gesandte nur nach Schlaf und Essen ihres Feldherrn',
    use: 'Gib deinem Feldherrn einen Gegner, der seinen Schlaf und seine Mahlzeiten studiert statt seiner Truppen.',
    src: 'Wei shi chunqiu (4. Jh.), in Pei Songzhis Anmerkungen zum Sanguozhi 35 (429)' + ON('https://en.wikipedia.org/wiki/Zhuge_Liang') },
  { who: 'Sima Yi', meta: 'China · 179–251 · General und Regent von Wei', era: A, grp: F, cat: 'Körper & Gesten', rel: 'C',
    text: 'Die Jin-Chronik erzählt vom „Wolfsblick“: Befahl man ihm, sich im Gehen umzusehen, drehte er das Gesicht ganz nach hinten, während der Körper nach vorn gerichtet blieb. Das ist ein feindseliges Vorzeichen für Verrat, aufgeschrieben, nachdem seine Familie den Thron bestiegen hatte.',
    use: 'Lass Feinde deinem Feldherrn ein unheimliches Körpermerkmal andichten, das mehr über ihre Angst verrät als über ihn.',
    src: 'Jin shu 1 (646–648, rund 400 Jahre später)' },
  { who: 'Zhuge Liang', meta: 'China · 181–234 · Kanzler und Feldherr von Shu', era: A, grp: F, cat: 'Arbeitsweise', rel: 'B',
    text: 'Als junger Mann auf dem Land sang er gern das Lied „Liangfu yin“, saß mit den Armen um die Knie und stieß einen langen, pfeifenden Gesang aus, und er verglich sich mit dem großen Minister Guan Zhong und dem Feldherrn Yue Yi, was ihm niemand abnahm. Im Feld gab er nichts aus der Hand: früh auf, spät im Bett, jede Strafe selbst geprüft, kaum etwas gegessen. Den weißen Federfächer kennen erst spätere Quellen, berühmt machte ihn der Roman.',
    kurz: 'misst sich laut an den größten Helden, was niemand ernst nimmt',
    use: 'Gib deinem Strategen eine einzige sichtbare Marotte, den Vergleich mit großen Helden, und lass ihn sich zu Tode arbeiten, weil er nichts aus der Hand gibt.',
    src: 'Chen Shou, Sanguozhi 35 (280er Jahre; Chen war selbst Beamter in Shu), mit Weilüe und Wei shi chunqiu in Pei Songzhis Anmerkungen (429)' + ON('https://en.wikipedia.org/wiki/Zhuge_Liang') },
  { who: 'Gan Ning', meta: 'China · gest. um 220 · General von Wu', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Als junger Anführer von Flusspiraten in Ba zog er mit einer Bande voller Bogen und Armbrüste umher, Federn an den Hüten und Glöckchen am Körper, damit man sie kommen hörte. Beim Anlegen vertäuten sie ihre Boote mit Seide und schnitten sie beim Ablegen einfach ab, als Zeichen ihrer Verschwendung.',
    kurz: 'trägt Glöckchen am Körper, damit man ihn kommen hört',
    use: 'Lass die Glöckchen eines früheren Gesetzlosen ihn ankündigen, bevor er da ist, zum Ärger der disziplinierten Offiziere, was er genau weiß.',
    src: 'Chen Shou, Sanguozhi 55 (280er Jahre, rund 60 Jahre später); Wu shu (3. Jh.), bei Pei Songzhi (429)' + ON('https://en.wikipedia.org/wiki/Gan_Ning') },
  { who: 'Gan Ning', meta: 'China · gest. um 220 · General von Wu', era: A, grp: F, cat: 'Führungsstil', rel: 'B',
    text: 'Vor seinem Nachtangriff mit etwa hundert Mann auf Cao Caos Lager zögerte einer seiner Offiziere, den Wein anzunehmen. Gan Ning legte das blanke Schwert über seine Knie und fragte, warum der Offizier den Tod fürchte, wenn er selbst es nicht tue.',
    kurz: 'legt vor einem Wagnis das blanke Schwert über die Knie',
    use: 'Lass ein stummes Bild wie das Schwert auf den Knien eine ganze Rede ersetzen und den Zögernden zwingen, vor allen zu entscheiden.',
    src: 'Chen Shou, Sanguozhi 55 (280er Jahre, rund 60 Jahre später); Wu shu (3. Jh.), bei Pei Songzhi (429)' + ON('https://en.wikipedia.org/wiki/Gan_Ning') },
  { who: 'Tan Daoji', meta: 'China · gest. 436 · General der Liu-Song-Dynastie', era: A, grp: F, cat: 'Arbeitsweise', rel: 'B',
    text: 'Auf dem Rückzug 431, ohne Getreide, ließ er seine Männer die ganze Nacht laut „Getreide messen“ und die Zahlen ausrufen, doch was sie schütteten, war Sand mit einer dünnen Schicht Reis darüber. Die feindlichen Späher meldeten reichlich Vorräte, und die Verfolgung wurde abgebrochen. Später hieß es, von Tan Daojis 36 Listen sei der Rückzug die beste gewesen.',
    kurz: 'lässt nachts laut Sand als Getreide abmessen, damit der Feind mithört',
    use: 'Nutze Lärm als Tarnung: Der Feind glaubt, was er hört, gerade weil er es heimlich belauscht.',
    src: 'Shen Yue, Song shu 43 (487–488, rund 50 Jahre später); Nan shi 15; Zizhi tongjian 122–123; der Spott über die 36 Listen im Nan Qi shu (6. Jh.)' + ON('https://en.wikipedia.org/wiki/Tan_Daoji') },
  { who: 'Tan Daoji', meta: 'China · gest. 436 · General der Liu-Song-Dynastie', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Als man ihn 436 als angeblichen Verräter verhaftete, soll er mit Augen „wie Fackeln“ ein riesiges Maß auf einen Zug geleert, sein Kopftuch heruntergerissen, zu Boden geschleudert und gerufen haben: „So zerstört ihr eure eigene Große Mauer!“',
    kurz: 'wirft seinen Anklägern zuletzt die Kopfbedeckung vor die Füße',
    use: 'Gib der letzten Geste deines gestürzten Feldherrn die Kraft einer Rede an die Nachwelt: kurz, laut, unvergesslich.',
    src: 'Shen Yue, Song shu 43 (487–488, rund 50 Jahre später)' },
  { who: 'Tang Taizong', meta: 'China · 598–649 · Kaiser und Feldherr', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'A',
    text: 'Er ließ seine sechs Lieblingsschlachtrosse, die ihn durch seine Feldzüge getragen hatten, für sein Grabmal Zhaoling in Steinreliefs meißeln. Eines zeigt einen General, der einem Pferd einen Pfeil aus der Brust zieht; zwei der Reliefs stehen heute im Penn Museum in Philadelphia.',
    kurz: 'lässt seinen Schlachtrossen steinerne Denkmäler setzen',
    use: 'Lass deinen Feldherrn seinen Pferden Denkmäler setzen, und lass den Leser fragen, wem er sonst je so gedankt hat.',
    src: 'Die Reliefs selbst (um 636–649)' },
  { who: 'Tang Taizong', meta: 'China · 598–649 · Kaiser und Feldherr', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'C',
    text: 'Eine Anekdote: Als der strenge Minister Wei Zheng eintrat, versteckte der Kaiser seinen Sperber im Gewand. Wei Zheng redete und redete, und der Vogel erstickte.',
    kurz: 'versteckt vor seinem strengen Berater, was ihm Freude macht',
    use: 'Zeig einen Herrscher, der vor seinem strengsten Berater versteckt, was ihm Freude macht, komisch und traurig zugleich.',
    src: 'Liu Su, Sui Tang jiahua (8. Jh.)' },

  /* ---------- Mongolen und Zentralasien ---------- */
  { who: 'Dschingis Khan', meta: 'Mongolei · um 1162–1227 · Begründer des Mongolenreichs', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Die Hauschronik der Mongolen bewahrt eine peinliche Kindheitsangst: Als sein Vater den Neunjährigen bei dessen künftigem Schwiegervater zurückließ, waren seine Abschiedsworte: „Mein Sohn hat Angst vor Hunden. Lass die Hunde ihn nicht erschrecken.“',
    kurz: 'fürchtet sich seit Kindertagen vor Hunden',
    use: 'Gib deinem Eroberer eine Kindheitsangst, die ausgerechnet seine eigene Familienchronik aufbewahrt, und lass einen Gegner davon erfahren.',
    src: 'Geheime Geschichte der Mongolen § 66 (verfasst 1228, 1240 oder 1252, ein bis drei Jahrzehnte nach seinem Tod)' + ON('https://en.wikipedia.org/wiki/Genghis_Khan') },
  { who: 'Dschingis Khan', meta: 'Mongolei · um 1162–1227 · Begründer des Mongolenreichs', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Nachdem er sich bei einem Überfall der Merkiten auf dem Berg Burkhan Khaldun versteckt und überlebt hatte, hängte er sich den Gürtel um den Hals und nahm den Hut in die Hand. Er schlug sich an die Brust, kniete neunmal zur Sonne hin, goss Trankopfer aus und gelobte, dem Berg jeden Morgen zu opfern.',
    kurz: 'opfert jeden Morgen dem Berg, auf dem er sich einst rettete',
    use: 'Zeig in einem privaten Unterwerfungsritual, dass auch dein Eroberer jemandem dankt, und wem.',
    src: 'Geheime Geschichte der Mongolen § 103 (13. Jh., ein bis drei Jahrzehnte nach seinem Tod)' },
  { who: 'Jebe', meta: 'Mongolei · gest. um 1223/24 · General der Mongolen', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Um 1201, damals noch auf der Gegenseite, schoss er Temüdschins Schlachtross durch den Hals. Nach der Schlacht bekannte er es offen, sagte, Temüdschin könne ihn töten, und bot an, ihm treu zu dienen, wenn er verschont werde; Temüdschin nannte ihn Jebe, „Pfeil“ und zugleich „Waffe“. Als der Khan ihn Jahre später des Ehrgeizes zu verdächtigen schien, schickte Jebe ihm hundert weiße Pferde von der Art, die er einst erschossen hatte.',
    kurz: 'trägt einen Namen, der an den Pfeil gegen seinen heutigen Herrn erinnert',
    use: 'Wirb für deinen Feldherrn einen früheren Feind an, der ihn beinahe getötet hätte und dessen Name alle daran erinnert.',
    src: 'Geheime Geschichte der Mongolen §§ 146–147 (13. Jh.); zum Pferdegeschenk Stephen Pow (2017)' + ON('https://en.wikipedia.org/wiki/Jebe') },
  { who: 'Möngke Khan', meta: 'Mongolei · 1209–1259 · Großkhan', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'An den Höfen von Batu, Güyük und Möngke warnte man Gesandte, nie die Schwelle des Khanzelts zu berühren; ein Begleiter Rubruks streifte sie beim Hinausgehen, wurde gepackt und durfte die Wohnungen des Khans nicht mehr betreten. Besucher mussten zwischen zwei Feuern hindurchgehen, um von bösen Absichten und Gift gereinigt zu werden. Rubruk berichtet auch, die Mongolen wüschen keine Kleider, weil Gott sonst Donner schicke, und versteckten sich bei Gewittern in schwarzen Filz gehüllt.',
    kurz: 'lässt jeden bestrafen, der seine Türschwelle berührt',
    use: 'Bau eine Etikette, in der ein Stolpern an der Tür ein Verbrechen ist, und schick einen ungeschickten fremden Gesandten hinein.',
    src: 'Johannes de Plano Carpini, Ystoria Mongalorum (1247, war 1245–47 an den Höfen); Wilhelm von Rubruk, Itinerarium (1255, war 1253–54 bei Möngke)' + ON('https://en.wikipedia.org/wiki/Plano_Carpini') },
  { who: 'Möngke Khan', meta: 'Mongolei · 1209–1259 · Großkhan', era: A, grp: F, cat: 'Sprache & Humor', rel: 'A',
    text: 'Möngke selbst sagte zu Rubruk: „Wie Gott der Hand verschiedene Finger gegeben hat, so hat er den Menschen verschiedene Wege gegeben.“',
    kurz: 'beendet Glaubensstreit mit dem Gleichnis von den Fingern der Hand',
    use: 'Lass deinen Feldherrn Streit zwischen Priestern mit einem einfachen Bild beenden, das keine Seite widerlegen kann.',
    src: 'Wilhelm von Rubruk, Itinerarium (1255, Augenzeuge 1253–54)' + ON('https://en.wikipedia.org/wiki/M%C3%B6ngke_Khan') },
  { who: 'Timur', meta: 'Zentralasien und Iran · 1336–1405 · Eroberer', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Vor der Schlacht um Delhi 1398 schlug er den Koran an einer beliebigen Stelle auf, um ein Vorzeichen zu lesen, und gab nichts auf seine Astrologen. Auf einer Anhöhe zwischen den Heeren stieg er vom Pferd, um für den Sieg zu beten, und gegen die Elefanten ließ er erbeutete Büffel, an Hals und Füßen zusammengebunden, vor seine Linie stellen. Als er die Gelehrten in seinem Gefolge fragte, wo sie postiert werden wollten, antworteten sie: „Bei den Damen.“',
    kurz: 'schlägt vor der Schlacht ein heiliges Buch auf und ignoriert die Sterndeuter',
    use: 'Lass deinen Feldherrn Vorzeichen wählen, wie es ihm passt, und gib ihm Gelehrte im Gefolge, deren Mut im entscheidenden Moment versagt.',
    src: 'Scharaf ad-Din Ali Yazdi, Zafarnama (1424–25, rund 25 Jahre später, offizielle Hofgeschichte)' + ON('https://persian.packhum.org/text/080201013/5') },
  { who: 'Timur', meta: 'Zentralasien und Iran · 1336–1405 · Eroberer', era: A, grp: F, cat: 'Körper & Gesten', rel: 'A',
    text: 'Pfeilwunden am rechten Bein und an der rechten Hand, an der er zwei Finger verlor, machten ihn lahm; die Öffnung seines Grabes 1941 bestätigte einen mit der Kniescheibe verwachsenen rechten Oberschenkelknochen und einen verkümmerten rechten Arm. Man schreibt ihm außerdem ein vergrößertes Schach auf einem Brett von 10 mal 11 Feldern zu.',
    kurz: 'hinkt seit alten Pfeilwunden und hat zwei Finger verloren',
    use: 'Zeig einen hinkenden Strategen, der auf einem größeren Brett spielt als alle anderen: Der Körper ist schwach, das Spiel ist größer.',
    src: 'Untersuchung des Skeletts durch Michail Gerassimow (1941); Yazdi, Zafarnama (1424–25)' + ON('https://en.wikipedia.org/wiki/Timur') },

  /* ---------- Indien ---------- */
  { who: 'Chandragupta Maurya', meta: 'Indien · regierte um 321–297 v. Chr. · Begründer des Maurya-Reichs', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Aus Angst vor Verschwörungen schlief er nicht bei Tag und wechselte nachts das Bett. Bewaffnete Frauen bewachten ihn, auch auf der Jagd. Den ganzen Tag saß er zu Gericht und unterbrach nicht einmal für die Körperpflege: Vier Diener rieben ihn mit hölzernen Rollen ab, während er weiter zuhörte.',
    kurz: 'wechselt aus Angst vor Mördern jede Nacht das Bett',
    use: 'Mach aus einer Sicherheitsroutine ein nächtliches Ritual, und lass genau den Menschen, der sie kennt, ihre Lücke finden.',
    src: 'Megasthenes, Indika (um 300 v. Chr., Gesandter am Hof), überliefert bei Strabon, Geographie 15.1.55 (frühes 1. Jh. n. Chr.)' + ON('https://en.wikipedia.org/wiki/Chandragupta_Maurya') },
  { who: 'Muhammad bin Tughluq', meta: 'Indien · regierte 1325–1351 · Sultan von Delhi', era: A, grp: F, cat: 'Führungsstil', rel: 'A',
    text: 'Ibn Battuta, der ihm als Richter diente, nannte ihn den Menschen, der dem Schenken und dem Blutvergießen am meisten verfallen sei: Vor seinem Tor werde immer gerade ein Armer reich gemacht oder ein Lebender getötet. Sein Höfling Barani beschreibt Pläne, die der Sultan „in seinem eigenen Herzen“ fasste, ohne jemanden zu fragen, etwa die Umsiedlung der Bevölkerung Delhis nach Daulatabad oder ein Kupfer- und Messinggeld, das „jedes Hindu-Haus in eine Münzstätte verwandelte“.',
    kurz: 'schenkt und tötet aus demselben plötzlichen Impuls',
    use: 'Lass Großzügigkeit und Grausamkeit bei deinem Feldherrn aus demselben plötzlichen Impuls kommen, den er mit niemandem bespricht.',
    src: 'Ibn Battuta, Rihla (diktiert 1354–55, war 1334–42 in Delhi); Ziauddin Barani, Tarikh-i Firuz Shahi (1357)' + ON('https://en.wikipedia.org/wiki/Muhammad_bin_Tughluq') },
  { who: 'Krishnadevaraya', meta: 'Indien · regierte 1509–1529 · Kaiser von Vijayanagara', era: A, grp: F, cat: 'Körper & Gesten', rel: 'A',
    text: 'Vor Tagesanbruch trank er etwa drei Viertel Pint Sesamöl und rieb sich damit am ganzen Körper ein. Im Lendenschurz übte er mit schweren Tongewichten und dann mit dem Schwert, bis er das Öl ausgeschwitzt hatte; danach rang er mit einem seiner Ringer und galoppierte bis zum Morgengrauen über die Ebene.',
    kurz: 'ringt jeden Morgen vor Sonnenaufgang mit einem seiner Ringer',
    use: 'Zeig mit einem Morgenritual, das mit einem Ringkampf gegen einen Profi endet, dass dein Feldherr vorhat, selbst zu kämpfen.',
    src: 'Domingo Paes, Bericht über Vijayanagara (um 1520–22, Augenzeuge am Hof); englisch in Robert Sewell, A Forgotten Empire (1900)' },
  { who: 'Babur', meta: 'Zentralasien und Indien · 1483–1530 · Begründer der Mogulherrschaft', era: A, grp: F, cat: 'Körper & Gesten', rel: 'A',
    text: 'Er machte es sich zur Regel, jeden Fluss, an den er kam, zu durchschwimmen. In Indien schwamm er durch den Ganges und zurück und zählte dabei seine Züge: 33 bis zum anderen Ufer, schreibt er.',
    kurz: 'durchschwimmt jeden Fluss, an den er kommt, und zählt die Züge',
    use: 'Lass deinen Feldherrn jede Flussüberquerung zur persönlichen Prüfung machen und Buch darüber führen, Ehrgeiz und Eitelkeit in einem.',
    src: 'Babur, Baburnama (Erinnerungen auf Tschagataitürkisch, 1520er Jahre)' + ON('https://en.wikipedia.org/wiki/Babur') },
  { who: 'Babur', meta: 'Zentralasien und Indien · 1483–1530 · Begründer der Mogulherrschaft', era: A, grp: F, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Er trank schwer, feierte Weingelage auf Booten und nahm Opiumzubereitungen. Vor der Schlacht von Khanwa 1527 schwor er dem Wein ab, ließ seine goldenen und silbernen Trinkgefäße zerschlagen und die Stücke verschenken. Später zitierte er zustimmend: „Jeder bereut das Trinken und legt einen Schwur ab; ich legte den Schwur ab und bereue das.“',
    kurz: 'zerschlägt vor der Entscheidungsschlacht öffentlich seine Trinkbecher',
    use: 'Bind das Heer mit einem theatralischen Gelübde am Vorabend der Schlacht an deinen Feldherrn, und zeig später, wie sehr er es bereut.',
    src: 'Babur, Baburnama (1520er Jahre); englisch von Leyden und Erskine (1826) sowie Beveridge (1922)' + ON('https://ibiblio.org/britishraj/Jackson5/chapter10.html') },
  { who: 'Humayun', meta: 'Indien · 1508–1556 · Mogulkaiser', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Laut seinem Höfling ordnete er das Hofleben nach den sieben Planeten: An den Tagen von Saturn und Jupiter empfing er Gelehrte und Heilige, an denen von Sonne und Mars erledigte er Staatsgeschäfte, an denen von Mond und Merkur widmete er sich Musik und Freunden, und an jedem Tag trug er Gewänder in der Farbe seines Planeten. Er starb 1556, als er auf der steilen Treppe seiner Bibliothek den Gebetsruf hörte, niederknien wollte, mit dem Fuß im Gewand hängen blieb und stürzte.',
    kurz: 'trägt jeden Tag Kleider in der Farbe des Planeten dieses Tages',
    use: 'Lass deinen Feldherrn seine Woche nach den Sternen einteilen und sich danach kleiden, damit Höflinge seine Stimmung an der Farbe ablesen.',
    src: 'Khwandamir, Qanun-i Humayuni (1534, an seinem Hof geschrieben); zum Tod Abu’l Fazl, Akbarnama (1590er Jahre), Gulbadan Begum, Humayun-nama (um 1587), und sein Kannenträger Jauhar' },
  { who: 'Akbar', meta: 'Indien · 1542–1605 · Mogulkaiser', era: A, grp: F, cat: 'Arbeitsweise', rel: 'A',
    text: 'Er lernte nie lesen und schreiben, vielleicht wegen einer Legasthenie, und baute doch eine riesige Bibliothek auf. Jeden Tag ließ er sich vorlesen, markierte laut seinem Chronisten mit eigener Feder die Stelle, an der der Vorleser aufhörte, und bezahlte ihn nach Seiten. Seine Religionsgespräche im Ibadat Khana wurden so hitzig, dass die Teilnehmer einander anschrien und beschimpften, bis er sie 1582 beendete.',
    kurz: 'kann nicht lesen und lässt sich jeden Tag vorlesen',
    use: 'Mach die Vorleser deines Feldherrn mächtig, denn wer nicht liest, regiert durch Zuhören, und sie bestimmen, was er hört.',
    src: 'Abu’l Fazl, Akbarnama und Ain-i Akbari (1590er Jahre, bewundernder Hofhistoriker); Badauni, Muntakhab al-tawarikh (1590er Jahre, feindseliger Zeitgenosse)' + ON('https://en.wikipedia.org/wiki/Akbar') },
  { who: 'Akbar', meta: 'Indien · 1542–1605 · Mogulkaiser', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'A',
    text: 'Er hielt Tausende Jagdgeparden und richtete viele davon selbst ab.',
    kurz: 'hält Tausende Jagdgeparden und richtet viele eigenhändig ab',
    use: 'Lass deinen Feldherrn seine Jagdtiere selbst abrichten und zeig dabei dieselbe Geduld, mit der er Menschen formt.',
    src: 'Abu’l Fazl, Akbarnama und Ain-i Akbari (1590er Jahre, bewundernder Hofhistoriker)' + ON('https://en.wikipedia.org/wiki/Akbar') },

  /* ---------- Iran, arabische Welt, Mamluken, Osmanen ---------- */
  { who: 'Alp Arslan', meta: 'Iran · um 1029–1072 · Seldschukensultan', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Er galt als ehrfurchtgebietend und trug lange, dünne Schnurrbartenden, die er beim Bogenschießen hochknotete: „Vom Scheitel seines Hutes bis zur Spitze seines Schnurrbarts waren es zwei Yards“, fast zwei Meter. Nach Mantzikert 1071 setzte er dem gefangenen byzantinischen Kaiser Romanos IV. den Stiefel in den Nacken und behandelte ihn danach freundlich.',
    kurz: 'knotet vor dem Schießen seinen langen Schnurrbart hoch',
    use: 'Gib deinem Feldherrn ein Erkennungszeichen, das zugleich praktisch ist, wie den hochgeknoteten Bart des Schützen.',
    src: 'Arabische und persische Chroniken, vor allem Ibn al-Athir, al-Kamil (um 1231, rund 160 Jahre später)' + ON('https://en.wikipedia.org/wiki/Alp_Arslan') },
  { who: 'Alp Arslan', meta: 'Iran · um 1029–1072 · Seldschukensultan', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Er starb 1072 an seinem Stolz auf seine Schießkunst: Ein verurteilter Gefangener zog ein Messer und stürzte auf ihn zu. Alp Arslan hielt seine Wachen zurück und griff selbst zum Bogen, doch sein Fuß rutschte weg, der Pfeil ging fehl, und der Mann erstach ihn.',
    kurz: 'hält seine Wachen zurück, weil er sich selbst verteidigen will',
    use: 'Lass den Stolz auf eine einzige Fähigkeit deinen Feldherrn genau in dem Augenblick verraten, in dem er sie zeigen will.',
    src: 'Arabische und persische Chroniken, vor allem Ibn al-Athir, al-Kamil (um 1231, rund 160 Jahre später)' + ON('https://en.wikipedia.org/wiki/Alp_Arslan') },
  { who: 'Saladin', meta: 'Ägypten und Syrien · 1137/38–1193 · Sultan', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Nach Hattin 1187 bot er dem gefangenen König Guido Wasser an, das Zeichen, dass ein Gefangener verschont wird. Guido reichte den Becher an Rainald von Châtillon weiter; Saladin schlug ihn ihm aus der Hand, „Diesen bösen Mann habe ich nicht zum Trinken eingeladen“, und tötete Rainald eigenhändig.',
    kurz: 'entscheidet mit einem Becher Wasser über Leben und Tod',
    use: 'Mach Gastfreundschaft zum Rechtsakt: Wenn ein Becher Wasser ein Urteil ist, wird jede Geste bei Tisch lebensgefährlich.',
    src: 'Baha ad-Din ibn Schaddad, al-Nawadir al-sultaniyya (nach 1193, sein Sekretär und Augenzeuge)' + ON('https://en.wikipedia.org/wiki/Battle_of_Hattin') },
  { who: 'Saladin', meta: 'Ägypten und Syrien · 1137/38–1193 · Sultan', era: A, grp: F, cat: 'Führungsstil', rel: 'B',
    text: 'Als sein Sohn al-Afdal in der Schlacht von Hattin zu früh jubelte, hörte er: „Still! Wir haben sie nicht besiegt, bevor nicht dieses Zelt fällt.“ Als das Zelt des Königs fiel, stieg Saladin vom Pferd, dankte Gott und weinte vor Freude.',
    kurz: 'jubelt erst, wenn das Zelt des feindlichen Königs fällt',
    use: 'Lass deinen Feldherrn mitten im Sieg den eigenen Sohn zum Schweigen bringen, weil er weiß, wann ein Tag wirklich gewonnen ist.',
    src: 'Ibn al-Athir, al-Kamil (um 1231), nach dem Bericht al-Afdals' + ON('https://en.wikipedia.org/wiki/Battle_of_Hattin') },
  { who: 'Saladin', meta: 'Ägypten und Syrien · 1137/38–1193 · Sultan', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'A',
    text: 'Sein Sekretär sah ihn bei der Belagerung von Akkon mit Furunkeln bedeckt, unfähig zu sitzen, und doch den ganzen Tag im Sattel. Der Schmerz, sagte Saladin, verlasse ihn nur, solange er auf dem Pferd sitze.',
    kurz: 'spürt seine Schmerzen nur dann nicht, wenn er im Sattel sitzt',
    use: 'Gib deinem Feldherrn einen Körper, der nur im Sattel aufhört zu schmerzen, und er treibt sich ins Feld, auch wenn die Lage Ruhe verlangt.',
    src: 'Baha ad-Din ibn Schaddad, al-Nawadir al-sultaniyya (nach 1193, Augenzeuge)' },
  { who: 'Baibars', meta: 'Ägypten und Syrien · um 1223/28–1277 · Mamlukensultan', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Ein großer Kiptschake mit olivfarbener Haut, blauen Augen, breiten Schultern und mächtiger Stimme, auf einem Auge mit grauem Star; spätere Chronisten sagen, der Makel habe ihn als jungen Sklaven schwer verkäuflich gemacht. Als Sultan baute er eine Kurierstafette zu Pferd auf, die eine Nachricht in vier Tagen von Kairo nach Damaskus trug. Viele Quellen sagen, er sei an vergiftetem Kumys gestorben, vergorener Stutenmilch, die für einen anderen bestimmt war.',
    kurz: 'baut ein Netz von Eilboten auf, das Nachrichten in Tagen bringt',
    use: 'Gib deinem Feldherrn einen Makel am Auge, der einst seinen Preis als Sklave drückte, und lass ihn alles daransetzen, schneller zu sehen als andere.',
    src: 'Ibn Abd az-Zahir (Zeitgenosse, Lobschrift), später al-Maqrizi und Ibn Taghribirdi (15. Jh.); Peter Thorau, The Lion of Egypt (1992)' + ON('https://en.wikipedia.org/wiki/Baibars') },
  { who: 'Murad IV.', meta: 'Osmanisches Reich · 1612–1640 · Sultan', era: A, grp: F, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'Ab 1633 verbot er in Istanbul Tabak, Kaffeehäuser und Wein, zog nachts verkleidet durch die Stadt, um Sünder zu ertappen, und ließ Raucher auf der Stelle hinrichten. Er selbst trank schwer und starb mit 27. Die Feldzüge gegen Jerewan 1635 und Bagdad 1638 führte er persönlich, berühmt für seine Körperkraft.',
    kurz: 'verbietet anderen das Laster, dem er selbst verfallen ist',
    use: 'Lass deinen Sittenwächter nachts durch die Gassen schleichen, um das Laster zu bestrafen, dem er selbst frönt.',
    src: 'Katip Çelebi, Mizan al-haqq (1656, Zeitgenosse); Evliya Çelebi, Seyahatname (Zeitgenosse an seinem Hof, schmückt gern aus)' },

  /* ---------- Japan ---------- */
  { who: 'Kusunoki Masashige', meta: 'Japan · um 1294–1336 · kaisertreuer Feldherr', era: A, grp: F, cat: 'Arbeitsweise', rel: 'C',
    text: 'Die Bergfestung Chihaya verteidigte er 1333 mit kleiner Besatzung und vielen Listen: Im Taiheiki stellen seine Leute im Morgengrauen gerüstete Strohpuppen auf und schreien dahinter, um die Angreifer unter herabstürzende Felsen zu locken. In der aussichtslosen Schlacht von Minatogawa 1336 töteten er und sein Bruder Masasue einander, nachdem Masasue sich gewünscht hatte, siebenmal wiedergeboren zu werden, um die Feinde des Kaisers zu vernichten. Der berühmte Schwur der „sieben Leben“ war also der Wunsch des Bruders; die Strohpuppen sind glaubhaft, die sieben Leben Legende.',
    kurz: 'verteidigt Mauern mit Strohpuppen und lautem Kriegsgeschrei',
    use: 'Lass einen Verteidiger mit Vogelscheuchen und Kriegsgeschrei kämpfen und gib ihm am Ende einen Treueschwur über sieben Leben: List und Pathos in einer Figur.',
    src: 'Taiheiki (Kriegserzählung, um die 1370er Jahre, rund 40 Jahre später)' + ON('https://en.wikipedia.org/wiki/Kusunoki_Masashige') },
  { who: 'Takeda Shingen', meta: 'Japan · 1521–1573 · Kriegsherr', era: A, grp: F, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Sein Banner zitierte Sunzi, Kapitel 7: „Schnell wie der Wind, still wie der Wald, wild wie das Feuer, unbeweglich wie der Berg“ (fūrinkazan). Die Geschichte von dem Abtritt, auf dem er seine Feldzüge geplant haben soll, stammt dagegen aus dem Kōyō gunkan des 17. Jahrhunderts und ist unsicher.',
    kurz: 'trägt einen Lehrsatz der Kriegskunst als Wahlspruch auf dem Banner',
    use: 'Schreib deinem Feldherrn einen Lehrsatz aus einem Kriegsbuch aufs Banner, und lass einen klugen Gegner daraus schließen, welches Buch er gelesen hat.',
    src: 'Sunzi, Kapitel 7; Banner der Takeda (16. Jh.)' },
  { who: 'Uesugi Kenshin', meta: 'Japan · 1530–1578 · Kriegsherr', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Er heiratete nie, verehrte den Kriegsgott Bishamonten und zog unter einem Banner mit dem Schriftzeichen 毘 (bi) aus dem Namen des Gottes in die Schlacht. Er trank schwer und starb 1578 nach einem Zusammenbruch, wahrscheinlich an einem Schlaganfall.',
    kurz: 'kämpft unter dem Zeichen seines Schutzgottes und bleibt unverheiratet',
    use: 'Lass deinen Feldherrn sich einem Kriegsgott weihen, damit jeder Sieg ein Zeichen und jede Niederlage eine Glaubensfrage wird.',
    src: 'Überlieferung des Hauses Uesugi (16./17. Jh.)' },
  { who: 'Oda Nobunaga', meta: 'Japan · 1534–1582 · Kriegsherr und Reichseiniger', era: A, grp: F, cat: 'Kleidung & Aussehen', rel: 'A',
    text: 'Als junger Mann hieß er der „Große Narr von Owari“: Er trug ein Gewand mit abgetrennten Ärmeln und kurze Hosen, am Gürtel Feuersteinbeutel und anderes Zeug, das Haar zu einem Teebesenknoten mit roter und grüner Schnur gebunden, das Schwert in zinnoberroter Scheide. Er aß Kastanien, Kakis und Melonen auf der Straße, ging auf die Schultern seiner Gefährten gestützt und warf bei der Totenfeier seines Vaters eine Handvoll Weihrauch auf den Altar.',
    kurz: 'trägt ärmellose Gewänder und isst auf offener Straße Obst',
    use: 'Lass offen, ob dein junger Erbe sich absichtlich wie ein Herumtreiber kleidet, damit die Alten ihn unterschätzen, oder ob er einfach so ist.',
    src: 'Ōta Gyūichi, Shinchō kōki (um 1600–1610, von einem früheren Bogenschützen in seinen Diensten)' + ON('https://en.wikipedia.org/wiki/Oda_Nobunaga') },
  { who: 'Oda Nobunaga', meta: 'Japan · 1534–1582 · Kriegsherr und Reichseiniger', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Vor der Schlacht von Okehazama 1560 tanzte er das Kōwaka-Stück „Atsumori“: „Fünfzig Jahre Menschenleben … wie ein Traum, ein Trugbild.“ Dann rief er nach dem Muschelhorn und seiner Rüstung, aß im Stehen und ritt los.',
    kurz: 'tanzt vor einer aussichtslosen Schlacht ein Lied über die Vergänglichkeit',
    use: 'Gib deinem Feldherrn ein kurzes privates Ritual vor einer unmöglichen Schlacht: Tanz, Rüstung, Essen im Stehen, dann los.',
    src: 'Ōta Gyūichi, Shinchō kōki (um 1600–1610, ein früherer Gefolgsmann)' },
  { who: 'Toyotomi Hideyoshi', meta: 'Japan · 1537–1598 · Reichseiniger', era: A, grp: F, cat: 'Körper & Gesten', rel: 'A',
    text: 'An der rechten Hand hatte er einen zusätzlichen Daumen, sechs Finger also. Maeda Toshiie erinnerte sich, er hätte ihn als Junge entfernen lassen können, tat es aber nie, und auch der Jesuit Luís Fróis erwähnt den sechsten Finger. In einem eigenhändigen Brief an Hideyoshis Frau Nene nannte Nobunaga ihn „diese kahle Ratte“ und riet ihr, nicht eifersüchtig zu sein; der Spitzname „Affe“ stammt dagegen meist aus späterer Überlieferung.',
    kurz: 'hat einen sechsten Finger und denkt nicht daran, ihn zu verbergen',
    use: 'Gib deinem Aufsteiger eine sichtbare Eigenheit, die er nie versteckt, und einen Vorgesetzten, der sich schriftlich und liebevoll über sein Aussehen lustig macht.',
    src: 'Luís Fróis, História de Japam (1580er und 1590er Jahre, zu Lebzeiten); Erinnerungen Maeda Toshiies (frühes 17. Jh.); Brief Nobunagas an Nene (um 1576)' },
  { who: 'Date Masamune', meta: 'Japan · 1567–1636 · Kriegsherr', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Als Kind verlor er sein rechtes Auge durch die Pocken. Die Geschichten, er habe es sich selbst herausgerissen und sei 1590 in weißen Totengewändern vor Hideyoshi erschienen, sind spätere Familien- und Edo-Überlieferung.',
    kurz: 'hat seit seiner Kindheit nur ein Auge',
    use: 'Lass um die Verletzung deines Feldherrn Legenden wachsen, heroischer als die Wahrheit, und lass ihn entscheiden, ob er sie korrigiert.',
    src: 'Chronik des Hauses Date (Edo-Zeit)' },

  /* ---------- Korea und Vietnam ---------- */
  { who: 'Yi Sun-sin', meta: 'Korea · 1545–1598 · Admiral', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Sein Kriegstagebuch verzeichnet fast täglich Bogenschießen mit seinen Offizieren, Trinkgelage, Fieber, Nachtschweiß und Nächte, in denen er allein aufrecht saß und nicht schlafen konnte. Er schrieb seine Träume auf und warf vor Gefechten markierte Lose, um die Zukunft zu befragen. Tödlich getroffen bei Noryang, soll er gesagt haben: „Die Schlacht ist auf ihrem Höhepunkt. Verkündet nicht meinen Tod.“',
    kurz: 'schreibt nachts seine Träume und schlaflosen Stunden in ein Tagebuch',
    use: 'Lass deinen Feldherrn nach außen Ruhe ausstrahlen und privat Angst, Krankheit, Träume und Vorzeichen notieren: Das Tagebuch ist seine Hinterbühne.',
    src: 'Yi Sun-sin, Nanjung ilgi (eigenes Kriegstagebuch, 1592–98); die letzten Worte nach dem Bericht seines Neffen Yi Bun (frühes 17. Jh.)' },
  { who: 'Trần Hưng Đạo', meta: 'Vietnam · 1228–1300 · Feldherr gegen die Mongolen', era: A, grp: F, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Vor dem Mongoleneinfall 1285 tätowierten sich die Soldaten des Trần-Heeres „Sát Thát“, „Tötet die Tataren“, auf die Arme. In seinem Testament lehnte er ein prächtiges Königsgrab ab und wünschte ein schlichtes, privates Begräbnis; seine Asche wurde unter einer Eiche verstreut, die er selbst gepflanzt hatte.',
    kurz: 'lehnt ein Prunkgrab ab und will unter seinem eigenen Baum ruhen',
    use: 'Lass dein Heer eine Losung auf der Haut tragen und deinen Feldherrn ein Denkmal verweigern.',
    src: 'Ngô Sĩ Liên, Đại Việt sử ký toàn thư (1479, nach Annalen der Trần-Zeit)' + ON('https://en.wikipedia.org/wiki/Tr%E1%BA%A7n_H%C6%B0ng_%C4%90%E1%BA%A1o') },

  /* ---------- Staatsmänner, Gelehrte und andere ---------- */
  { who: 'Lin Xiangru', meta: 'China · tätig 283–um 260 v. Chr. · Diplomat und Minister von Zhao', era: A, grp: F, cat: 'Körper & Gesten', rel: 'B',
    text: 'Als Gesandter mit der berühmten Jadescheibe He Shi in Qin merkte er, dass der König sie behalten wollte, ohne zu zahlen. Er nahm sie zurück, stellte sich an eine Säule und drohte, die Jade und seinen eigenen Kopf daran zu zerschmettern, und sein Haar sträubte sich so, dass es die Kappe hob.',
    kurz: 'droht, sich selbst und das Pfand zu zerschmettern',
    use: 'Lass einen Unterhändler den eigenen Körper als Pfand einsetzen, wenn er sonst nichts in der Hand hat.',
    src: 'Sima Qian, Shiji 81 (um 94 v. Chr., rund 170 Jahre später)' + ON('https://en.wikipedia.org/wiki/Lin_Xiangru') },
  { who: 'Lin Xiangru', meta: 'China · tätig 283–um 260 v. Chr. · Diplomat und Minister von Zhao', era: A, grp: F, cat: 'Führungsstil', rel: 'B',
    text: 'Als der General Lian Po schwor, ihn zu demütigen, meldete sich Lin Xiangru krank, um ihm bei Hofe nicht zu begegnen, und ließ seinen Wagen auf der Straße zurücksetzen, um Lian vorbeizulassen. Am Ende kam Lian Po mit Dornenzweigen auf dem nackten Rücken an seine Tür und bat um Verzeihung.',
    kurz: 'weicht einem Ehrenhändel mit dem eigenen General absichtlich aus',
    use: 'Lass einen Berater einem Ehrenhändel bewusst ausweichen und feige wirken, bis sein Gegner mit Dornen auf dem Rücken vor der Tür steht.',
    src: 'Sima Qian, Shiji 81 (um 94 v. Chr., rund 170 Jahre später)' + ON('https://en.wikipedia.org/wiki/Lian_Po') },
  { who: 'Sima Qian', meta: 'China · um 145–um 86 v. Chr. · Historiker', era: A, grp: DK, cat: 'Ängste, Leiden & Laster', rel: 'A',
    text: 'Verurteilt, weil er einen besiegten General verteidigt hatte, wählte er die Kastration statt des ehrenhaften Selbstmords, den man von einem entehrten Beamten erwartete, um sein Geschichtswerk vollenden zu können, und lebte als Palasteunuch weiter. In seinem Brief an Ren An schreibt er, wann immer er an die Schande denke, breche ihm der Schweiß auf dem Rücken aus und durchnässe sein Gewand, und seine Eingeweide drehten sich neunmal am Tag.',
    kurz: 'schwitzt bei jeder Erinnerung an seine Schande das Gewand durch',
    use: 'Gib deinem Feldherrn einen Chronisten, der mit seinem Körper für das Recht zu schreiben bezahlt hat, und damit einen gefährlichen Kritiker.',
    src: 'Sima Qian, Brief an Ren An (um 91 v. Chr., eigene Worte), überliefert im Han shu 62' + ON('https://en.wikipedia.org/wiki/Sima_Qian') },
  { who: 'Ruan Ji', meta: 'China · 210–263 · Dichter, einer der „Sieben Weisen vom Bambushain“', era: A, grp: DK, cat: 'Körper & Gesten', rel: 'B',
    text: 'Konventionellen, auf Etikette bedachten Besuchern zeigte er das Weiße seiner Augen: Als Ji Xi nach dem Tod von Ruans Mutter förmlich kondolierte, bekam er das Weiße zu sehen, als dessen Bruder Ji Kang mit Wein und Zither kam, die dunklen Pupillen. Er fuhr mit dem Wagen, wohin es ging, bis der Weg endete, weinte und kehrte um. Um dem Regenten Sima Zhao nicht auf ein Heiratsangebot antworten zu müssen, blieb er sechzig Tage betrunken.',

  { who: 'Robert the Bruce', meta: 'Schottland · 1274–1329 · König', era: E, cat: 'Führungsstil', rel: 'B',
    text: '1306, gejagt und auf der Flucht, hielt er seine Männer bei einer langsamen Überfahrt über den Loch Lomond in einem kleinen, lecken Boot bei Laune, indem er ihnen den französischen Ritterroman „Fierabras“ vortrug: Karls Paladine, belagert und in der Unterzahl. Vor Bannockburn erschlug er Henry de Bohun mit einem einzigen Axthieb und klagte danach nur, er habe den Stiel seiner guten Axt zerbrochen.',
    kurz: 'erzählt seinen Männern in der Not Geschichten von wenigen gegen viele',
    use: 'Erzählen als Führung: Die Geschichte, die er auswählt, verrät, was er seinen Männern eigentlich sagen will.',
    src: 'John Barbour, The Bruce (1375, rund 50 Jahre später, nach Erinnerungen von Veteranen)' + ON('https://en.wikipedia.org/wiki/Robert_the_Bruce') },
  { who: 'Johann der Blinde', meta: 'Böhmen und Luxemburg · 1296–1346 · König', era: E, cat: 'Führungsstil', rel: 'B',
    text: 'Seit Jahren blind, bat er bei Crécy seine Ritter, ihn nach vorn zu führen, damit er noch einen Schwerthieb tun könne. Sie banden die Zügel ihrer Pferde an seine und ritten gemeinsam an. Am nächsten Tag fand man sie tot nebeneinander, noch immer aneinandergebunden.',
    kurz: 'lässt sich blind in die Schlacht führen, angebunden an seine Getreuen',
    use: 'Die Treue seiner Männer wird hier wörtlich sichtbar: Sie sind an ihn gebunden, bis in den Tod.',
    src: 'Jean Froissart, Chroniques I (1370er bis 1390er Jahre, teils nach Jean le Bel, um 1350)' + ON('https://en.wikipedia.org/wiki/Battle_of_Cr%C3%A9cy') },
  { who: 'Gaston Fébus', meta: 'Foix und Béarn · 1331–1391 · Graf', era: E, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Er lebte nachts: Er stand mittags auf, arbeitete die Nacht durch und speiste um Mitternacht in seinem Saal in Orthez bei Fackelschein, immer umgeben von seinen Hunden. Er schrieb eines der großen Jagdbücher des Mittelalters. In einem Wutanfall verschuldete er 1380 den Tod seines einzigen ehelichen Sohnes.',
    kurz: 'arbeitet nachts und schläft bis Mittag',
    use: 'Wer zu ihm will, muss sich seiner Uhr anpassen, Gesandte wie Spione.',
    src: 'Jean Froissart, Chroniques III (lebte 1388 wochenlang an seinem Hof); Gaston Fébus, Livre de chasse (1387–89)' + ON('https://en.wikipedia.org/wiki/Gaston_III,_Count_of_Foix') },
  { who: 'Bertrand du Guesclin', meta: 'Bretagne und Frankreich · um 1320–1380 · Konnetabel', era: E, cat: 'Kleidung & Aussehen', rel: 'B',
    text: 'Sein Versbiograph beteuert, er sei der hässlichste Junge zwischen Rennes und Dinan gewesen: dunkel, plattnasig, gedrungen und breitschultrig, ein Raufbold, den selbst seine Eltern nicht mochten. Aus ihm wurde der berühmteste Feldherr Frankreichs seiner Zeit. Nach seinem Tod teilte man seinen Körper und begrub ihn an vier Orten, die Gebeine bei den Königen in Saint-Denis.',
    kurz: 'wird wegen seiner Hässlichkeit unterschätzt',
    use: 'Der hässliche Außenseiter, den niemand wollte; vier Gräber zeigen, wie viele ihn später für sich beanspruchen.',
    src: 'Cuvelier, Chanson de Bertrand du Guesclin (um 1380–85, kurz nach seinem Tod, ein Heldenepos)' },
  { who: 'Karl VI. von Frankreich', meta: 'Frankreich · 1368–1422 · König, „der Wahnsinnige“', era: E, cat: 'Ängste, Leiden & Laster', rel: 'B',
    text: 'In manchen Schüben glaubte er, aus Glas zu sein, und ließ sich Eisenstäbe in die Kleider nähen, damit er nicht zerbrach; das berichtet erst eine Quelle rund 40 Jahre später. Zeitgenössisch belegt ist, dass er sich 1405 fünf Monate lang weigerte, sich zu waschen oder umzuziehen, und dass er bei seinem ersten Anfall 1392 im Wald bei Le Mans mehrere Männer seiner eigenen Begleitung tötete.',
    kurz: 'fürchtet, sein Körper könne zerspringen wie Glas',
    use: 'Zerbrechlichkeit wird wörtlich: ein Herrscher, der glaubt, sein Körper könne zerspringen.',
    src: 'Pius II. (Enea Silvio Piccolomini), Commentarii (1460er Jahre) für das Glas; Chronik des Mönchs von Saint-Denis (zeitgenössisch) für die anderen Anfälle' + ON('https://en.wikipedia.org/wiki/Charles_VI_of_France') },
  { who: 'Jan Žižka', meta: 'Böhmen · um 1360–1424 · Hussitischer Feldherr', era: E, cat: 'Führungsstil', rel: 'B',
    text: 'Schon auf einem Auge blind, verlor er 1421 bei der Belagerung von Rabí durch einen Pfeil auch das andere und gewann danach noch drei Jahre lang blind Schlachten mit seinem Wagenburg-Heer. Eine Legende, die erst 34 Jahre nach seinem Tod ein katholischer Gegner aufschrieb, sagt, er habe befohlen, aus seiner Haut eine Trommel zu machen, um den Feind auch nach dem Tod zu schrecken.',
    kurz: 'führt blind, mit den Augen seiner Offiziere und der Erinnerung an das Gelände',
    use: 'Ein blinder Feldherr „sieht“ durch die Berichte seiner Offiziere. Was passiert, wenn einer von ihnen lügt?',
    src: 'Hussitische Chroniken (Alte tschechische Annalen); Enea Silvio Piccolomini, Historia Bohemica (1458) für die Trommel' },
  { who: 'Jeanne d’Arc', meta: 'Frankreich · um 1412–1431 · Heerführerin', era: E, cat: 'Tiere & Gegenstände', rel: 'A',
    text: 'Vor Gericht sagte sie, sie liebe ihr Banner „vierzigmal“ mehr als ihr Schwert und trage es beim Angriff selbst, damit sie niemanden töten müsse; sie habe nie getötet. Sie hasste Flüche, und ein Gefährte bezeugte, sie habe Dirnen mit dem Schwert aus dem Lager gejagt und es dabei auf einer zerbrochen.',
    kurz: 'trägt im Angriff ein Banner statt einer Waffe',
    use: 'Ihre sichtbare „Waffe“ ist ein Symbol; sie hält ihre Hände bewusst vom Töten rein, und alle sehen es.',
    src: 'Verurteilungsprozess, Sitzung vom 27. Februar 1431 (ihre eigenen Antworten, von Notaren mitgeschrieben); Aussagen im Rehabilitationsprozess 1455–56' },
  { who: 'Ludwig XI.', meta: 'Frankreich · 1423–1483 · König, „die allumfassende Spinne“', era: E, cat: 'Kleidung & Aussehen', rel: 'A',
    text: 'Er kleidete sich so ärmlich, dass der kastilische Hof spottete: ein kurzer Rock aus grobem Tuch und ein verbeulter Hut, wie ihn sonst niemand trug, mit einem bleiernen Pilgerabzeichen daran.',
    kurz: 'kleidet sich ärmlicher als jeder seiner Diener',
    use: 'Ein listiger Feldherr, der aussieht wie ein Pilger und denkt wie eine Spinne: Die Schäbigkeit gehört zur Täuschung.',
    src: 'Philippe de Commynes, Mémoires (1489–98, rund zehn Jahre in seinen Diensten)' },
  { who: 'Ludwig XI.', meta: 'Frankreich · 1423–1483 · König, „die allumfassende Spinne“', era: E, cat: 'Führungsstil', rel: 'A',
    text: 'Gefangene ließ er in Käfige aus Eisen und Holz sperren, etwa acht Fuß breit; sein eigener Berater Commynes saß später acht Monate in einem. Sterbend in Plessis, hinter Eisengittern und Fußangeln, kaufte er überall Hunde und Pferde zu absurden Preisen, damit Europa glaubte, er sei noch voller Kraft.',
    kurz: 'täuscht Stärke vor, indem er auffällig kauft, was nur Gesunde brauchen',
    use: 'Eine Täuschung für deinen Feldherrn: Schwäche verbergen durch auffällige Ausgaben für ein Leben, das er nicht mehr führen wird.',
    src: 'Philippe de Commynes, Mémoires (1489–98, sein Berater, der selbst im Käfig saß; er nennt den Bischof von Verdun als Erfinder der Käfige)' },
  { who: 'Vlad III. „Dracula“', meta: 'Walachei · um 1431–1476/77 · Fürst', era: E, cat: 'Führungsstil', rel: 'C',
    text: 'Die Geschichten zeigen ihn beim Essen zwischen Gepfählten, lassen ihn osmanischen Gesandten die Turbane an den Kopf nageln, weil sie sie nicht abnehmen wollten, und einen goldenen Becher an einem öffentlichen Brunnen stehen, den niemand zu stehlen wagte. Die meisten dieser Erzählungen stammen aus feindlichen Flugschriften und Märchen; die Massenpfählungen selbst sind unabhängig bezeugt.',
    kurz: 'inszeniert Schrecken wie ein Theaterstück',
    use: 'Furcht als Inszenierung, und vergiss nicht: Die meisten „Eigenheiten“ eines gefürchteten Mannes verbreiten seine Feinde.',
    src: 'Deutsche Flugschriften nach feindlichen sächsischen Quellen (ab 1463, gedruckt 1488); russische „Erzählung von Dracula“ (um 1486); Laonikos Chalkokondyles (1460er bis 1480er Jahre)' },
  { who: 'Federico da Montefeltro', meta: 'Urbino · 1422–1482 · Condottiere und Herzog', era: E, cat: 'Kleidung & Aussehen', rel: 'A',
    text: 'Eine Turnierlanze kostete ihn 1450 das rechte Auge und brach ihm den Nasenrücken, und er ließ sich nur noch im linken Profil malen, so im berühmten Doppelbildnis Piero della Francescas. Beim Essen ließ er sich Livius vorlesen, und durch Urbino ging er fast ohne Begleitung und plauderte mit Ladenbesitzern. Dass er sich den Nasenrücken wegschneiden ließ, um besser zu sehen, ist spätere Überlieferung.',
    kurz: 'zeigt sich nur von seiner unversehrten Seite',
    use: 'Ein entstellter Feldherr bestimmt, wie man ihn sieht. Wer darf seine andere Seite sehen?',
    src: 'Vespasiano da Bisticci, Vite (1480er bis 1490er Jahre, kannte ihn und belieferte seine Bibliothek)' },
  { who: 'Papst Julius II.', meta: 'Rom · 1443–1513 · Papst und Kriegsherr', era: E, cat: 'Rituale & Aberglaube', rel: 'B',
    text: '1510 ließ er sich den Bart wachsen, angeblich mit dem Gelübde, sich erst zu rasieren, wenn die Franzosen aus Italien vertrieben seien; Raffael malte ihn bärtig. Im Januar 1511 zog er mit 67 Jahren selbst durch tiefen Schnee zur Belagerung von Mirandola, quartierte sich in Schussweite ein und bestand darauf, durch die Bresche einzuziehen.',
    kurz: 'trägt einen Bart als Gelübde, bis das Ziel erreicht ist',
    use: 'Ein sichtbares Gelübde, das an jedem Tag länger wird, an dem das Ziel nicht erreicht ist.',
    src: 'Francesco Guicciardini, Storia d’Italia IX (1537–40, ein zeitgenössischer Staatsmann); Tagebücher des päpstlichen Zeremonienmeisters Paris de Grassis' },
  { who: 'Maximilian I.', meta: 'Heiliges Römisches Reich · 1459–1519 · Kaiser, „der letzte Ritter“', era: E, cat: 'Rituale & Aberglaube', rel: 'B',
    text: 'Ab etwa 1514 soll er seinen eigenen Sarg im Gepäck mitgeführt haben; die erste Quelle dafür ist unklar. Gut belegt sind seine letzten Anordnungen: Nach dem Tod sollte man ihm die Haare scheren, die Zähne ausschlagen, den Leichnam geißeln, mit Kalk und Asche bestreuen und öffentlich zeigen, als Predigt über die Eitelkeit irdischer Macht.',
    kurz: 'führt auf jedem Marsch seinen eigenen Sarg mit',
    use: 'Ein Feldherr, der seinen Tod immer bei sich trägt, macht jede Rast zur Mahnung, für sich und für seine Männer.',
    src: 'Berichte über seinen Tod in Wels (Januar 1519), nach Hermann Wiesflecker, Kaiser Maximilian I. (1971–86)' },
  { who: 'Karl V.', meta: 'Spanien und Reich · 1500–1558 · Kaiser', era: E, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Ein gewaltiger Esser, dessen Kinn so weit vorstand, dass er kaum kauen konnte. Im Ruhestand in Yuste, von der Gicht verkrüppelt, bestellte er gegen den Rat seiner Ärzte Aalpasteten, Sardellen, Würste und Bier. Er bastelte mit seinem Uhrmacher an Uhren; der berühmte Satz, wer nicht zwei Uhren gleichgehen lassen könne, könne auch keine Menschen im Glauben einigen, ist spätere Ausschmückung.',
    kurz: 'beherrscht ein Heer, aber nicht seinen eigenen Appetit',
    use: 'Ein Mann, der die halbe Welt regiert und seinen Hunger nicht; seine Ärzte werden zu heimlichen Gegnern.',
    src: 'Berichte venezianischer Gesandter (etwa Federico Badoer, 1557); Briefe seines Haushofmeisters Luis Quijada aus Yuste (1557–58)' },
  { who: 'Iwan IV. „der Schreckliche“', meta: 'Russland · 1530–1584 · Zar', era: E, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Seine schwarz gekleideten Opritschniki ritten mit einem Hundekopf und einem Besen am Sattel: Verrat aufspüren und wegfegen. In Alexandrowa Sloboda spielte Iwan den Abt eines Scheinklosters, läutete um vier Uhr morgens selbst die Glocken, leitete die Gottesdienste und ging danach zu den Folterungen. Er trug einen Stab mit Eisenspitze; 1581 erschlug er damit seinen ältesten Sohn.',
    kurz: 'trägt einen eisenbeschlagenen Stab, den alle fürchten',
    use: 'Frömmigkeit und Terror als ein einziges Ritual, und der Stab als sein Erkennungszeichen.',
    src: 'Heinrich von Staden (deutscher Opritschnik, um 1578–82); Johann Taube und Elert Kruse (offener Brief 1572); Antonio Possevino und andere zum Tod des Sohnes (Augenzeugen, feindselig)' },
  { who: 'Elisabeth I.', meta: 'England · 1533–1603 · Königin', era: E, cat: 'Kleidung & Aussehen', rel: 'A',
    text: 'Im Alter waren ihre Zähne schwarz. Der Reisende Paul Hentzner, der sie 1598 in Greenwich sah, schob es auf den übermäßigen Zuckerverbrauch der Engländer und bemerkte auch ihr rotes falsches Haar und ihre Perlenohrringe. Der französische Gesandte de Maisse fand 1597 ihre Zähne gelb und lückenhaft, sodass man sie schwer verstand, wenn sie schnell sprach.',
    kurz: 'nascht ständig Zucker und hat davon schwarze Zähne',
    use: 'Macht und Verfall in einem Gesicht: Süße als Luxus, schwarze Zähne als ihr Preis.',
    src: 'Paul Hentzner, Itinerarium (gedruckt 1612, Besuch 1598); André Hurault de Maisse, Journal (1597); zwei unabhängige Augenzeugen' },
  { who: 'Albrecht von Wallenstein', meta: 'Böhmen und Reich · 1583–1634 · Generalissimus im Dreißigjährigen Krieg', era: E, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Er plante nach den Sternen: Kepler stellte ihm 1608 und 1625 das Horoskop, Wallenstein versah es mit Randnotizen und hielt sich einen Astrologen, Giovanni Battista Senno. Schon Keplers Text beschreibt einen rastlosen, wachsamen, misstrauischen Mann. Spätere Erzählungen fügen hinzu, er habe keinen Lärm ertragen: Straßen wurden abgesperrt, Hunde und Hähne entfernt.',
    kurz: 'trifft keine große Entscheidung ohne einen Blick in die Sterne',
    use: 'Ein moderner Organisator, der trotzdem ein Zeichen vom Himmel braucht, und Stille als Zeichen seiner Macht.',
    src: 'Keplers Horoskope von 1608 und 1625 mit Wallensteins Randnotizen; die Geschichten über die Stille stammen aus späteren Berichten (Anekdote)' },
  { who: 'Gustav II. Adolf', meta: 'Schweden · 1594–1632 · König', era: E, cat: 'Kleidung & Aussehen', rel: 'A',
    text: 'Seit 1627 eine Musketenkugel nahe am Hals steckte, ertrug er keinen Stahlküriss mehr und ritt in einem Koller aus Elchleder in die Schlacht. Bei Lützen 1632 ritt er im Nebel, vermutlich auch wegen seiner Kurzsichtigkeit, in feindliche Reiter und fiel. Das blutige Lederkoller und sein ausgestopftes Pferd Streiff sind in der Leibrüstkammer in Stockholm erhalten.',
    kurz: 'trägt wegen einer alten Wunde keinen Panzer mehr',
    use: 'Eine alte Wunde verändert die Rüstung des Feldherrn, und damit sein Glück.',
    src: 'Zeitgenössische schwedische und kaiserliche Berichte; die erhaltenen Stücke in der Livrustkammaren, Stockholm' },
  { who: 'Christian von Braunschweig', meta: 'Norddeutschland · 1599–1626 · Heerführer, „der tolle Halberstädter“', era: E, cat: 'Tiere & Gegenstände', rel: 'A',
    text: 'Am Hut trug er einen Handschuh der vertriebenen „Winterkönigin“ Elisabeth Stuart und kämpfte unter dem Wahlspruch „Tout pour Dieu et pour elle“, alles für Gott und für sie. 1622 ließ er in Paderborn den silbernen Liboriusschrein zu Talern einschmelzen, mit der Aufschrift „GOTTES FREVNDT DER PFAFFEN FEINDT“. Dass er bei der Amputation seines Arms Trompeten blasen ließ, ist eine spätere Anekdote.',
    kurz: 'trägt das Pfand einer fernen Dame am Hut',
    use: 'Ein höfisches Liebespfand am Hut eines brutalen Plünderers, und ein Schlachtruf, geprägt in gestohlenes Silber.',
    src: 'Die erhaltenen Münzen (1622); zeitgenössische Berichte und Fahnen für Handschuh und Wahlspruch' },
  /* ---------- Kurzbefunde: weitere Herrscher und Feldherren ---------- */
  { who: 'Heinrich V.', meta: 'England · 1386–1422 · König', era: E, cat: 'Ängste, Leiden & Laster', rel: 'A',
    text: 'Bei Shrewsbury 1403 drang ihm ein Pfeil sechs Zoll tief neben dem linken Wangenknochen ins Gesicht. Der Wundarzt John Bradmore zog die Spitze mit einem eigens gebauten Schraubwerkzeug heraus und behandelte die Wunde mit Honig und Weißwein; er beschreibt das in seiner eigenen Abhandlung. Sein Haar trug er als runden Topfschnitt, fast wie ein Mönch.',
    kurz: 'trägt eine tiefe Pfeilnarbe im Gesicht',
    use: 'Eine Narbe mit Geschichte und ein Heiler, der sie geschaffen hat: zwei Figuren, eine gemeinsame Erinnerung.',
    src: 'John Bradmore, Philomena (seine eigene Abhandlung, Zeitgenosse)' + ON('https://en.wikipedia.org/wiki/Henry_V_of_England') },
  { who: 'Ludwig der Fromme', meta: 'Frankenreich · 778–840 · Kaiser', era: E, cat: 'Körper & Gesten', rel: 'A',
    text: 'Er lachte nie laut, und wenn bei Festen die Spaßmacher auftraten, zeigte er nicht einmal seine weißen Zähne.',
    kurz: 'lacht nie laut, nicht einmal über die Spaßmacher',
    use: 'Ein Gesicht, das nichts verrät: Die Höflinge rätseln, ob er sich langweilt oder droht.',
    src: 'Thegan, Gesta Hludowici (um 837, Zeitgenosse)' },
  { who: 'Otto III.', meta: 'Heiliges Römisches Reich · 980–1002 · Kaiser', era: E, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Er aß allein an einem erhöhten, halbrunden Tisch und erneuerte damit, wie der Chronist schreibt, einen alten römischen Brauch. Im Jahr 1000 ließ er das Grab Karls des Großen öffnen.',
    kurz: 'speist allein an einem erhöhten Tisch',
    use: 'Distanz als Inszenierung: Wer allein isst, ist unnahbar. Und wer darf zu ihm hinauf?',
    src: 'Thietmar von Merseburg, Chronik (um 1012–18, Zeitgenosse)' },
  { who: 'Wilhelm II. Rufus', meta: 'England · um 1056–1100 · König', era: E, cat: 'Sprache & Humor', rel: 'B',
    text: 'Ein rotes Gesicht, Augen in zwei Farben mit glitzernden Flecken, und wenn er zornig war, stotterte er. Er schwor „beim Heiligen Antlitz von Lucca“.',
    kurz: 'stottert, sobald er zornig wird',
    use: 'Ein Sprachfehler, der nur im Zorn auftaucht, ist ein Warnsignal für alle im Raum.',
    src: 'Wilhelm von Malmesbury, Gesta Regum Anglorum (um 1125)' },
  { who: 'Balduin IV. von Jerusalem', meta: 'Jerusalem · 1161–1185 · König', era: E, cat: 'Ängste, Leiden & Laster', rel: 'A',
    text: 'Als Junge schrie er nie auf, wenn andere Jungen ihm beim Spiel den Arm zerkratzten. Sein Lehrer bemerkte es als Erster: Es war das erste Zeichen seines Aussatzes.',
    kurz: 'spürt keinen Schmerz, und keiner ahnt, warum',
    use: 'Was wie Tapferkeit aussieht, ist der Anfang einer Krankheit: ein Detail, das der Leser erst später versteht.',
    src: 'Wilhelm von Tyrus, Chronik (sein Lehrer, Zeitgenosse)' },
  { who: 'Christian IV.', meta: 'Dänemark · 1577–1648 · König', era: E, cat: 'Führungsstil', rel: 'A',
    text: 'In der Seeschlacht auf der Kolberger Heide 1644 kosteten ihn Splitter das rechte Auge; er stand auf und führte die Schlacht weiter. Dass die Splitter später zu Ohrringen für seine Geliebte verarbeitet wurden, ist eine Anekdote.',
    kurz: 'steht nach einer schweren Verwundung auf und befiehlt weiter',
    use: 'Der Moment, in dem er blutend wieder aufsteht, prägt seinen Ruf für immer.',
    src: 'Zeitgenössische Berichte' },
  { who: 'Johann t’Serclaes von Tilly', meta: 'Brabant und Reich · 1559–1632 · Feldherr der Katholischen Liga', era: E, cat: 'Sprache & Humor', rel: 'C',
    text: 'Er soll sich gerühmt haben, nie Wein getrunken, nie eine Frau berührt und nie eine Schlacht verloren zu haben, bis Breitenfeld 1631. Spätere Beschreibungen zeigen ihn in einem grünen Atlaswams, mit roter Feder am Hut, auf einem kleinen Grauschimmel.',
    kurz: 'rühmt sich, nie eine Schlacht verloren zu haben',
    use: 'Ein makelloser Ruf ist eine Last: Lass deinen Feldherrn seine erste Niederlage erleben und zeig, was von der Prahlerei übrig bleibt.',
    src: 'Spätere Beschreibungen und Anekdoten; die erste Quelle ließ sich nicht feststellen' },
  { who: 'El Cid', meta: 'Kastilien · um 1043–1099 · Heerführer', era: E, cat: 'Kleidung & Aussehen', rel: 'C',
    text: 'Im Heldenlied bindet er seinen Bart mit einer Schnur hoch, bevor er den königlichen Hof betritt, damit niemand ihn beleidigen kann, indem er daran zieht. Das ist Dichtung, um 1200 entstanden.',
    kurz: 'bindet seinen Bart hoch, bevor er unter Feinde geht',
    use: 'Eine kleine Vorsichtsmaßnahme verrät, wie viel Feindschaft er am eigenen Hof erwartet.',
    src: 'Cantar de mio Cid (um 1200)' },
  { who: 'Philipp II. von Spanien', meta: 'Spanien · 1527–1598 · König', era: E, cat: 'Arbeitsweise', rel: 'A',
    text: 'Der „Papierkönig“ versah Tausende Schriftstücke eigenhändig mit Randnotizen, oft spät in der Nacht. Diese Notizen sind erhalten.',
    kurz: 'kritzelt nachts Randnotizen in jedes Schriftstück',
    use: 'Ein Feldherr, der alles selbst liest, ist schwer zu täuschen und leicht zu ersticken: Man muss ihn nur mit Papier überschütten.',
    src: 'Seine erhaltenen eigenhändigen Randnotizen' },
  { who: 'John Hawkwood', meta: 'England und Italien · um 1323–1394 · Söldnerführer', era: E, cat: 'Sprache & Humor', rel: 'C',
    text: 'Die Italiener nannten ihn „Giovanni Acuto“, Johann den Scharfen. In einer Novelle wünschen ihm Mönche Frieden, und er antwortet: „Gott nehme euch eure Almosen!“, denn Frieden würde einen Mann ruinieren, der vom Krieg lebt. Die Antwort ist eine Erzählung, keine Chronik.',
    kurz: 'antwortet auf fromme Wünsche mit bissigem Spott',
    use: 'Ein Söldner, der offen zugibt, dass ihm der Frieden schaden würde: ehrlich, zynisch, gefährlich.',
    src: 'Franco Sacchetti, Trecentonovelle 181 (1390er Jahre)' + ON('https://en.wikipedia.org/wiki/John_Hawkwood') },
  /* ---------- Denker, Heilige, Künstler ---------- */
  { who: 'Bernhard von Clairvaux', meta: 'Burgund · 1090–1153 · Abt und Kreuzzugsprediger', era: DK, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Er war so in sich versunken, dass er einen ganzen Tag am Genfersee entlangritt und abends fragte, wo der See sei. Versehentlich gereichtes Öl trank er statt Wasser, ohne es zu merken, und aß tagelang rohes Blut, das man ihm statt Butter serviert hatte.',
    kurz: 'merkt vor lauter Grübeln nicht, was er isst',
    use: 'Der Verbündete, der außerhalb seiner Mission nichts wahrnimmt: nützlich und beunruhigend zugleich.',

  { who: 'Thomas von Aquin', meta: 'Italien und Paris · 1225–1274 · Theologe', era: DK, cat: 'Körper & Gesten', rel: 'B',
    text: 'An der Tafel König Ludwigs IX., in Gedanken versunken, schlug er plötzlich auf den Tisch und rief: „Damit sind die Manichäer erledigt!“ Der König ließ einen Schreiber holen, der das Argument festhielt. Riesig und schweigsam, nannten ihn Mitstudenten „den stummen Ochsen“; er soll mehreren Schreibern zugleich diktiert haben.',

  { who: 'Paolo Uccello', meta: 'Florenz · 1397–1475 · Maler', era: DK, cat: 'Arbeitsweise', rel: 'C',

  { who: 'Leonardo da Vinci', meta: 'Florenz und Mailand · 1452–1519 · Maler, Ingenieur, 1502 Militärbaumeister Cesare Borgias', era: DK, cat: 'Arbeitsweise', rel: 'A',

  { who: 'Piero di Cosimo', meta: 'Florenz · 1462–1522 · Maler', era: DK, cat: 'Ängste, Leiden & Laster', rel: 'C',
    text: 'Er ließ seinen Garten verwildern und seine Zimmer nie fegen, kochte Eier zu fünfzig auf einmal im Leimtopf und lebte davon. Er ertrug kein Kindergeschrei, keine hustenden Männer, keine Glocken und keine singenden Mönche, und er fürchtete Gewitter. So erzählt es Vasari, der gern übertreibt.',

    use: 'Lärmhass als Charakterzug, für ein Einsiedlergenie, das ausgerechnet in einem Belagerungslager arbeiten muss.',
    src: 'Giorgio Vasari, Lebensbeschreibungen (1550/1568), nach Gesprächen mit Leuten, die ihn noch kannten' },
  { who: 'Albrecht Dürer', meta: 'Nürnberg · 1471–1528 · Maler und Grafiker', era: DK, cat: 'Tiere & Gegenstände', rel: 'A',

    src: 'Dürers eigenes Tagebuch der Reise in die Niederlande (1520–21)' },
  { who: 'Michelangelo Buonarroti', meta: 'Florenz und Rom · 1475–1564 · Bildhauer, Maler, 1529 Festungsbaumeister von Florenz', era: DK, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Er aß wenig, beim Arbeiten oft nur Brot, und schlief wenig, oft in Kleidern und in den Stiefeln, die er gegen Krämpfe trug. Vasari erzählt, er habe Stiefel aus Hundeleder monatelang auf der bloßen Haut getragen, sodass beim Ausziehen die Haut mitging. Seine Nase hatte ihm der Bildhauer Torrigiano mit einem Faustschlag platt geschlagen.',

    src: 'Ascanio Condivi, Leben des Michelangelo (1553, mit seiner Mitwirkung); Giorgio Vasari, Lebensbeschreibungen (1568) für die Stiefel' },
  { who: 'Martin Luther', meta: 'Wittenberg · 1483–1546 · Reformator', era: DK, cat: 'Sprache & Humor', rel: 'A',
    text: 'Den Teufel bekämpfte er mit Spott und derben Witzen: In den Tischreden rühmt er sich, ihn mit einem Furz vertrieben oder ihm gesagt zu haben, er solle ihn am Hintern lecken. Versteckt auf der Wartburg schrieb er Melanchthon ausführlich über seine schmerzhafte Verstopfung.',

    src: 'Tischreden (Mitschriften seiner Studenten, 1531–46); Briefe an Melanchthon (1521)' },
  { who: 'Tycho Brahe', meta: 'Dänemark · 1546–1601 · Astronom', era: DK, cat: 'Tiere & Gegenstände', rel: 'B',
    text: '1566 verlor er in einem Duell im Dunkeln mit seinem Vetter, angeblich wegen einer mathematischen Frage, einen Teil der Nase und trug fortan Ersatz aus Metall; bei der Exhumierung 2010 fand man Messingspuren. Er hielt einen kleinwüchsigen Narren, Jepp, der unter dem Tisch saß und als hellsichtig galt. Die Geschichte von seinem zahmen Elch, der zu viel Bier trank und die Treppe hinunterfiel, ist eine Anekdote.',

    text: 'Am 24. April 1604 zeigte ihn ein Kellner der Osteria del Moro an: Caravaggio hatte gefragt, welche seiner acht Artischocken in Butter und welche in Öl gekocht seien. Als der Kellner sagte, er solle daran riechen, warf er ihm den Teller ins Gesicht und griff zum Schwert. Wegen unerlaubten Tragens von Schwert und Dolch wurde er mehrmals verhaftet.',
    kurz: 'greift wegen einer Kleinigkeit zur Waffe, wenn sein Stolz verletzt ist',

    text: 'Ein Hypochonder: Er ritt oft mit einem erhobenen Arm, weil er glaubte, dieser sei schwerer als der andere und so fließe das Blut zurück. Pfeffer mied er, weil er ihm angeblich ein Bein schwächte, und er saß kerzengerade, damit seine Organe richtig lägen. Dass er in der Schlacht ständig an Zitronen lutschte, ist zweifelhaft.',

  ['Wikinger trugen Hörnerhelme.', 'Kein Helm der Wikingerzeit hatte Hörner; der einzige fast vollständige Fund aus Gjermundbu ist hörnerlos, das Bild stammt aus der Kunst des 19. Jahrhunderts und aus Carl Emil Doeplers Kostümen für Wagners „Ring“ in Bayreuth 1876.', 'Roberta Frank, 2000'],
