  { who: 'Demosthenes', meta: 'Athen · 384–322 v. Chr. · Redner und Politiker', era: AN, grp: DK, cat: 'Arbeitsweise', rel: 'B',
    text: 'Gegen seine schwache Stimme und sein Lispeln übte er monatelang in einer unterirdischen Studierstube und schor sich eine Kopfhälfte kahl, damit ihn die Scham im Haus hielt, selbst wenn er hinauswollte. Er sprach mit Kieselsteinen im Mund, deklamierte beim Laufen und beim Steigen auf steile Hänge und probte seinen Vortrag vor einem großen Spiegel. Den unterirdischen Raum zeigte man noch zu Plutarchs Zeit.',
    kurz: 'schert sich den halben Kopf kahl, damit er nicht ausgehen kann',
    use: 'Selbstsabotage als Disziplin zeigt, wie weit dein Feldherr geht, um eine Schwäche zu besiegen, etwa eine Stimme, die vor dem Heer nicht trägt.',
    src: 'Plutarch, Demosthenes 7 und 11 (um 100 n. Chr., rund 420 Jahre später); für Steine und Laufen beruft er sich auf Demetrios von Phaleron, der es vom alten Demosthenes selbst gehört haben will' },
  { who: 'Archimedes', meta: 'Syrakus · um 287–212 v. Chr. · Mathematiker und Ingenieur', era: AN, grp: DK, cat: 'Körper & Gesten', rel: 'B',
    text: 'Über der Geometrie vergaß er zu essen und vernachlässigte seinen Körper, sodass ihn seine Diener mit Gewalt ins Bad und zum Einölen schleppen mussten. Selbst dort zeichnete er Figuren in die Asche des Herdes und zog mit dem Finger Linien auf seiner frisch geölten Haut.',
    kurz: 'zeichnet mit dem Finger Figuren in Asche oder auf die eigene Haut',
    use: 'Gib deinem Belagerungsingenieur die Gewohnheit, mit der Fingerspitze Linien in verschütteten Wein zu ziehen, während der Feldherr auf ihn einredet: So zeigst du ohne ein Wort, wo seine Gedanken sind.',
    src: 'Plutarch, Marcellus 17.6 (um 100 n. Chr., rund 300 Jahre später, als allgemeine Überlieferung)' },
  { who: 'Plinius der Ältere', meta: 'Rom und Misenum · 23/24–79 n. Chr. · Naturforscher und Admiral', era: AN, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Jede Stunde ohne Studium hielt er für verloren: Im Winter begann er um Mitternacht oder ein Uhr bei Lampenlicht, ließ sich beim Essen und beim Abreiben nach dem Bad vorlesen und hatte stets einen Schreiber neben sich, dessen Hände gegen die Kälte umwickelt waren. Als ein Gast den Vorleser ein falsch ausgesprochenes Wort wiederholen ließ, fragte Plinius, ob er es denn verstanden habe, und dann: „Warum lässt du ihn zurückgehen? Durch deine Unterbrechung haben wir mehr als zehn Zeilen verloren.“ Seinen Neffen, der zu Fuß ging, statt sich in der Sänfte tragen zu lassen, schalt er: „Diese Stunden hättest du nicht verlieren müssen.“',
    kurz: 'lässt sich beim Essen Berichte vorlesen und zählt verlorene Zeit in Zeilen',
    use: 'Lass deinen Feldherrn sich beim Essen Meldungen vorlesen und Unterbrechungen in verlorenen Zeilen messen, dann wird jedes Tischgespräch zur Prüfung für seine Offiziere.',
    src: 'Plinius der Jüngere, Briefe 3.5 (um 101–104 n. Chr., Neffe und Adoptivsohn, der bei ihm lebte; rund 25 Jahre nach seinem Tod)' },
  { who: 'Plinius der Ältere', meta: 'Rom und Misenum · 23/24–79 n. Chr. · Naturforscher und Admiral', era: AN, grp: DK, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Während der Vesuv ausbrach, schlief der Admiral der Flotte von Misenum in Stabiae so fest, dass man draußen vor seiner Tür seine schweren, lauten Atemzüge hörte.',
    kurz: 'schläft tief und schnarchend, während draußen die Welt untergeht',
    use: 'Lass deinen Feldherrn in der größten Gefahr hörbar schlafen: Das beruhigt die Wachen vor dem Zelt mehr als jede Rede, ob der Schlaf nun echt ist oder gespielt.',
    src: 'Plinius der Jüngere, Briefe 6.16 (vom Neffen und Adoptivsohn)' },

  /* ---------- Asien und islamische Welt ---------- */
  { who: 'Konfuzius (Kong Qiu)', meta: 'Staat Lu, China · 551–479 v. Chr. · Lehrer', era: AS, grp: DK, cat: 'Rituale & Aberglaube', rel: 'B',
    text: '„Lag seine Matte nicht gerade, setzte er sich nicht.“ Schlecht geschnittenes Fleisch oder Fleisch ohne die passende Soße aß er nicht, Ingwer fehlte bei keiner Mahlzeit, beim Essen und im Bett sprach er nicht, und bei plötzlichem Donner oder heftigem Sturm veränderte sich sein Gesicht. Das Buch, das seine Schule zusammenstellte, liest sich allerdings teils wie ein idealisierter Benimmkodex.',
    kurz: 'setzt sich erst, wenn seine Matte vollkommen gerade liegt',
    use: 'Gib deinem Feldherrn ein Ordnungsritual, das sein Stab vorauszuahnen lernt, dann wird jede Unordnung in seinem Zelt zum Warnzeichen.',
    src: 'Lunyu (Gespräche), Buch 10 (5. bis 4. Jahrhundert v. Chr., von Schülern und deren Schülern, ein bis drei Generationen später)' },
  { who: 'Ibn Sina (Avicenna)', meta: 'Buchara und Persien · um 980–1037 · Arzt und Philosoph', era: AS, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Kam er bei einem Problem nicht weiter, ging er in die Moschee und betete, bis es sich ihm öffnete. Nachts las er bei Lampenlicht, trank gegen Müdigkeit einen Becher Wein und las weiter, und schlief er doch ein, sah er dieselben Probleme im Traum und löste viele davon dort. Die „Metaphysik“ des Aristoteles las er vierzigmal, ohne sie zu verstehen, bis ihm ein Buchhändler auf dem Markt für drei Dirham den Kommentar al-Farabis aufschwatzte; der erschloss ihm das Buch, und am nächsten Tag gab er den Armen aus Dank reichlich Almosen.',
    kurz: 'betet, trinkt und schläft über einem Problem, bis es sich löst',
    use: 'Ein fester Ablauf für Momente der Ratlosigkeit (beten, trinken, darüber schlafen, zurückkehren) gibt deinem Feldherrn einen sichtbaren Rhythmus aus Rückzug und Durchbruch, den seine Leute zu deuten lernen.',
    src: 'Ibn Sina, Autobiografie, diktiert seinem Schüler al-Dschuzdschani, der sie nach seinem Tod fortsetzte (frühes 11. Jahrhundert), überliefert bei Ibn Abi Usaibia (13. Jahrhundert); englisch: W. E. Gohlman, The Life of Ibn Sina (1974)' },
  { who: 'Murasaki Shikibu', meta: 'Japan (Heian-Zeit) · um 973–nach 1014 · Romanautorin und Hofdame', era: AS, grp: DK, cat: 'Sprache & Humor', rel: 'A',
    text: 'Als Kind lernte sie die chinesischen Klassiker schneller als ihr Bruder, und ihr Vater seufzte, es sei sein Pech, dass sie nicht als Mann geboren sei. Als eine neidische Hofdame sie „Dame Chronik“ nannte, weil der Kaiser ihre Gelehrsamkeit gelobt hatte, tat sie so, als könne sie nicht einmal das Zeichen für „eins“ schreiben, und unterrichtete die Kaiserin nur heimlich in den Gedichten des Bai Juyi, wenn niemand sonst im Raum war.',
    kurz: 'tut so, als könne er nicht lesen, um unterschätzt zu werden',
    use: 'Lass deinen Feldherrn so tun, als könne er die Schrift des Feindes nicht lesen oder keine Karte verstehen, um Neid zu entgehen oder unterschätzt zu werden.',
    src: 'Murasaki Shikibu, Tagebuch (Murasaki Shikibu nikki, um 1008–1010, eigene Aufzeichnungen); englisch: Richard Bowring, The Diary of Lady Murasaki (1996)' },

  /* ---------- Nach 1650: Denker, Forscher, Künstler ---------- */
  { who: 'Isaac Newton', meta: 'Cambridge · 1643–1727 · Naturforscher', era: NL, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Um zu prüfen, ob Farben durch Druck auf das Auge entstehen, schob der junge Newton eine dicke, stumpfe Nadel „zwischen mein Auge und den Knochen, so nah an die Rückseite meines Auges, wie ich konnte“, drückte und hielt mit einer Skizze die weißen, dunklen und farbigen Kreise fest, die er sah. Ein andermal blickte er über einen Spiegel so lange in die Sonne, dass er sich tagelang in einem dunklen Zimmer einschließen musste, bis sich seine Augen erholt hatten.',
    kurz: 'erprobt alles zuerst am eigenen Leib',
    use: 'Lass deinen Feldherrn alles zuerst an sich selbst prüfen, ein Gift, ein Seil, das Eis auf dem Fluss: Das macht ihn erschreckend und überzeugend zugleich.',
    src: 'Isaac Newton, Notizbuch „Of Colours“, Cambridge University Library MS Add. 3975 (um 1665–1666, eigene Hand); die Sonne: Brief an John Locke, 30. Juni 1691 (rund 25 Jahre später)' },
  { who: 'Isaac Newton', meta: 'Cambridge · 1643–1727 · Naturforscher', era: NL, grp: DK, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Sein Gehilfe sah ihn nie ausruhen: Newton ging selten vor zwei oder drei Uhr nachts ins Bett und vergaß oft das Essen, das dann unberührt dastand. Erinnerte man ihn, sagte er „Hab ich das?“, aß im Stehen ein, zwei Bissen und arbeitete weiter. Im Garten blieb er manchmal jäh stehen, rannte die Treppe hinauf und schrieb im Stehen am Pult, ohne sich einen Stuhl heranzuziehen.',
    kurz: 'vergisst das Essen und schlingt ein paar Bissen im Stehen',
    use: 'Der unberührte Teller deines Feldherrn verrät seinem Stab mehr über den Stand des Feldzugs als jeder Bericht.',
    src: 'Humphrey Newton (nicht verwandt, sein Schreiber 1685–1690, in den Jahren der „Principia“), Briefe an John Conduitt (1728, rund 40 Jahre später, für eine geplante Lobrede)' },
  { who: 'Samuel Johnson', meta: 'London · 1709–1784 · Lexikograf und Kritiker', era: NL, grp: DK, cat: 'Körper & Gesten', rel: 'A',
    text: 'Er achtete ängstlich darauf, eine Tür mit einer festen Zahl von Schritten von einem festen Punkt aus zu durchschreiten, sodass der rechte Fuß zuerst die Schwelle traf (oder der linke, Boswell war sich nicht sicher); misslang es, ging er zurück, stellte sich neu auf und versuchte es noch einmal. Beim Reden käute er wieder, pfiff halb, gluckste wie eine Henne oder murmelte „too, too, too“, und nach einem hitzigen Streit blies er den Atem aus „wie ein Wal“. Frances Reynolds sah ihn auf der Schwelle sich drehen und winden und dann mit einem riesigen Schritt hinübersetzen, „als wette er, wie weit er schreiten könne“.',
    kurz: 'betritt jeden Raum mit abgezählten Schritten und beginnt notfalls von vorn',
    use: 'Gib deinem Feldherrn ein Schwellenritual, das der ganze Haushalt kennt und niemand zu erwähnen wagt, dann stehen Zwang und gewaltiger Verstand nebeneinander.',
    src: 'James Boswell, Life of Samuel Johnson (1791), unter dem Jahr 1764 (Boswell kannte ihn seit 1763 und führte genau Tagebuch); Frances Reynolds, Recollections of Dr Johnson (langjährige Bekannte, postum erschienen); heutige Deutung: Tourette-Syndrom mit Zwängen (T. J. Murray, British Medical Journal, 1979)' },
  { who: 'Samuel Johnson', meta: 'London · 1709–1784 · Lexikograf und Kritiker', era: NL, grp: DK, cat: 'Tiere & Gegenstände', rel: 'A',
    text: 'Austern für seinen Kater Hodge kaufte er selbst, „damit die Diener, wenn sie diese Mühe hätten, das arme Tier nicht ablehnen“. Außerdem hob er die ausgekratzten, getrockneten Schalen der Orangen auf, die er ausgepresst hatte, und als Boswell fragte, was er damit mache, wollte er es nicht verraten.',
    kurz: 'sammelt getrocknete Orangenschalen und verrät niemandem, wozu',
    use: 'Versteck die Zärtlichkeit deines Feldherrn in einer praktischen Regelung, und gib ihm ein kleines Geheimnis, das er niemandem erklärt.',
    src: 'James Boswell, Life of Samuel Johnson (1791), eigene Beobachtung' },
  { who: 'Benjamin Franklin', meta: 'Philadelphia, London und Paris · 1706–1790 · Drucker, Forscher und Diplomat', era: NL, grp: DK, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Als junger Mann führte er ein Büchlein mit einer Seite für jede von dreizehn Tugenden, in sieben Spalten für die Wochentage geteilt, und markierte jeden Fehler mit „einem kleinen schwarzen Punkt“. Als das Papier vom vielen Radieren durchgescheuert war, nahm er ein Notizbuch mit Elfenbeinblättern, die er mit einem nassen Schwamm abwischte, und gab zu, die Tugend „Ordnung“ nie gemeistert zu haben.',
    kurz: 'führt ein Büchlein über seine eigenen Fehler und prüft es jeden Abend',
    use: 'Ein Büchlein mit den eigenen Fehlern, jeden Abend geprüft, macht die Selbstzucht deines Feldherrn sichtbar und gibt einem Rivalen etwas, das er stehlen und lesen kann.',
    src: 'Benjamin Franklin, Autobiografie, Teil 2 (1784 in Passy geschrieben, über die Jahre um 1730)' },
  { who: 'Benjamin Franklin', meta: 'Philadelphia, London und Paris · 1706–1790 · Drucker, Forscher und Diplomat', era: NL, grp: DK, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Später nahm er „Luftbäder“: Er stand früh auf und saß eine halbe bis eine ganze Stunde nackt in seinem Zimmer, las oder schrieb, und ging danach manchmal wieder ins Bett, für „den angenehmsten Schlaf, den man sich vorstellen kann“.',
    kurz: 'sitzt jeden Morgen eine Stunde nackt da und liest',
    use: 'Eine harmlose, aber peinliche Morgengewohnheit ist ein Geschenk für Szenen: Überleg, wer mit einer Eilmeldung hereinplatzt und wie dein Feldherr reagiert.',
    src: 'Benjamin Franklin, Brief an Jacques Barbeu-Dubourg, 28. Juli 1768 (eigener Bericht)' },
  { who: 'James Cook', meta: 'Britische Marine · 1728–1779 · Seefahrer und Entdecker', era: NL, grp: AF, cat: 'Führungsstil', rel: 'A',
    text: 'Seine Mannschaft verweigerte das Sauerkraut gegen Skorbut, also ließ er es täglich nur an der Offizierstafel auftragen und stellte es den Männern frei; nach einer Woche musste er es rationieren. Seeleute murrten über alles, was „aus dem Gewöhnlichen“ falle, schrieb er, doch sobald sie sähen, dass ihre Vorgesetzten es schätzten, „wird es das feinste Zeug der Welt“. Zu Beginn der Reise, auf Madeira, hatte er zwei Männer mit je zwölf Peitschenhieben bestrafen lassen, weil sie ihre Ration frisches Rindfleisch verweigerten.',
    kurz: 'lässt Unbeliebtes zuerst an der Offizierstafel servieren, bis alle es wollen',
    use: 'Lass deinen Feldherrn über Status lenken, die Offiziere zuerst bedienen, damit die Männer es auch wollen, und notfalls zur Peitsche greifen: Das zeigt einen gerissenen, nüchternen Blick auf Menschen.',
    src: 'James Cook, Tagebuch der Endeavour-Reise, Tag für Tag geführt: Sauerkraut im Eintrag vom 13. April 1769 auf Tahiti, die Auspeitschung auf Madeira' },
  { who: 'Immanuel Kant', meta: 'Königsberg · 1724–1804 · Philosoph', era: NL, grp: DK, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Sein Tag lief wie ein Uhrwerk: Um fünf weckte ihn sein Diener Martin Lampe, dann Tee und eine einzige Pfeife, Vorlesungen, ein langes Mittagessen mit Gästen und danach ein Spaziergang, immer allein, damit er in der kalten Luft durch die Nase atmen konnte und nicht reden musste. Heine, der ihn nie traf, malte später das Bild dazu: Kant im grauen Rock mit spanischem Rohr, hinter ihm der alte Lampe mit einem großen Regenschirm, besorgt „wie ein Bild der Vorsehung“.',
    kurz: 'geht jeden Tag zur selben Stunde allein denselben Weg',
    use: 'Eine Routine, so genau, dass schon ihr Ausbleiben der ganzen Stadt etwas verrät, kann dein Feldherr auch absichtlich brechen, um eine falsche Nachricht zu senden.',
    src: 'L. E. Borowski, R. B. Jachmann und E. A. C. Wasianski, drei Biografien von Freunden (alle 1804, im Todesjahr); Heinrich Heine, Zur Geschichte der Religion und Philosophie in Deutschland, Buch 3 (1834, 30 Jahre später, ohne ihn gekannt zu haben)' },
  { who: 'Immanuel Kant', meta: 'Königsberg · 1724–1804 · Philosoph', era: NL, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Abends dachte er nach, während er aus dem Fenster auf den Turm der Löbenichtschen Kirche blickte. Als die Pappeln eines Nachbarn so hoch wuchsen, dass sie den Turm verdeckten, wurde er so unruhig, dass er nicht mehr denken konnte, bis der Nachbar sie gefällig stutzen ließ. 1802, nachdem er Lampe, seinen Diener seit etwa 40 Jahren, entlassen hatte, schrieb der alte, schwächer werdende Kant in sein Notizbuch: „Der Name Lampe muss nun völlig vergessen werden.“',
    kurz: 'braucht beim Denken einen festen Punkt, auf den er blicken kann',
    use: 'Lass die Leute deines Feldherrn heimlich Bäume stutzen, damit er seinen Blickpunkt behält, oder lass ihn sich schriftlich befehlen, einen Namen zu vergessen, der gerade dadurch lebendig bleibt.',
    src: 'E. A. C. Wasianski, Immanuel Kant in seinen letzten Lebensjahren (1804, der Freund, der in den letzten Jahren seinen Haushalt führte); der Turm auch bei Thomas De Quincey, The Last Days of Immanuel Kant (1827)' },
  { who: 'Johann Wolfgang von Goethe', meta: 'Weimar · 1749–1832 · Dichter und Minister', era: NL, grp: DK, cat: 'Ängste, Leiden & Laster', rel: 'A',
    text: 'Besucher mit Brille konnte er nicht ausstehen. Er gab zu, das sei vielleicht „eine Wunderlichkeit“ von ihm, doch wenn ein Fremder mit Gläsern auf der Nase eintrat, überkam ihn schlechte Laune: Er fühlte sich gemustert, als wolle der andere „mit bewaffnetem Blick“ in sein Innerstes dringen und jede Falte seines alten Gesichts erspähen, während er selbst dessen Augen nicht richtig sehen konnte.',
    kurz: 'erträgt niemanden, dessen Augen er nicht sehen kann',
    use: 'Gib deinem Feldherrn eine Abneigung gegen alles, was die Augen verbirgt (Visier, Schleier, Kapuze), denn Mächtige hassen es, von jemandem geprüft zu werden, den sie selbst nicht lesen können.',
    src: 'Johann Peter Eckermann, Gespräche mit Goethe (erschienen 1836–1848; Eckermann sah ihn 1823–1832 fast täglich, überarbeitete seine Notizen aber für den Druck)' },
  { who: 'Friedrich Schiller', meta: 'Jena und Weimar · 1759–1805 · Dichter und Dramatiker', era: NL, grp: DK, cat: 'Tiere & Gegenstände', rel: 'B',
    text: 'Goethe wartete einmal an Schillers Schreibtisch, als ihm übel und schwindlig wurde; die Ursache war ein entsetzlicher Geruch aus einer Schublade voller fauler Äpfel, und er musste ans Fenster, um Luft zu schöpfen. Charlotte Schiller erklärte ihm, die Schublade werde absichtlich stets mit faulen Äpfeln gefüllt, weil der Geruch ihrem Mann guttue und er ohne ihn nicht leben und arbeiten könne.',
    kurz: 'bewahrt faule Äpfel auf, weil ihr Geruch ihm beim Denken hilft',
    use: 'Eine sinnliche Krücke, die dein Feldherr zum Arbeiten braucht und die alle anderen abstößt, sorgt für Reibung mit Besuchern und verrät, wo er zuletzt gearbeitet hat.',
    src: 'Johann Peter Eckermann, Gespräche mit Goethe, Eintrag vom 7. Oktober 1827 (Goethes Erinnerung an ein Ereignis rund 25 bis 35 Jahre zuvor)' },
  { who: 'Ludwig van Beethoven', meta: 'Wien · 1770–1827 · Komponist', era: NL, grp: DK, cat: 'Schlaf, Essen & Trinken', rel: 'C',
    text: 'Für jede Tasse Frühstückskaffee soll er genau 60 Bohnen abgezählt haben, oft einzeln, besonders wenn Gäste dabei waren. Das berichtet allein Anton Schindler, der nach Beethovens Tod nachweislich weit über hundert falsche Einträge in dessen Konversationshefte schrieb, deshalb ist die Geschichte zweifelhaft.',
    kurz: 'zählt jeden Morgen seine Ration Bohne für Bohne ab',
    use: 'Eine abgezählte Ration (Bohnen, Körner, Münzen) taugt als Kontrollritual, und als Gerücht, das ein unzuverlässiger Bewunderer über deinen Feldherrn verbreitet, ist sie selbst ein brauchbares Motiv.',
    src: 'Anton Schindler, Biographie von Ludwig van Beethoven (1840, 13 Jahre nach seinem Tod; Schindler war in den 1820er-Jahren sein unbezahlter Sekretär); die Fälschungen wiesen Dagmar Beck und Grita Herre 1977 nach' },
  { who: 'Ludwig van Beethoven', meta: 'Wien · 1770–1827 · Komponist', era: NL, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Auf einem langen Spaziergang bemerkte sein Schüler Ferdinand Ries, dass Beethoven den ganzen Weg über brummte und heulte, ohne bestimmte Töne zu singen; ihm sei ein Thema für den letzten Satz einer Sonate eingefallen, sagte er, der „Appassionata“. Zu Hause stürzte er, ohne den Hut abzunehmen, ans Klavier und tobte eine Stunde lang darauf herum, während Ries vergessen in einer Ecke saß.',
    kurz: 'brummt auf langen Märschen tonlos vor sich hin, wenn er nachdenkt',
    use: 'Lass deinen Feldherrn auf dem Marsch tonlos brummen und knurren und dann, ohne den Helm abzunehmen, zum Kartentisch stürzen: Seine Leute wissen sofort, dass der nächste Zug geboren ist.',
    src: 'Franz Wegeler und Ferdinand Ries, Biographische Notizen über Ludwig van Beethoven (1838; Ries’ Augenzeugenbericht von einem Spaziergang um 1804, rund 30 Jahre später)' },
  { who: 'Alexander von Humboldt', meta: 'Preußen und Amerika · 1769–1859 · Naturforscher und Entdecker', era: NL, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Für seine Versuche zur „tierischen Elektrizität“ ließ er sich auf dem Rücken über den Schultermuskeln zwei Blasen ziehen, öffnete sie und legte Zink und Silber auf die wunden Stellen; er notierte das Brennen, das Zucken der Muskeln und die rötliche Wundflüssigkeit, die Striemen hinterließ. 1800 in Venezuela trat er „unvorsichtigerweise“ mit beiden Füßen auf einen frisch gefangenen Zitteraal und schrieb, keine Leidener Flasche habe ihm je einen so furchtbaren Schlag versetzt; Knie und fast alle Gelenke schmerzten ihn den Rest des Tages.',
    kurz: 'setzt sich selbst Schmerzen aus und notiert sie genau',
    use: 'Wenn dein Feldherr selbst auf das gefährliche Ding tritt, um herauszufinden, was es tut, schenkt er seinen Männern eine Geschichte, die sie jahrelang erzählen.',
    src: 'Alexander von Humboldt, Versuche über die gereizte Muskel- und Nervenfaser (1797, eigener Bericht); der Zitteraal bei Calabozo in seinem Reisewerk Relation historique (1814–1825, 15 bis 20 Jahre nach der Reise)' },
  { who: 'Honoré de Balzac', meta: 'Paris · 1799–1850 · Romanautor', era: NL, grp: DK, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Er schrieb nächtelang mit Kaffee und beschrieb seine eigene „schreckliche, ziemlich brutale“ Notmethode: fein gemahlenes, fest gepresstes Pulver, kalt und fast trocken auf nüchternen Magen. Dann, schrieb er, gerieten die Ideen in Bewegung „wie die Bataillone der Großen Armee auf dem Schlachtfeld“: Erinnerungen stürmen mit wehenden Fahnen heran, die leichte Kavallerie der Vergleiche entfaltet sich im Galopp, die Artillerie der Logik rückt mit ihrem Tross an, Geistesblitze schwärmen als Plänkler aus. Dabei trug er eine weiße Kutte, geschnitten wie das Habit eines Dominikaners.',
    kurz: 'kaut nachts bittere Bohnen, um wach zu bleiben',
    use: 'Lass deinen Feldherrn sein eigenes Denken als Truppenbewegung beschreiben, mit seinem Aufputschtrank als Signal zum Angriff: Das verrät viel darüber, wie er die Welt sieht.',
    src: 'Honoré de Balzac, Traité des excitants modernes (1839, eigener Essay, erschienen mit einer Ausgabe von Brillat-Savarins Physiologie du goût); die weiße Kutte: Théophile Gautier, Honoré de Balzac (Erinnerungen eines Freundes)' },
  { who: 'Victor Hugo', meta: 'Paris und Guernsey · 1802–1885 · Dichter und Romanautor', era: NL, grp: DK, cat: 'Kleidung & Aussehen', rel: 'A',
    text: 'Im Herbst 1830, unter dem Termindruck seines Verlegers für „Notre-Dame de Paris“, kaufte er eine Flasche Tinte und ein großes Strickgewand aus grauer Wolle, das ihn „vom Hals bis zu den Füßen“ einhüllte, und schloss seine Kleider weg, um nicht in Versuchung zu geraten auszugehen. Dann „trat er in seinen Roman ein wie in ein Gefängnis“. Die verbreitete Behauptung, er habe nackt geschrieben, ist eine Verzerrung dieser Stelle.',
    kurz: 'lässt seine Stiefel wegschließen, bis der Plan fertig ist',
    use: 'Lass deinen Feldherrn seine Stiefel verstecken oder sein Pferd wegschicken, damit er nicht gehen kann, bevor der Plan steht: das selbst gewählte Gefängnis.',
    src: 'Adèle Hugo, Victor Hugo raconté par un témoin de sa vie (1863, von seiner Frau, mit Hugos Mitwirkung, rund 33 Jahre später)' },
  { who: 'Charles Dickens', meta: 'London und Kent · 1812–1870 · Romanautor', era: NL, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Seine Tochter Mamie, die sich auf dem Sofa in seinem Arbeitszimmer erholte, sah ihn schnell schreiben, aufspringen, zum Spiegel eilen und wilde Grimassen schneiden, zurückstürzen, weiterschreiben und sich schließlich zu ihr umdrehen, ohne sie zu sehen, leise und schnell redend: Er war, so schloss sie, die Figur geworden, die er schrieb. Gegen seine Schlaflosigkeit wanderte er ganze Nächte durch die Straßen Londons.',
    kurz: 'schneidet vor dem Spiegel Grimassen, um seinen Gegner zu verstehen',
    use: 'Lass deinen Feldherrn vor einem polierten Schild den gegnerischen Heerführer nachspielen, bevor er entscheidet, so wird „wie der Feind denken“ sichtbar.',
    src: 'Mamie Dickens, My Father as I Recall Him (1896–1897, Erinnerung der Tochter, rund 40 Jahre später); Charles Dickens, „Night Walks“, All the Year Round, Juli 1860' },
  { who: 'Charles Darwin', meta: 'Down House, Kent · 1809–1882 · Naturforscher', era: NL, grp: DK, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Jeden Tag ging er eine feste Zahl von Runden auf dem „Sandwalk“, einem Kiesweg rund um ein Wäldchen, und zählte mit, indem er an der Wende jedes Mal einen Feuerstein von einem kleinen Haufen stieß. Jeden Abend spielte er zwei Partien Backgammon mit seiner Frau Emma und führte ein Leben lang Buch; 1876 prahlte er: „Sie, das arme Geschöpf, hat nur 2 490 Partien gewonnen, ich dagegen, hurra, hurra, 2 795!“',
    kurz: 'zählt seine Runden, indem er bei jeder einen Stein vom Haufen stößt',
    use: 'Ein Zählritual mit Steinen und eine lebenslange Strichliste gegen die eigene Frau zeigen Zuneigung als gespielte Rivalität und geben deinem Feldherrn eine private Seite.',
    src: 'Francis Darwin, „Reminiscences of My Father’s Everyday Life“, in: The Life and Letters of Charles Darwin (1887, fünf Jahre nach seinem Tod, von Sohn und Assistent); Charles Darwin, Brief an Asa Gray (1876)' },
  { who: 'Charles Darwin', meta: 'Down House, Kent · 1809–1882 · Naturforscher', era: NL, grp: DK, cat: 'Ängste, Leiden & Laster', rel: 'A',
    text: 'Vier Jahrzehnte lang litt er unter Erbrechen, Blähungen, Ekzemen, Herzklopfen und Erschöpfung und benotete von 1849 bis 1855 in einem Gesundheitstagebuch jeden Tag und jede Nacht. Bei der Wasserkur in Malvern 1849 wurde er frühmorgens mit kalten, nassen Tüchern abgerieben und in nasse Laken gewickelt, dazu kamen kalte Fußbäder und verordnete Spaziergänge. Die Krankheit habe „mehrere Jahre meines Lebens vernichtet“, schrieb er, ihn aber „vor der Ablenkung durch Gesellschaft und Vergnügen bewahrt“.',
    kurz: 'nutzt seine echte Krankheit, um lästigen Versammlungen fernzubleiben',
    use: 'Eine chronische Krankheit, die echt und zugleich bequem ist, erlaubt deinem Feldherrn, Kriegsräte, Gelage und Besucher zu meiden, ohne dass ihm jemand einen Vorwurf machen kann.',
    src: 'Charles Darwin, Briefe von 1849 über die Kur, Gesundheitstagebuch 1849–1855 (Cambridge University Library) und Autobiografie (geschrieben 1876, erschienen 1887); die Ursache seines Leidens ist bis heute umstritten' },
  { who: 'Nikola Tesla', meta: 'Österreich-Ungarn und New York · 1856–1943 · Erfinder', era: NL, grp: DK, cat: 'Ängste, Leiden & Laster', rel: 'A',
    text: 'Auf Spaziergängen zählte er seine Schritte, und er berechnete den Rauminhalt von Suppentellern, Kaffeetassen und Speisebrocken, sonst schmeckte ihm das Essen nicht; jede wiederholte Handlung musste durch drei teilbar sein, sonst fing er von vorn an, „selbst wenn es Stunden dauerte“. Ohrringe an Frauen waren ihm zuwider, der Anblick einer Perle brachte ihn fast aus der Fassung, und ein Stück Kampfer irgendwo im Haus verursachte ihm „das heftigste Unbehagen“.',
    kurz: 'tut alles in Dreiergruppen und beginnt von vorn, wenn er sich verzählt',
    use: 'Ein Zahlenzwang, nach dem sich der Stab richten muss (dreifache Wachen, drei Gänge), und ein unerklärlicher Ekel vor einem harmlosen Gegenstand machen deinen Feldherrn berechenbar, und ein kluger Gegner nutzt das.',
    src: 'Nikola Tesla, „My Inventions“, autobiografische Artikelserie in Electrical Experimenter (1919, mit 62 Jahren über seine Jugend geschrieben, selbstdramatisierend)' },
  { who: 'Marie Curie', meta: 'Warschau und Paris · 1867–1934 · Physikerin und Chemikerin', era: NL, grp: DK, cat: 'Rituale & Aberglaube', rel: 'A',
    text: 'Als sie in einem undichten Schuppen in der Rue Lhomond Radium isolierte, gingen sie und Pierre nachts noch einmal in den Arbeitsraum, nur um zu schauen. Ringsum sahen sie die schwach leuchtenden Umrisse der Flaschen und Schalen mit ihren Präparaten, wie blasse Feenlichter, ein Anblick, den sie schön und immer wieder neu fand.',
    kurz: 'kehrt nachts in die Waffenkammer zurück, nur um zu schauen',
    use: 'Gib deinem Feldherrn ein stilles Ritual des Staunens, etwa nachts zu den Signalfeuern zu gehen, nur um sie anzusehen, ohne dass jemand eine Lampe anzünden darf.',
    src: 'Marie Curie, „Autobiographical Notes“, in ihrem Buch Pierre Curie (1923, eigener Bericht, rund 25 Jahre später)' },
  { who: 'Franz Kafka', meta: 'Prag · 1883–1924 · Schriftsteller und Versicherungsjurist', era: NL, grp: DK, cat: 'Arbeitsweise', rel: 'A',
    text: 'Er teilte seinen Tag in zwei Hälften: Büro bis etwa halb drei, Mittagessen, Schlaf bis halb acht, zehn Minuten Gymnastik nackt am offenen Fenster, eine Stunde Spaziergang, Abendessen mit der Familie, dann Schreiben bis ein, zwei oder drei Uhr nachts. Ins Tagebuch notierte er 1912: „Diese Geschichte ‚Das Urteil‘ habe ich in der Nacht vom 22. zum 23. von zehn Uhr abends bis sechs Uhr früh in einem Zug geschrieben.“ Danach konnte er die vom Sitzen steifen Beine kaum unter dem Schreibtisch hervorziehen.',
    kurz: 'dient tagsüber pflichtbewusst und arbeitet nachts an seinen eigenen Plänen',
    use: 'Lass deinen Feldherrn tagsüber pflichtbewusst gehorchen und nachts heimlich seinen eigenen Feldzug planen, und verrate die durchwachte Nacht nur durch seine steifen Beine am Morgen.',
    src: 'Franz Kafka, Brief an Felice Bauer (Tagesplan) und Tagebuch, Eintrag vom 23. September 1912 (zeitgleich)' },
  { who: 'Roald Amundsen', meta: 'Norwegen · 1872–1928 · Polarforscher', era: NL, grp: AF, cat: 'Schlaf, Essen & Trinken', rel: 'A',
    text: 'Mit 15 Jahren las er die Berichte von Sir John Franklin über die Entbehrungen in der Arktis, beschloss heimlich, Polarforscher zu werden, und begann sich abzuhärten: Er spielte Fußball, den er nicht mochte, unternahm lange Skitouren und schlief selbst im kältesten Winter bei weit offenem Fenster. Den wahren Grund verschwieg er seiner Mutter, die ihn als Arzt sehen wollte.',
    kurz: 'schläft selbst im tiefsten Winter bei offenem Fenster',
    use: 'Heimliches Training für eine Zukunft, von der niemand weiß, sehen andere nur als seltsame Gewohnheit, etwa das offene Fenster im Winter, und genau das kann später den lange gehegten Plan deines Feldherrn verraten.',
    src: 'Roald Amundsen, My Life as an Explorer (1927, eigene Erinnerungen, rund 40 Jahre später)' }
);

/* Inhalte: Archiv der Eigenheiten (Kapitel VIII) */
(function () {
const KT = window.KT; const L = KT.lessons;
const P = (s) => '<p>' + s + '</p>';
const UL = (a) => '<ul>' + a.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
const ch = KT.chapters[7]; if ((KT.quirks || []).length && !ch.items.includes('marotten')) ch.items.splice(ch.items.indexOf('kommandant') + 1, 0, 'eigenheiten', 'marotten');
KT.quirkCats = ['Körper & Gesten', 'Rituale & Aberglaube', 'Schlaf, Essen & Trinken', 'Kleidung & Aussehen', 'Tiere & Gegenstände', 'Sprache & Humor', 'Führungsstil', 'Ängste, Leiden & Laster', 'Arbeitsweise'];

KT.quirks = KT.quirks || [];
// Lebensdaten aus „Region · Daten · Rolle“: erstes Jahr, v. Chr. negativ
const born = (q) => { const d = String(q.meta || '').split(' · ')[1] || ''; const m = d.match(/(\d{1,4})/); if (!m) return 9999; const n = Number(m[1]); const bc = /v\. ?Chr/.test(d); if (/Jh/.test(d)) return bc ? -(n * 100 - 50) : (n - 1) * 100 + 50; return bc ? -n : n; };
for (const q of KT.quirks) {
  if (q.era === 'Denker & Künstler') { q.grp = 'Denker & Künstler'; const y = born(q); q.era = q.zeit || (y < 600 ? 'Antike' : y >= 1640 && y < 9999 ? 'Nach 1650' : 'Europa 600–1650'); }
  if (!q.grp) q.grp = 'Anführer';
}
KT.quirks.forEach((q, i) => { q._k = KT.quirkEras.indexOf(q.era) * 100000 + born(q) + 5000 + i / 1000; });
KT.quirks.sort((a, b) => a._k - b._k);
KT.quirkAsk = [
  'Welche dieser Eigenheiten ist echt, welche gespielt, und wer in seinem Umfeld weiß es?',
  'Was passiert an dem Tag, an dem er die erste Eigenheit plötzlich nicht zeigt?',
  'Welche Eigenheit lernt sein Gegner zu lesen, und wie nutzt dein Feldherr genau das aus?',
  'Woher stammt die zweite Eigenheit, und wer aus seiner Vergangenheit erinnert ihn daran?',
  'Welche Eigenheit hassen seine Offiziere, und welche lieben seine Soldaten?',
  'Wie verändert sich die dritte Eigenheit, wenn er eine Schlacht verliert?',
  'Welche der drei Eigenheiten würde er sofort ablegen, wenn er könnte?',
];
L.eigenheiten = {
  title: 'Ticks, Rituale, Marotten', nav: 'Eigenheiten schreiben', tag: 'Figur',
  lead: 'Ein Feldherr wird für den Leser nicht dadurch lebendig, dass er klug ist, sondern dadurch, dass er sich mit einem Finger am Kopf kratzt, beim Gewitter in ein Gewölbe flüchtet oder vor jeder wichtigen Entscheidung allein in einem Tempel sitzt. Hier lernst du, wie solche Eigenheiten wirken, warum sie unter Druck stärker werden und wie ein gerissener Kommandant sie als Waffe benutzt. Echte Beispiele mit Quelle findest du danach im <a href="#marotten">Archiv der Eigenheiten</a>.',
  body: [
    { h: 'Fünf Arten von Eigenheit', html: P('Wie viel Kontrolle hat die Figur über ihre Eigenheit? Ein <b>Tick</b> ist eine plötzliche, unwillkürliche Bewegung oder ein Laut, kurz unterdrückbar, aber nicht abstellbar. Eine <b>Gewohnheit</b> läuft automatisch ab, sobald die passende Situation eintritt, auch wenn ihr ursprünglicher Zweck längst verschwunden ist. Ein <b>Ritual</b> ist eine feste Abfolge, deren Sinn symbolisch ist und nicht praktisch. <b>Aberglaube</b> verhandelt mit dem Glück. Und eine <b>Pose</b> wird für ein Publikum gespielt.') + P('Der Leser lernt eine Figur kennen, indem er erkennt, welche Art er vor sich hat: den Körper, der sie verrät, den Autopiloten, die Bedeutung, den Handel mit dem Schicksal oder die Maske. Ein gerissener Feldherr gibt das eine für das andere aus, zum Beispiel einen „Aberglauben“, der in Wahrheit ein Signal an seine Offiziere ist.') },
    { h: 'Suetons Steckbrief', html: P('Die antiken Biografen arbeiteten schon so. Plutarch schreibt zu Beginn seines Alexanderlebens, eine kleine Handlung, ein Ausspruch oder ein Scherz verrate den Charakter oft besser als Schlachten mit Tausenden Toten. Sueton beschreibt Augustus ausdrücklich „nicht nach der Zeit, sondern nach Sachgebieten“: Aussehen, Essen, Schlaf, Ängste, Scherze, Vorzeichen. Augustus fürchtete Blitz und Donner und trug deshalb stets ein Robbenfell bei sich, und er nahm es als schlechtes Zeichen, wenn ihm morgens der linke Schuh an den rechten Fuß gezogen wurde.') + P('Diese Liste ist eine fertige Vorlage für deinen Feldherrn. Und sie zeigt: Auch der kühlste Rechner darf einen privaten Aberglauben haben.') },
    { h: 'Rituale wachsen mit der Gefahr', html: P('Der Ethnologe Bronisław Malinowski beobachtete, dass die Fischer der Trobriand-Inseln für den sicheren Fang in der Lagune keine Magie brauchten, für die gefährliche Fahrt aufs offene Meer aber viel. Im Baseball haben Schlagmänner und Werfer, deren Erfolg unsicher ist, weit mehr Rituale als Feldspieler, die fast immer fangen (George Gmelch, 1971). In Experimenten senkte schon ein kurzes, sinnloses Ritual vor einem Auftritt Puls und Nervosität, aber nur, wenn man es „Ritual“ nannte (Brooks und andere, 2016).') + P('Für deinen Roman heißt das: Die Rituale deines Feldherrn sollten am Vorabend einer Schlacht dichter werden und im Winterlager verblassen. Die Veränderung selbst verrät dem Leser, wie viel Angst er hat. Ob ein Glücksbringer wirklich hilft, ist übrigens umstritten: Ein berühmter Befund dazu ließ sich nicht wiederholen. Lass deine Figuren also glauben, aber beweise nicht, dass es wirkt.') },
    { h: 'Unter Druck zurück zur alten Gewohnheit', html: P('Wer unter Stress steht, fällt von überlegten Entscheidungen auf eingeübte Gewohnheiten zurück, selbst wenn sie nichts mehr bringen (Schwabe und Wolf, 2009). Wer dagegen unter Druck anfängt, eine sicher beherrschte Fertigkeit Schritt für Schritt zu beobachten, verliert sie, wie ein Spieler, der plötzlich über seine Hände nachdenkt (Beilock und Carr, 2001). Und kleine Übersprunghandlungen, Kratzen, Zupfen, Nesteln, nehmen mit der Angst zu.') + P('Daraus folgen drei Werkzeuge: Unter Druck greift deine Figur zu ihren ältesten Gewohnheiten, und ein kluger Gegner studiert genau diese. Ein Veteran, der plötzlich auf seine Hände schaut, patzt. Und eine kleine Geste kann dem Leser als Druckmesser dienen.') },
    { h: 'Verräter und Waffe', html: P('Körpersignale gibt es, aber sie sind schwach, und sie sitzen eher in den Händen als im Gesicht. Beobachter erkannten die Qualität des Blatts von Pokerprofis besser als der Zufall an den Armbewegungen beim Setzen, nicht aber am Gesicht (Slepian und andere, 2013). Lügen erkennen Menschen im Schnitt nur in etwa 54 Prozent der Fälle (Bond und DePaulo, 2006). Der Pokerautor Mike Caro fasst zusammen: Wer schauspielert, spielt meist das Gegenteil seines Blatts.') + P('Auch Gewohnheiten von Heeren sind Signale: Am <a href="#metaurus">Metaurus</a> verriet eine Trompete, die zweimal statt einmal blies, einen zweiten Konsul. Ein gerissener Feldherr pflanzt deshalb ein falsches Signal für einen Gegner, der zu sehr auf Signale vertraut, oder er bricht eine bekannte Gewohnheit genau einmal, an dem Tag, an dem es zählt.') },
    { h: 'Bühne und Hinterzimmer', html: P('Machiavelli: Jeder sieht, was du zu sein scheinst, wenige fühlen, was du bist (Der Fürst, Kapitel 18). Castiglione nannte die einstudierte Lässigkeit, die alle Mühe verbirgt, <i>sprezzatura</i> (Der Hofmann, 1528). Der Soziologe Erving Goffman unterscheidet die Vorderbühne, auf der eine Rolle gespielt wird, von der Hinterbühne, auf der man sie ablegt. Schon Sueton erzählt, wie der junge Caesar seine Tunika mit Fransenärmeln stets locker gegürtet trug und Sulla die Adligen vor dem „schlecht gegürteten Jungen“ warnte.') + P('Ist die Exzentrik deines Feldherrn gespielt, dann zeig mindestens eine Szene auf der Hinterbühne, in der er sie ablegt, und eine Figur, die ihn durchschaut.') },
    { h: 'Vom Tick zum Heeresritual', html: P('Gemeinsame, intensive Rituale binden Gruppen. Teilnehmer und sogar Zuschauer einer schmerzhaften Prozession auf Mauritius spendeten danach mehr für eine gemeinsame Sache (Xygalatas und andere, 2013). Die private Marotte eines Feldherrn kann so zum Ritual seines Heeres werden, wenn die Soldaten sie nachahmen. Dann gehört sie ihnen, und er kann sie nicht mehr einfach ablegen.') },
    { h: 'Keine Karikatur', html: P('E. M. Forster nannte Figuren, die um eine einzige Eigenschaft gebaut sind, „flach“. Eine runde Figur kann auf überzeugende Weise überraschen. Robert McKee unterscheidet die beobachtbaren Merkmale einer Figur von ihrem wahren Charakter, der sich in Entscheidungen unter Druck zeigt.') + UL([
      'Gib jeder Eigenheit eine Ursache: eine Wunde, eine Angst, eine Methode, einen glücklichen Zufall, den die Figur seither wiederholt.',
      'Dosiere sie. Zeige sie, wenn sie zählt, nicht in jeder Szene.',
      'Lass sie sich unter Druck verändern: stärker werden, brechen, abgelegt werden.',
      'Zeige die Reaktionen anderer: Diener planen darum herum, Rivalen nutzen sie aus, Soldaten ahmen sie nach.',
      'Mische die Arten: eine unwillkürliche, eine Gewohnheit, ein gewähltes Ritual.',
      'Lass die Größe neben der Marotte sichtbar bleiben, damit der Mann nicht zu seinem Tick schrumpft.',
    ]) },
  ],
  novel: P('Eine Übung: Zieh im <a href="#marotten">Archiv</a> drei Eigenheiten und schreib eine halbe Seite, in der ein junger Offizier deinen Feldherrn zum ersten Mal trifft. Er bemerkt nur eine der drei. Die zweite erklärt ihm ein Veteran später am Feuer, falsch. Die dritte sieht nur der Leser, ganz am Ende des Kapitels.'),
  extraCards: [
    { title: 'Fünf Fragen an jede Eigenheit', color: 'var(--contour)', items: ['Woher kommt sie?', 'Wer weiß davon, und wer nicht?', 'Was verrät sie über ihn?', 'Wann bricht er sie, und warum?', 'Wie liest sie sein Gegner?'] },
    { title: 'Suetons Steckbrief', color: 'var(--gold)', items: ['Aussehen und Kleidung', 'Essen, Trinken, Schlaf', 'Ängste und Krankheiten', 'Scherze und Lieblingssätze', 'Vorzeichen und Aberglaube', 'Wie er arbeitet und befiehlt'] },
    { title: 'Zum Weiterlesen', color: 'var(--blue)', items: ['Plutarch, Alexander 1; Sueton, Augustus 9 und 90–92.', 'Malinowski, Magic, Science and Religion (1925/1948).', 'Brooks und andere, „Don’t stop believing“ (2016); Norton und Gino (2014) über Rituale.', 'Schwabe und Wolf, „Stress prompts habit behavior in humans“ (2009).', 'Goffman, The Presentation of Self in Everyday Life (1959).', 'E. M. Forster, Aspects of the Novel (1927).'] },
  ],
};
L.marotten = {
  title: 'Archiv der Eigenheiten', nav: 'Archiv der Eigenheiten', tag: 'Archiv', render: 'quirks', after: 'quirks',
  lead: 'Gewohnheiten, Rituale, Ticks und Marotten von Feldherren, Herrschern, Denkern und Künstlern aus mehr als drei Jahrtausenden, jede mit Quelle, Einordnung und einer Idee für deine Figur. Such nach Stichworten, filtere nach Bereich und Epoche, oder lass dir drei Eigenheiten zu einer neuen Figur mischen.',
  archiveSub: 'Jede Karte nennt die Quelle und sagt, wie belastbar sie ist: <b>belegt</b> heißt zeitgenössisch oder von Augenzeugen, <b>überliefert</b> heißt später, aber ernsthaft, <b>Anekdote</b> heißt Legende oder umstritten. Nicht jede Stelle wurde für diesen Kurs im Original nachgeschlagen. Wo „online“ steht, führt ein Link zu einer Seite, die den Eintrag stützt. Wie du daraus eine Figur baust, steht in <a href="#eigenheiten">Ticks, Rituale, Marotten</a>.',
};
if (L.quellen && KT.quirks.length) L.quellen.body.splice(1, 0, { h: 'Quellen für das Archiv der Eigenheiten', html: UL([
  '<b>Sueton</b>, Kaiserviten (um 120 n. Chr.): ordnet seine Kaiser nach Sachgebieten wie Aussehen, Schlaf, Ängste und Aberglaube. Eine Fundgrube für Eigenheiten, aber voller Hofklatsch.',
  '<b>Plutarch</b> und <b>Ailianos</b>: Anekdoten mit Moral. Je später der Autor, desto bunter die Geschichte.',
  '<b>Einhard</b>, Leben Karls des Großen (um 820): ein Vertrauter Karls, der sich bis in die Gliederung an Sueton hielt.',
