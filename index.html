/* ---------------- Morgarten, 1315 ---------------- */
L.morgarten = {
  title: 'Morgarten: Der Hinterhalt am See', nav: 'Morgarten', tag: 'Hinterhalt im Engpass', scene: 'morgarten',
  when: 'Ostufer des Ägerisees, Schweiz · 15. November 1315',
  lead: 'Eine Ritterkolonne zieht an einem Novembermorgen zwischen See und Steilhang nach Süden. Ritter fürchten keine Bauern, so denkt man im Heer des Herzogs. Dann bleibt die Spitze plötzlich stehen.',
  trick: 'Die Schwyzer sperrten die Spitze der langen habsburgischen Kolonne, warfen von oben Steine, damit die Pferde scheuten, und griffen dann mit Hellebarden die Flanke an. Die hinteren Teile der Kolonne kamen nicht nach vorn, die vorderen konnten nicht ausweichen: links der Hang, rechts See und Sumpf.',
  facts: [
    ['Datum', '15. November 1315'],
    ['Ort', 'Ostufer des Ägerisees unterhalb von Morgarten, Grenze Zug/Schwyz, Schweiz (genaue Stelle umstritten)'],
    ['Gegner', 'Herzog Leopold I. von Österreich gegen die Schwyzer mit 600 Mann aus Uri und Unterwalden; ihr Anführer ist unbekannt'],
    ['Stärken', 'Habsburger „einige Tausend“ (Historisches Lexikon der Schweiz), nach Delbrück 2000–3000; Johannes von Winterthur nennt übertriebene 20 000. Eidgenossen etwa 1000 oder etwas mehr'],
    ['Ausgang', 'Habsburgische Niederlage; Winterthur nennt 1500 Tote ohne die Ertrunkenen, Peter von Zittau „fast 2000“, moderne Schätzungen einige Hundert; nur wenige tote Schwyzer'],
  ],
  saw: 'Leopold sah einen Strafzug gegen widerspenstige Bauern. Der Weg am See war eng, aber kurz, und welcher Bauer stellt sich schon gepanzerten Reitern in den Weg?',
  was: 'Die Schwyzer hatten genau diese Stelle gewählt. Auf fast zwei Kilometern Länge konnte die Kolonne weder umkehren noch sich entfalten. Die Ritter an der Spitze kämpften allein, und ihre scheuenden Pferde wurden zur Gefahr für die eigenen Leute.',
  body: [
    { h: 'Ritter im Engpass', html: P('Die Stärke eines Ritterheeres ist der Ansturm auf freiem Feld: Wucht, Tempo, Panzerung. Auf einem schmalen Weg zwischen See und Sumpf auf der einen und einem Steilhang auf der anderen Seite bleibt davon nichts. Die Kolonne zog sich über fast zwei Kilometer, die Ritter vorn, das Fußvolk hinten. Als die Spitze auf die Sperre traf, stauten sich die Nachfolgenden, und niemand konnte nach vorn oder zur Seite.') + P('Dann flogen von oben Steine, faustgroß, nicht die Felsbrocken späterer Bilder, aber genug, um Pferde scheuen zu lassen. Ein scheuendes Pferd in einer engen Kolonne ist eine Gefahr für alle um es herum. In dieses Durcheinander stürmten die Schwyzer mit Hellebarden hinein und drängten Ritter und Fußvolk in See und Sumpf.') },
    { h: 'Die Hellebarde', html: P('Johannes von Winterthur erwähnt bei Morgarten zum ersten Mal schriftlich die Hellebarde, bei ihm „helnbarten“: eine Stangenwaffe mit Beil, Spitze und Haken. Mit dem Haken ließ sich ein Reiter vom Pferd ziehen, mit dem Beil schlug man durch Helm und Rüstung. Sie wurde zum Kennzeichen der Eidgenossen.') },
    { h: 'Wie Legenden wachsen', html: P('Um Morgarten ranken sich Geschichten, die erst später entstanden. Ein Adliger aus Hünenberg soll den Schwyzern einen Pfeil mit einer Warnung geschickt haben (Justinger, um 1420). Der Hofnarr Kuony soll gespottet haben, alle redeten davon, wie man ins Land hineinkomme, aber keiner, wie man wieder herauskomme. Beides gilt als Legende. Selbst der Ort ist umstritten: Zug beansprucht das Buechwäldli, Schwyz die Schornen. Forscher fanden keine Stelle, an der das alte Ufer nahe an einem steilen Hang lag.') },
  ],
  novel: P('Johannes von Winterthur sah als Schuljunge, wie Herzog Leopold heimkehrte, nach seinen Worten vor übergroßem Kummer „halb tot“. Erzähle die Niederlage einmal aus Kinderaugen: kein Schlachtgetümmel, nur ein geschlagener Mann, der durchs Tor reitet. Und nutze die Legenden als Werkzeug. Ein Warnpfeil oder ein spottender Narr sind perfekte Vorzeichen: Dein Leser erkennt das Muster, dein Herzog übergeht es.'),
  reli: 'Johannes von Winterthur schrieb 1340–48 und formte seinen Bericht nach dem Vorbild alttestamentlicher Schlachten. Der genaue Ort ist umstritten. Die Quellen sprechen von faustgroßen Steinen; Felsbrocken und Baumstämme stammen aus späteren Bildern.',
  extraCards: CARDS(
    ['Der Ort machte die Stärke der Ritter wertlos.', 'Sperre an der Spitze, Angriff in die Flanke, kein Weg zurück.', 'Scheuende Pferde rissen die Ordnung von innen auf.'],
    ['Späher auf dem Hang hätten den Hinterhalt entdeckt.', 'Mit dem Fußvolk an der Spitze hätte die Kolonne die Sperre selbst angreifen können.'],
    ['Ein enger Weg, über dessen Hängen niemand wacht.', 'Ein Gegner, der sich bis zuletzt nirgends zeigt.'],
    ['See und Sumpf auf der einen, Steilhang auf der anderen Seite.', 'Novemberkälte: Wer in Rüstung ins Wasser gedrängt wird, kommt kaum heraus.']
  ),
  sources: [['Schlacht am Morgarten (Wikipedia)', 'https://de.wikipedia.org/wiki/Schlacht_am_Morgarten'], ['Morgarten (Historisches Lexikon der Schweiz)', 'https://hls-dhs-dss.ch/de/articles/008726/2015-12-02/']],
};

/* ---------------- Azincourt, 1415 ---------------- */
L.azincourt = {
  title: 'Azincourt: Der Trichter aus Schlamm', nav: 'Azincourt', tag: 'Gelände als Waffe', scene: 'azincourt',
  when: 'Azincourt, Pas-de-Calais, Frankreich · 25. Oktober 1415',
  lead: 'Ein kleines englisches Heer steht einem deutlich größeren französischen gegenüber. Es gewinnt, weil sein König das Gelände arbeiten lässt und dann einen Schritt nach vorn macht.',
  trick: 'Als die Franzosen nicht angriffen, rückte Heinrich V. bis an den Rand der Bogenreichweite vor, etwa 270 Meter, ließ die Pfähle neu einschlagen und schießen. Nun mussten die Franzosen angreifen, über frisch gepflügten, nassen Acker und durch einen Trichter, den zwei Wälder bildeten.',
  facts: [
    ['Datum', '25. Oktober 1415'],
    ['Ort', 'Zwischen den Wäldern von Azincourt und Tramecourt, Pas-de-Calais, Frankreich'],
    ['Gegner', 'Heinrich V. gegen Konnetabel Charles d’Albret und Marschall Boucicaut'],
    ['Stärken', 'Umstritten: etwa 6000 Engländer (davon 5000 Bogenschützen) gegen 14 000–15 000 Franzosen (Barker, Sumption, Rogers) oder 8500–9000 gegen etwa 12 000 (Anne Curry)'],
    ['Ausgang', 'Etwa 6000 tote Franzosen, 700–2200 Gefangene; englische Verluste bis 600 (Monstrelet), 112 namentlich bekannt, darunter der Herzog von York und der Graf von Suffolk'],
  ],
  saw: 'Die französischen Anführer sahen ein kleines Heer, das sich nicht rühren konnte. Wer zuerst angreift, verliert, also warteten sie. Dann kamen die Engländer von selbst näher, und ihre Pfeile reichten plötzlich bis in die eigenen Reihen.',
  was: 'Heinrich wollte genau diesen Angriff erzwingen. Jeder französische Vorstoß lief durch Schlamm und wurde von den Wäldern zusammengedrückt, bis die Männer so dicht standen, dass sie kaum noch kämpfen konnten.',
  body: [
    { h: 'Ein Schritt nach vorn', html: P('Am Morgen standen beide Heere stundenlang still. Wer auf diesem Boden zuerst angriff, war im Nachteil, und die Franzosen hatten Zeit. Heinrich V. löste das Patt mit einem Wagnis: Er ließ seine Linie vorrücken, bis an den Rand der Bogenreichweite, etwa 270 Meter vor den Feind. Dort wurden die angespitzten Pfähle neu eingeschlagen, und die Bogenschützen begannen zu schießen.') + P('Damit war Warten für die Franzosen unmöglich geworden. Der Verteidiger wurde für einen Moment zum Angreifer, um selbst angegriffen zu werden, und stand gleich darauf wieder in seiner Verteidigung.') },
    { h: 'Der Trichter', html: P('Das Feld lag zwischen zwei Wäldern, die englische Front war nur etwa 690 Meter breit. Der Acker war frisch gepflügt und vom Regen durchweicht. Die französischen Reiter, die die Bogenschützen an den Flanken überreiten sollten, liefen in die Pfähle, und ihre Pferde rasten zurück, mitten in das eigene vorrückende Fußvolk.') + P('Die abgesessenen Ritter wateten in 23 bis 27 Kilo schwerer Rüstung durch den Schlamm, nach dem Mönch von Saint-Denis „bis zu den Knien“. Von den Flanken kamen Pfeile, also drängten alle zur Mitte. Vor den englischen Waffenknechten standen die Männer bald so dicht, dass viele ihre Waffen nicht mehr heben konnten. Nun griffen auch die Bogenschützen mit Hämmern und Beilen ein.') },
    { h: 'Der Befehl', html: P('Gegen Ende überfiel Ysambart d’Azincourt den englischen Tross. Heinrich fürchtete offenbar einen neuen Angriff und befahl, die Gefangenen zu töten. Wie viele tatsächlich starben, ist umstritten; John Keegan meint, es seien wenige gewesen. Für einen Roman ist dieser Moment ein Abgrund: eine kalte Rechnung unter Unsicherheit.') },
  ],
  novel: P('Erzähle die Schlacht einmal aus dem Inneren des Gedränges: keine Luft, kein Platz, das Gewicht der eigenen Rüstung, ein Boden, der die Füße festhält. Die größte Gefahr ist hier nicht der Feind, sondern der Nebenmann. Und gib deinem Kommandanten Heinrichs scheinbar unvernünftigen Schritt nach vorn. Seine Offiziere halten ihn für Leichtsinn, bis sich die französischen Reihen in Bewegung setzen.'),
  reli: 'Fast alles ist umstritten: die Heeresgrößen (Anne Curry gegen Barker, Sumption und Rogers), der genaue Ort und die Zahl der getöteten Gefangenen. Auch in welche Richtung die Heere blickten, ist nicht sicher belegt; die Animation folgt der üblichen Rekonstruktion.',
  extraCards: CARDS(
    ['Der Vorstoß zwang den Gegner zum Angriff auf ungünstigem Boden.', 'Die Wälder schützten die Flanken und pressten die Franzosen zusammen.', 'Pfähle stoppten die Reiter, Pfeile trafen aus den Flanken.'],
    ['Ein schneller Reiterangriff, solange die Engländer vorrückten und die Pfähle noch nicht standen.', 'Wären die Franzosen einfach außer Reichweite zurückgewichen, hätte Heinrich erneut vorrücken müssen.'],
    ['Ein Gegner, der freiwillig näher kommt, will angegriffen werden.', 'Nasser, frisch gepflügter Boden zwischen den Heeren.', 'Ein Feld, das zum Feind hin enger wird.'],
    ['Zwei Wälder: Flankenschutz und Trichter zugleich.', 'Regen über Nacht verwandelte den Acker in Schlamm.', 'Eröffnung auf etwa 270 m, am Rand der Bogenreichweite.']

  sources: [['Battle of Agincourt (Wikipedia)', 'https://en.wikipedia.org/wiki/Battle_of_Agincourt'], ['The truth about Agincourt (University of Southampton)', 'https://cdn.southampton.ac.uk/news/2016/05/the-truth-about-agincourt.page'], ['English longbow (Wikipedia)', 'https://en.wikipedia.org/wiki/English_longbow']],
};

/* Inhalte: Kapitel VII (Täuschung) und VIII (Der exzentrische Kommandant) */
(function () {
const KT = window.KT; const L = KT.lessons;
const P = (s) => '<p>' + s + '</p>';
const UL = (a) => '<ul>' + a.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
const A = (txt, href) => '<a href="' + href + '" target="_blank" rel="noopener">' + txt + '</a>';
KT.chapters[6].items = ['taeuschung', 'kabinett'];

/* ================= VII. DIE KUNST DER TÄUSCHUNG ================= */
KT.deception = [
  { name: 'Konditionierung', tag: 'Gewöhnung', text: 'Man zeigt dem Gegner so lange dasselbe, bis er aufhört hinzusehen. Was sich wiederholt, wird Hintergrund. Erst dann kommt die Abweichung, und sie fällt niemandem mehr auf.', ex: 'Am <a href="#hydaspes">Hydaspes</a> 326 v. Chr. ließ Alexander Nacht für Nacht Lärm am Ufer machen, bis Poros nicht mehr reagierte. Bei <a href="#ilipa">Ilipa</a> 206 v. Chr. stellte Scipio sein Heer tagelang gleich auf und vertauschte am entscheidenden Morgen Mitte und Flügel.' },
  { name: 'Scheinschwäche', tag: 'Schwach wirken', text: 'Wer stark ist, zeigt sich schwach und lädt den Gegner zum Leichtsinn ein. Sunzi: „Wenn wir angreifen können, müssen wir unfähig scheinen.“ Die Schwäche muss zur Erwartung des Gegners passen, dann prüft er sie nicht.', ex: 'Bei <a href="#maling">Maling</a> 342 v. Chr. ließ Sun Bin jeden Abend weniger Kochstellen anlegen: Herde für 100 000, dann für 50 000, dann für 30 000 Mann. Bei <a href="#jingxing">Jingxing</a> 205 v. Chr. stellte Han Xin 10 000 Mann mit dem Rücken zum Fluss auf, und der Gegner lachte.' },
  { name: 'Scheinstärke', tag: 'Stark wirken', text: 'Wer schwach ist, zeigt sich stark: mehr Feuer, mehr Lärm, mehr Fahnen, mehr Staub. Der Gegner zögert, weicht aus oder flieht vor einem Heer, das es nicht gibt. In den 36 Strategemen heißt das „den Baum zum Blühen bringen“.', ex: 'Bei Yashima 1185 ließ Minamoto no Yoshitsune mit rund 150 Mann Feuer legen, die ein großes Heer vortäuschten (<a href="#kabinett">Kabinett der Listen</a>). Nach der Geheimen Geschichte der Mongolen sollen 1204 gegen die Naimanen alle Krieger je fünf Feuer entzündet haben (nicht sicher belegt).' },
  { name: 'Scheinflucht', tag: 'Weichen, um zu schlagen', text: 'Ein Teil des Heeres flieht scheinbar in Panik. Der Gegner verfolgt, verlässt seine Stellung und gerät in Unordnung. Dann wenden die Fliehenden. Nur eingespielte Truppen können eine Flucht spielen, ohne wirklich zu fliehen.', ex: 'Bei <a href="#hastings">Hastings</a> 1066 nach einer echten Flucht der Bretonen noch zweimal mit Absicht. An der Kalka 1223 wichen die Mongolen neun Tage lang zurück. Mehr dazu in der Lektion <a href="#flucht">Vorgetäuschte Flucht</a>.' },
  { name: 'Falsche Überläufer', tag: 'Lügen mit Gesicht', text: 'Ein Mensch bringt die Lüge persönlich: ein Überläufer, ein Sklave, ein Bote, ein Brief. Am glaubwürdigsten ist er, wenn er genau das sagt, was der Gegner hören will, und wenn ein Teil davon stimmt.', ex: 'Bei <a href="#kadesch">Kadesch</a> um 1274 v. Chr. erzählten zwei Beduinen Ramses II., die Hethiter stünden weit im Norden. Vor <a href="#salamis">Salamis</a> 480 v. Chr. schickte Themistokles seinen Sklaven Sikinnos zu Xerxes. An der <a href="#rote-klippe">Roten Klippe</a> 208 kündigte Huang Gai brieflich seine Kapitulation an.' },
  { name: 'Doppelgänger und Masken', tag: 'Wer ist wo?', text: 'Wo der Feldherr ist, dort vermutet der Gegner den Schwerpunkt. Ein Doppelgänger, eine fremde Rüstung oder ein vertauschter Mantel verschieben diesen Punkt im Kopf des Gegners.', ex: 'Am <a href="#hydaspes">Hydaspes</a> stand laut Curtius ein Mann namens Attalos in Alexanders Königsrobe im Lager, während der echte Alexander flussaufwärts zog. Hannibal trug Perücken und wechselnde Kleider, um Attentätern zu entgehen (Livius 22.1).' },
  { name: 'Ablenkung', tag: 'Lärm im Osten, Schlag im Westen', text: 'Ein Scheinangriff, eine Scheinbewegung oder echter Druck an einer Stelle bindet Blick und Reserven des Gegners. Der eigentliche Schlag kommt dort, wo nun niemand mehr steht.', ex: 'Bei Neukarthago 209 v. Chr. stürmten die Römer Tor und Seemauer, während 500 Mann durch die Lagune wateten (<a href="#wasser">Sumpf und Gezeiten</a>). Bei <a href="#mohi">Mohi</a> 1241 band Batu die Ungarn an der Brücke, während zwei andere Heeresteile nördlich und südlich über den Fluss gingen.' },
  { name: 'Verbergen', tag: 'Was man nicht sieht', text: 'Truppen hinter einem Kamm, in einem Wald, in einer Senke, unter Tüchern. Verbergen ist die älteste Täuschung und die Grundlage jedes Hinterhalts. Das Gelände lügt nicht, es schweigt nur.', ex: 'Bei <a href="#dara">Dara</a> 530 warteten 300 Heruler hinter einem Hügel. Bei <a href="#carrhae">Carrhae</a> 53 v. Chr. verhüllten die Parther ihre Panzer mit Gewändern und Fellen, bis die Pauken dröhnten.' },
  { name: 'Falsche Zeichen', tag: 'Banner, Signale, Trompeten', text: 'Heere verständigen sich mit Zeichen, und Zeichen lassen sich fälschen. Wer Banner, Signale oder Feuer nachahmt, steuert die Deutung des Gegners. Umgekehrt verraten echte Zeichen oft genau das, was man verbergen will.', ex: 'Bei <a href="#jingxing">Jingxing</a> pflanzten 2000 Reiter rote Fahnen auf das leere Lager der Zhao. Bei Evesham 1265 trug Prinz Edward erbeutete Banner an der Spitze seines Heeres. Am <a href="#metaurus">Metaurus</a> 207 v. Chr. verriet ein doppeltes Trompetensignal, dass ein zweiter Konsul angekommen war.' },
  { name: 'Natur als Komplize', tag: 'Gezeiten, Wind, Nebel, Nacht', text: 'Kein Feldherr macht das Wetter, aber wer es vorhersieht, kann es einplanen. Gezeiten verstecken Pfähle, Wind trägt Feuer und Staub, Nebel und Nacht nehmen dem Gegner die Augen.', ex: 'Am <a href="#bachdang">Bạch Đằng</a> 938 verbarg die Flut die Pfähle im Flussbett. An der <a href="#rote-klippe">Roten Klippe</a> trieb der Südostwind die Brander in die Flotte. Am Trasimenischen See 217 v. Chr. marschierten die Römer in einen Morgennebel, der unten dichter lag als oben am Hang.' },
  { name: 'Gerücht und Panik', tag: 'Ein Satz, der Heere bricht', text: 'Ein Heer glaubt, was es hört, wenn es nichts sieht. Ein einziger Ruf im richtigen Moment, „Wir sind geschlagen!“ oder „Der König ist tot!“, kann eine Armee umwerfen, die eben noch stand.', ex: 'Am <a href="#fei">Fei-Fluss</a> 383 rief ein Gefangener in den hinteren Reihen der Qin: „Die Qin sind geschlagen!“ Bei Manzikert 1071 verkündete der Befehlshaber der byzantinischen Reserve den Tod des Kaisers und zog mit seinen Männern ab.' },
  { name: 'Scheinverhandlung', tag: 'Das Messer im Lächeln', text: 'Gespräche, Waffenstillstände und höfliche Bitten senken die Wachsamkeit. Sunzi: „Friedensangebote ohne beschworenen Vertrag deuten auf ein Komplott.“ Manchmal reicht schon eine scheinbar harmlose Bitte.', ex: 'Bei Tarain 1192 täuschte Muhammad von Ghur einen Waffenstillstand vor und griff vor Sonnenaufgang an. Am <a href="#fei">Fei-Fluss</a> baten die Jin die Qin, ein Stück zurückzuweichen, damit man in Ruhe kämpfen könne. Der Rückzug wurde zur Flucht.' },
  { name: 'Der Köder', tag: 'Etwas, das man haben will', text: 'Beute, ein leichtes Ziel, eine bedrohte Stadt, eine fliehende Flotte: Der Gegner soll etwas wollen und dafür seine Stellung verlassen. Sunzi: „Lege Köder aus, um den Feind zu verlocken. Täusche Unordnung vor und zerschmettere ihn.“', ex: 'Vor <a href="#hattin">Hattin</a> 1187 griff Saladin Tiberias an, um das Heer der Kreuzfahrer von seinem Wasser wegzulocken. Am <a href="#bachdang">Bạch Đằng</a> lockten kleine Boote die feindliche Flotte über die versteckten Pfähle.' },
  { name: 'Tiere und Attrappen', tag: 'Rinder, Puppen, Kamele', text: 'Tiere tragen Licht, Lärm und Schrecken, Puppen füllen leere Reihen. Sie sind billig, entbehrlich und auf Entfernung kaum vom Echten zu unterscheiden.', ex: 'Am <a href="#falernus">Ager Falernus</a> 217 v. Chr. trieb Hannibal rund 2000 Rinder mit brennenden Reisigbündeln an den Hörnern auf die Höhen. Bei Chihaya 1333 stellte Kusunoki Masashige laut dem Taiheiki Strohpuppen in Rüstung vor die Mauer.' },
];
L.taeuschung = {
  title: 'Die Grammatik der Täuschung', nav: 'Arten der Täuschung', tag: 'Täuschung', render: 'taxonomy',
  lead: 'Jede Kriegslist der Geschichte setzt sich aus einer Handvoll Grundbausteine zusammen. Wer sie kennt, erkennt sie in jedem Feldzug wieder und kann sie für seinen eigenen Feldherrn neu kombinieren. Hier sind vierzehn davon, jeweils mit Beispielen aus dem Kurs.',
  body: [
    { h: 'Was alle Täuschungen gemeinsam haben', html: P('Eine List wirkt selten, weil die Lüge so gut ist. Sie wirkt, weil sie bestätigt, was der Getäuschte ohnehin glauben will. Pang Juan wollte glauben, dass die Männer aus Qi Feiglinge sind, also zählte er Herdfeuer und fand den Beweis. Crassus wollte glauben, dass den Parthern bald die Pfeile ausgehen, und hielt aus, bis es zu spät war.') + P('Jede gelungene Täuschung hat deshalb drei Zutaten: eine Erwartung des Gegners, ein Zeichen, das sie bestätigt, und einen Moment, in dem es zu spät ist, das Zeichen zu prüfen.') },
    { h: 'Die Klassiker sagen es so', html: UL([
      '„Alle Kriegführung beruht auf Täuschung. Wenn wir angreifen können, müssen wir unfähig scheinen; wenn wir unsere Kräfte einsetzen, untätig; wenn wir nah sind, muss der Feind uns fern glauben, und wenn wir fern sind, nah.“ <small>Sunzi I.18–19, nach der englischen Übersetzung von Lionel Giles</small>',
      '„Krieg ist wie die Jagd. Wild fängt man durch Auskundschaften, mit Netzen, durch Auflauern, Anpirschen, Einkreisen und andere solche Listen, nicht durch bloße Gewalt.“ <small>Strategikon des Maurikios, Vorrede zu Buch VII, nach Dennis</small>',
      '„Die besten Pläne sind die, die du ausführst, bevor der Feind von ihnen weiß.“ <small>Vegetius 3.26, nach Milner</small>',
      '„Überraschungen erschrecken den Feind, Vertrautes erzeugt Verachtung.“ <small>Vegetius 3.26, nach Milner</small>',
    ]) },
    { h: 'Die Gegenprobe', html: P('Auch Täuschungen lassen sich durchschauen. Hasdrubal sah am Metaurus abgewetzte Schilde und magere Pferde und hörte im großen römischen Lager das Signal zweimal statt einmal. Er schloss daraus richtig, dass ein zweiter Konsul angekommen war (<a href="#metaurus">Metaurus</a>). Bei Kadesch fingen ägyptische Wachen zwei hethitische Späher, und die Wahrheit kam heraus, nur eben zu spät (<a href="#kadesch">Kadesch</a>).') + P('Die besten Listen überstehen deshalb eine Prüfung. Die Herdfeuer bei Maling waren echte Herdfeuer, die Rinder am Falernus trugen echte Fackeln. Nichts davon war gelogen, nur die Deutung war falsch.') },
  ],
  novel: P('Jede Zeile dieser Liste ist ein Bauplan für eine Szene. Frag für deinen Feldherrn: Welche Erwartung hat sein Gegner? Welches Zeichen liefert er ihm? Und wann ist es zu spät, nachzuprüfen? Erzählst du dann aus der Sicht des Getäuschten, täuschst du den Leser gleich mit, ohne ihn je zu belügen. Fair bleibt es, solange das Zeichen echt ist: Die Lüge steckt in der Deutung, nicht im Text.'),
  extraCards: [
    { title: 'Drei Fragen an jede List', color: 'var(--contour)', items: ['Was will der Gegner glauben?', 'Welches Zeichen bestätigt es ihm?', 'Wann ist es zu spät, das Zeichen zu prüfen?'] },
    { title: 'Warnsignale für den Getäuschten', color: 'var(--blue)', items: ['Es läuft zu gut.', 'Der Gegner tut genau das, was man von ihm erwartet hat.', 'Ein Überläufer bringt genau die Nachricht, die man hören wollte.', 'Ein Feind, der sich lange gleich verhält, ändert sich irgendwann.'] },
  ],

KT.cabinet = [
  { meta: 'Skythien · um 513 v. Chr.', title: 'Vogel, Maus, Frosch und fünf Pfeile', text: 'Die Skythen stellten sich dem Perserkönig Dareios nie zur Schlacht. Sie blieben ihm immer einen Tag voraus, schütteten Brunnen zu und vernichteten die Weiden. Dann schickten sie einen Herold mit einem Vogel, einer Maus, einem Frosch und fünf Pfeilen. Dareios las darin Unterwerfung, sein Berater Gobryas eine Drohung: Wenn ihr nicht wie Vögel fliegt, wie Mäuse in die Erde kriecht oder wie Frösche in die Seen springt, treffen euch diese Pfeile.', use: '<b>Für den Roman:</b> Ein Rätselgeschenk statt einer Botschaft. Und ein Abgang mit Stil: Dareios schlich nachts davon und ließ Kranke, brennende Lagerfeuer und schreiende Esel zurück, damit niemand den Abzug bemerkte.', rel: '<b>Quelle:</b> Herodot 4.120–142, nicht online nachgeprüft. Herodot erzählt gern, die Einzelheiten sind unsicher.' },
  { meta: 'Arkadien · 362 v. Chr.', title: 'Das Scheinlager', text: 'Epaminondas marschierte nicht auf den Feind zu, sondern schwenkte zu den Bergen im Westen ab. Dort ließ er die Waffen ablegen, so dass er wirkte wie einer, der ein Lager aufschlägt. Die Gegner entspannten sich, verließen ihre Reihen und zäumten die Pferde ab. Da griff er sofort an, die tiefe Kolonne voran wie eine Triere mit dem Rammsporn.', use: '<b>Für den Roman:</b> Der gefährlichste Moment ist der, in dem der Gegner glaubt, für heute sei alles vorbei. Epaminondas fiel in dieser Schlacht. Mit dem Speer in der Brust soll er gesagt haben: „Ich habe lange genug gelebt, denn ich sterbe unbesiegt.“', rel: '<b>Quelle:</b> Xenophon, Hellenika 7.5.21–27, ein Zeitgenosse. Die letzten Worte nach Nepos.' },
  { meta: 'Nordchina · 353 v. Chr.', title: 'Wei belagern, um Zhao zu retten', text: 'Wei belagerte Handan, die Hauptstadt von Zhao. Qi schickte sein Heer nicht dorthin, sondern bedrohte Daliang, die unverteidigte Hauptstadt von Wei. Sima Qian nennt das „ins Leere schlagen“. Wei brach die Belagerung ab, eilte heim und lief bei Guiling in einen Hinterhalt. Den Plan hatte Sun Bin entworfen, derselbe Mann wie elf Jahre später bei <a href="#maling">Maling</a>.', use: '<b>Für den Roman:</b> Greif nicht dort an, wo der Gegner stark ist, sondern dort, wo er hinmuss. Unter den 36 Strategemen trägt genau diese Idee den Namen „Wei belagern, um Zhao zu retten“.', rel: '<b>Quelle:</b> Shiji 65. Bambustexte aus Yinqueshan lassen Pang Juan schon hier gefangen nehmen, was dem Bericht über Maling widerspricht.' },
  { meta: 'Shanxi, China · 260 v. Chr.', title: 'Das Gerücht, das einen General absetzte', text: 'Der alte Feldherr Lian Po hielt das Heer von Zhao hinter Mauern, und Qin kam nicht voran. Da streuten Agenten aus Qin, man fürchte nur einen: den jungen Zhao Kuo. Zhao setzte prompt Lian Po ab. Auf der anderen Seite übernahm der gefürchtete Bai Qi heimlich das Kommando, auf Verrat stand der Tod. Qin wich scheinbar zurück, lockte Zhao Kuo vor seine Mauern und schnitt ihn von seinen Lagern ab. Nach 46 Tagen ohne Nahrung ergab sich das Heer.', use: '<b>Für den Roman:</b> Die feinste Täuschung zielt nicht auf ein Heer, sondern auf eine Personalentscheidung des Gegners. Und auf die eigene Seite: Niemand durfte wissen, wer wirklich befahl.', rel: '<b>Quelle:</b> Shiji 73 und 81, etwa 150 Jahre später geschrieben. Die 400 000 getöteten Gefangenen sind eine rhetorische Zahl.' },
  { meta: 'Norditalien · Dezember 218 v. Chr.', title: 'Frühstück am Feuer', text: 'In der Nacht versteckte Hannibals Bruder Mago 1000 Fußsoldaten und 1000 Reiter in einem von Dornen überwucherten Bachbett. Im Morgengrauen reizten numidische Reiter die Römer, die ohne Frühstück ausrückten und durch den eisigen Fluss wateten. Die Karthager aßen derweil, salbten sich und legten an den Feuern die Rüstung an. Als die Schlacht stand, fiel Mago den Römern in den Rücken.', use: '<b>Für den Roman:</b> Hunger, Kälte und Müdigkeit sind Waffen, die man planen kann. Polybios zeigt den Kontrast in zwei Bildern: die Karthager salbend und rüstend an den Feuern, die Römer brusttief im Wasser.', rel: '<b>Quelle:</b> Polybios 3.71–74 gilt als zuverlässiger als Livius 21.54–56. Die genaue Stelle ist umstritten.' },
  { meta: 'Gallien und Etrurien · 218/217 v. Chr.', title: 'Perücken und ein verlorenes Auge', text: 'Im Winterlager bei den Galliern fürchtete Hannibal Mordanschläge seiner eigenen Verbündeten. Er wechselte deshalb ständig die Kleidung und trug falsches Haar, laut Polybios Perücken für verschiedene Lebensalter. Im Frühjahr zog sein Heer vier Tage und drei Nächte ohne Schlaf durch die überfluteten Sümpfe am Arno. Hannibal ritt auf dem letzten überlebenden Elefanten und verlor das Augenlicht auf einer Seite.', use: '<b>Für den Roman:</b> Ein Feldherr, der sich selbst verkleidet, misstraut auch den Seinen. Und eine Verletzung mit Geschichte prägt eine Figur stärker als jede Beschreibung ihres Gesichts.', rel: '<b>Quelle:</b> Livius 22.1–2; Polybios 3.78–79 (nicht im Original geprüft); Nepos, Hannibal 4.' },
  { meta: 'Shaanxi, China · 206 v. Chr.', title: 'Brücken verbrennen, alten Weg nehmen', text: 'Liu Bang zog sich ins abgelegene Hanzhong zurück und ließ hinter sich die an Felswände gehängten Bohlenwege verbrennen, als Zeichen, dass er nie zurückkehren wolle. Monate später kam er über einen alten Weg weiter im Westen zurück und überraschte bei Chencang seinen Gegner Zhang Han. Den Plan soll Han Xin entworfen haben.', use: '<b>Für den Roman:</b> Ein Lehrstück, wie Geschichte zur Legende wächst. Die berühmte Fassung, in der Soldaten die Bohlenwege demonstrativ reparieren, während das Heer heimlich den alten Weg nimmt, steht nicht bei Sima Qian. Sie stammt aus einem Theaterstück der Yuan-Zeit, mehr als tausend Jahre später.', rel: '<b>Quelle:</b> Shiji 8 und 55; die Reparatur-Finte aus einem anonymen Drama der Yuan-Zeit. Bei den 36 Strategemen heißt sie „heimlich bei Chencang übersetzen“.' },
  { meta: 'Shandong, China · 204 v. Chr.', title: 'Der Sandsackdamm', text: 'Über Nacht ließ Han Xin den Fluss oberhalb mit Sandsäcken aufstauen. Dann watete er mit der Hälfte seines Heeres hinüber, griff an und floh scheinbar zurück. Der feindliche General Long Ju setzte ihm ins Flussbett nach. In diesem Moment wurde der Damm geöffnet, die Flut riss sein Heer entzwei, und die Vorhut wurde vernichtet.', use: '<b>Für den Roman:</b> Long Ju soll gespottet haben: „Ich kenne Han Xin mein Leben lang, mit dem wird man leicht fertig.“ Hochmut ist das Schmiermittel jeder List.', rel: '<b>Quelle:</b> Shiji 92 ist die einzige Quelle. Die Zahl der Säcke ist unsicher, und der Trick funktioniert nur bei niedrigem Winterwasser.' },
  { meta: 'Hispanien · um 80–73 v. Chr.', title: 'Die weiße Hirschkuh', text: 'Der römische Rebell Sertorius führte in Spanien ein schneeweißes Hirschkalb mit sich, angeblich ein Geschenk der Göttin Diana, das ihm Verborgenes verrate. Kamen Boten mit Nachrichten, versteckte er sie und führte die bekränzte Hirschkuh vor, als habe sie es ihm gesagt. Seinen ungeduldigen Kriegern zeigte er, wie ein schwacher Mann einem kräftigen Pferd den Schweif Haar für Haar auszupft, während ein starker Mann am Schweif eines klapprigen Pferdes vergeblich zerrt. Ausdauer, so die Lehre, sei wirksamer als Gewalt.', use: '<b>Für den Roman:</b> Aberglaube als Führungsmittel, Gleichnisse statt Befehle. Gegen die Höhlen der Characitaner ließ er lockeren Staub aufhäufen, den der Nordwind in die Eingänge trieb. Am dritten Tag ergaben sie sich.', rel: '<b>Quelle:</b> Plutarch, Sertorius 11, 16 und 17. Anekdoten mit Moral; wo die Höhlen lagen, ist unbekannt.' },
  { meta: 'Kampanien und Bruttium · 73–71 v. Chr.', title: 'Leitern aus wilden Reben', text: 'Auf einem Berg mit nur einem Aufstieg schienen die Aufständischen gefangen. Sie flochten aus wilden Reben Leitern und stiegen die Felswand hinab, einer blieb oben und ließ die Waffen nach. Dann umgingen sie das römische Lager und überfielen es. Später ließ Crassus einen Graben „von Meer zu Meer“ ziehen. In einer Schneenacht füllte Spartacus ein Stück mit Erde, Holz und Ästen und brachte ein Drittel seines Heeres hinüber.', use: '<b>Für den Roman:</b> Ein Anführer, der Material sieht, wo andere Hindernisse sehen. Und das Wetter, das den Wachen die Sicht nimmt, ist sein bester Verbündeter.', rel: '<b>Quelle:</b> Plutarch, Crassus 9–10; erst Florus 2.8 nennt den Vesuv. Die Grabenlänge von rund 55 Kilometern ist vielleicht übertrieben.' },
  { meta: 'Burgund · 52 v. Chr.', title: 'Belagerer und Belagerte zugleich', text: 'Caesar schloss Vercingetorix in Alesia ein und baute zwei Ringe: rund 16 Kilometer Werke nach innen und rund 21 Kilometer nach außen, gegen das gallische Entsatzheer. Davor lagen Gräben, einer davon geflutet, und Gürtel aus Fallen: angespitzte Äste, verdeckte Pfahlgruben in schrägen Reihen und Holzklötze mit Eisenhaken. Als das Entsatzheer an der schwächsten Stelle angriff, ritt Caesars Reiterei außen um die Werke herum in seinen Rücken.', use: '<b>Für den Roman:</b> Die Soldaten nannten die Pfahlgruben „Lilien“, weil sie aussahen wie die Blume. Und Caesar erkannte man in der Schlacht an der Farbe seines Mantels.', rel: '<b>Quelle:</b> Caesar, Gallischer Krieg 7.69–89, der Bericht des Siegers mit überhöhten Zahlen. Den Ort bei Alise-Sainte-Reine halten die meisten Forscher für gesichert.' },
  { meta: 'Thessalien · 48 v. Chr.', title: 'Die vierte Linie', text: 'Pompeius hatte weit mehr Reiter und wollte damit Caesars rechten Flügel umgehen. Caesar nahm sechs Kohorten aus seiner dritten Linie und stellte sie verdeckt hinter den rechten Flügel. Sie sollten ihre Wurfspeere nicht werfen, sondern damit nach oben stechen, in die Gesichter der Reiter. Als die Reiterei den Flügel umging, brach die vierte Linie hervor. Die Reiter bedeckten ihre Gesichter und flohen.', use: '<b>Für den Roman:</b> Kenne die Eitelkeit des Gegners. Laut Plutarch rechnete Caesar damit, dass junge Adlige, stolz auf ihre Schönheit, Narben im Gesicht mehr fürchten als den Kampf.', rel: '<b>Quelle:</b> Caesar, Bürgerkrieg 3.88–99, parteiisch. Der Befehl, ins Gesicht zu stechen, steht nur bei Plutarch, Caesar 44–45.' },
  { meta: 'Korea · 612', title: 'Sieben Siege an einem Tag', text: 'Ein riesiges Heer der chinesischen Sui marschierte auf Pjöngjang. Der General Eulji Mundeok kam zum Schein ins feindliche Lager, um sich zu ergeben, und sah, dass die Sui hungerten: Die Soldaten hatten ihre Vorräte für hundert Tage heimlich unter den Zelten vergraben. Danach wich er immer weiter zurück und ließ die Sui „sieben Siege an einem Tag“ erringen, bis sie kurz vor Pjöngjang standen. Als sie umkehrten, griff er an, gerade als die Hälfte den Fluss Salsu überquert hatte.', use: '<b>Für den Roman:</b> Siege, die den Gegner nur tiefer ins Verderben ziehen. Eulji schickte dem feindlichen General ein Gedicht, sinngemäß: Deine Siege sind viele, dein Verdienst ist groß, erkenne, was genug ist, und halte ein. Von 305 000 Mann sollen nur 2700 heimgekehrt sein.', rel: '<b>Quelle:</b> Zizhi Tongjian 181; der Wortlaut des Gedichts ist nicht geprüft. Die berühmte Geschichte vom gebrochenen Damm ist modern (Sin Chaeho, 1931).' },
  { meta: 'Medina, Arabien · 627', title: 'Ein Graben und gesätes Misstrauen', text: 'Ein Bündnis von rund 10 000 Mann rückte gegen Medina vor. Auf Rat von Salman dem Perser hoben die Muslime überall dort einen Graben aus, wo die Stadt für Reiter offen lag, eine persische Technik, auf die die arabische Reiterei keine Antwort hatte. Dann säte Nu’aym ibn Mas’ud Misstrauen: Er brachte die Banu Qurayza dazu, von den Quraisch 70 Geiseln zu verlangen. Abu Sufyan lehnte ab, der gemeinsame Angriff kam nie zustande, und ein kalter Sturm zerstörte das Lager der Belagerer.', use: '<b>Für den Roman:</b> Bündnisse sind Angriffsflächen. Eine Botschaft, beiden Seiten verschieden erzählt, wirkt wie ein ganzes Heer. Der Koran (33:9) spricht von einem Wind und Heeren, die man nicht sah.', rel: '<b>Quelle:</b> Prophetenbiographien des 8. und 9. Jahrhunderts (Ibn Ishaq, al-Waqidi); die Zahlen sind schematisch.' },
  { meta: 'Syrische Wüste · 634', title: 'Kamele als Wasserschläuche', text: 'Khalid ibn al-Walid sollte mit wenigen hundert Reitern vom Irak nach Syrien. Er wählte eine Route, die niemand für möglich hielt: sechs Tage und fünf Nächte ohne Wasserstelle. Etwa zwanzig Kamele ließ man vorher übermäßig trinken und band ihnen die Mäuler zu, damit sie nicht fraßen. Unterwegs schlachtete man sie eines nach dem anderen und trank das Wasser aus ihren Mägen.', use: '<b>Für den Roman:</b> Die unmögliche Route als Waffe. Und ein Wüstenführer, hier Rafi ibn Amr, der plötzlich zur wichtigsten Figur des ganzen Feldzugs wird.', rel: '<b>Quelle:</b> Zum Teil Legende. Es gibt drei Versionen der Route, und der Historiker Hugh Kennedy meint, man könne nicht wissen, welche stimmt.' },
  { meta: 'Syrien und Jordanien · August 636', title: 'Die Brücke im Rücken', text: 'Fünf Tage lang drückten die Byzantiner am Jarmuk gegen die muslimischen Linien, und Khalids bewegliche Reiterreserve flickte jede Lücke. In der Nacht nach dem fünften Tag ritt Dhirar ibn al-Azwar mit 500 Mann um die Nordflanke und nahm die einzige Brücke über die Schlucht des Wadi al-Ruqqad. Am sechsten Tag fegte die gesammelte Reiterei die byzantinischen Reiter vom Feld und fiel der Infanterie in den Rücken. Die wurde gegen Schluchten gedrängt, deren Ausgang schon besetzt war.', use: '<b>Für den Roman:</b> Der 18. August blieb als „Tag der verlorenen Augen“ in Erinnerung, weil byzantinische Bogenschützen so viele Kämpfer blendeten. Ein solcher Name trägt eine ganze Szene.', rel: '<b>Quelle:</b> Späte arabische Überlieferung; der Byzantiner Theophanes schrieb ein Jahrhundert später. Die Heeresstärken schwanken extrem.' },
  { meta: 'Ostanatolien · 1071', title: 'Der Kaiser ist tot', text: 'Bei Manzikert stellten sich die Seldschuken in einem Halbmond auf und wichen jedem Angriff aus. Ihre Mitte zog sich zurück, die Flügel schossen, und das byzantinische Heer entfernte sich immer weiter von seinem Lager. In der Dämmerung befahl Kaiser Romanos die Umkehr. Da verkündete Andronikos Dukas, der Befehlshaber der Reserve, der Kaiser sei gefallen, und marschierte mit der Reserve ab. Der Rückzug wurde zur Flucht, Romanos geriet in Gefangenschaft.', use: '<b>Für den Roman:</b> Ein Gerücht aus den eigenen Reihen ist tödlicher als jeder Feind. Michael Attaleiates, der dabei war, verglich es mit einem Erdbeben: das Geschrei, der Schweiß, die jähen Wellen der Angst, die Staubwolken.', rel: '<b>Quelle:</b> Wer den Verrat des Dukas zuerst berichtet, ist ungeklärt. Manche Historiker meinen, das Rückzugssignal allein habe die Panik ausgelöst.' },
  { meta: 'Japan · 1184 und 1185', title: 'Steilhang und Sturm', text: 'Bei Ichi-no-Tani lag das Lager der Taira zwischen Steilhang und Meer. Während sein Bruder das Osttor angriff, soll Minamoto no Yoshitsune mit nicht mehr als hundert Reitern einen Abhang hinabgeritten sein, den alle für unpassierbar hielten. Ein Jahr später segelte er mit fünf Booten und etwa 150 Mann in einen Sturm, landete abseits, marschierte über Nacht und griff Yashima von der Landseite an. Feuer ließen sein kleines Heer groß erscheinen, und die Taira flohen auf ihre Schiffe.', use: '<b>Für den Roman:</b> Das Wetter, das alle anderen am Ufer hält, ist der Verbündete des Kühnen. Bei Yashima schoss der Bogenschütze Nasu no Yoichi aus der Brandung einen Fächer von einer Stange auf einem feindlichen Boot.', rel: '<b>Quelle:</b> Das Heike monogatari ist Literatur, das Azuma Kagami nüchterner. Ein Hoftagebuch schreibt den Ritt bei Ichi-no-Tani einem anderen zu, viele Forscher bezweifeln ihn.' },
  { meta: 'Nordindien · 1192', title: 'Der falsche Waffenstillstand', text: 'Bei Tarain ließ Muhammad von Ghur dem Rajputenkönig Prithviraj Chauhan ausrichten, er brauche für einen Frieden erst die Zustimmung seines Bruders. Die Rajputen entspannten sich. Vor Sonnenaufgang griffen die Ghuriden an, als das Lager noch schlief oder sich wusch. Berittene Bogenschützen in vier Abteilungen umschwärmten Flanken und Rücken, wichen jedem Nahkampf aus und kamen immer wieder, bis frische Reiter, angeblich 12 000, den erschöpften Gegner überrannten.', use: '<b>Für den Roman:</b> Sunzi warnte: „Friedensangebote ohne beschworenen Vertrag deuten auf ein Komplott.“ Prithviraj ließ am Ende seinen Elefanten zurück und floh zu Pferd.', rel: '<b>Quelle:</b> Persische Berichte der Siegerseite mit übertriebenen Zahlen; das Prithviraj Raso ist Legende.' },
  { meta: 'Kalka 1223 · Liegnitz 1241', title: 'Die lange Flucht und der kurze Ruf', text: 'An der Kalka wichen die Mongolen neun Tage lang zurück. Die verbündeten russischen Fürsten folgten, jeder für sich, und zogen sich dabei immer weiter auseinander. Erst als ein Teil allein über den Fluss gegangen war, machten die Mongolen kehrt. Bei Liegnitz 1241 trennte eine Scheinflucht die Ritter vom Fußvolk, und ein Reiter, der auf Polnisch „Flieht! Flieht!“ rief, brachte eine ganze Abteilung zum Laufen.', use: '<b>Für den Roman:</b> Geduld als Waffe: Neun Tage Rückzug verlangen Nerven, die die Fürsten nicht hatten. Ein Chronist berichtet, die gefangenen Fürsten seien unter der Plattform erdrückt worden, auf der die Sieger tafelten (nicht sicher belegt).', rel: '<b>Quelle:</b> Die Zahlen schwanken stark. Den Ruf bei Liegnitz überliefert Jan Długosz, der mehr als 200 Jahre später schrieb.' },
  { meta: 'Estland und Russland · 1242', title: 'Das Eis, das nie brach', text: 'Auf dem Peipussee stürmte ein Keil aus Ordensrittern und Esten gegen die Linie des Fürsten Alexander Newski, blieb stecken und wurde zerschlagen. Die Überlebenden wurden über das Eis gejagt. Dass das Eis brach und die Ritter ertranken, steht in keiner zeitgenössischen Quelle. Das Bild stammt aus Sergej Eisensteins Film „Alexander Newski“ von 1938.', use: '<b>Für den Roman:</b> Ein Film kann Geschichte überschreiben. Du darfst Legenden nutzen, solltest aber wissen, wo sie anfangen. Die Livländische Reimchronik sagt schlicht, die Toten seien „ins Gras“ gefallen.', rel: '<b>Quelle:</b> Reimchronik (20 tote Ordensbrüder) und Erste Nowgoroder Chronik (400 tote Deutsche) widersprechen sich bei den Zahlen.' },
  { meta: 'England · 1265', title: 'Die erbeuteten Banner', text: 'Drei Tage vor der Schlacht überfiel Prinz Edward nachts das Lager von Simon de Montforts Sohn bei Kenilworth und erbeutete dessen Banner. Als er auf Evesham zumarschierte, trug er diese Banner an der Spitze. Simon hielt das Heer für den Entsatz seines Sohnes, bis die königliche Standarte auftauchte. Da war die einzige Brücke in seinem Rücken schon gesperrt.', use: '<b>Für den Roman:</b> Simon soll beim Anblick der geordneten Reihen gesagt haben: „Das haben sie nicht von sich aus gelernt, sondern von mir.“ Kenilworth ausgekundschaftet hatte laut Walter von Guisborough eine Frau namens Margoth in Männerkleidern.', rel: '<b>Quelle:</b> Mehrere Chroniken. Simons Ausspruch ist in verschiedenen Fassungen überliefert, die Zahlen sind unsicher.' },
  { meta: 'Schottland · 1297', title: 'Zwei Reiter breit', text: 'Die Brücke über den Forth bei Stirling war so schmal, dass nur zwei Reiter nebeneinander passten, und am Nordufer führte ein Damm über weichen Boden. William Wallace und Andrew Moray warteten auf der Höhe, bis die englische Vorhut hinübergezogen war und sich auf dem Damm staute. Dann stürmten sie hinunter, nahmen den Brückenkopf und vernichteten alle, die schon drüben waren, während der Rest des Heeres vom Südufer zusehen musste.', use: '<b>Für den Roman:</b> Eine Furt flussaufwärts, an der 60 Reiter nebeneinander hätten queren können, war vorgeschlagen und verworfen worden. Wer schlug sie vor, wer lehnte ab, und warum? Darin steckt eine ganze Nebenhandlung.', rel: '<b>Quelle:</b> Englische Chroniken wie Walter von Guisborough mit wohl übertriebenen Verlustzahlen. Die genaue schottische Stellung ist unsicher.' },
  { meta: 'Schottland · 1314', title: 'Gruben am Weg', text: 'Am ersten Tag von Bannockburn verengten Gruben, etwa drei Fuß tief, die Straße durch den Wald. Am zweiten Tag griffen die sonst defensiven Schotten selbst an, die Engländer standen eingezwängt zwischen zwei Bächen auf nassem Schwemmland. Ihre Reiterei konnte sich nicht entfalten, ihre Bogenschützen kamen nicht an den eigenen Reitern vorbei. Als auf einem Hügel der schottische Tross auftauchte, hielten die Engländer ihn für ein neues Heer.', use: '<b>Für den Roman:</b> Als die Schotten vor dem Angriff knieten, glaubte Eduard II., sie bäten um Gnade. Ein Begleiter antwortete, sie würden siegen oder sterben.', rel: '<b>Quelle:</b> Die Gruben kennt man nur aus Texten, nicht aus Grabungen. Wo am zweiten Tag gekämpft wurde, ist umstritten; der Tross auf dem Hügel ist Tradition.' },
  { meta: 'Japan · 1331 und 1333', title: 'Strohpuppen und ein falscher Tod', text: 'Kusunoki Masashige verteidigte kleine Bergfestungen gegen riesige Heere. In Akasaka ließ er eine falsche Außenmauer auf die Kletternden stürzen, dazu Stämme, Steine und kochendes Wasser. Als die Vorräte ausgingen, schlich er sich nachts davon, und ein Zurückgebliebener zündete einen Scheiterhaufen an, damit man ihn für tot hielt. In Chihaya stellte er Strohpuppen in Rüstung vor die Mauer, hinter denen Männer brüllten. Die Angreifer stürmten heran, und von oben rollten Felsbrocken.', use: '<b>Für den Roman:</b> Ein Feldherr, der seinen eigenen Tod inszeniert, ist ein Geschenk für jeden Plot. Bei den 36 Strategemen heißt das „die goldene Zikade streift ihre Hülle ab“.', rel: '<b>Quelle:</b> Das Taiheiki aus dem späten 14. Jahrhundert dramatisiert stark; der vorgetäuschte Tod gilt als nicht belegt.' },
  { meta: 'Bretagne · 1350 oder 1354', title: 'Holzfäller mit Klingen', text: 'Bertrand du Guesclin ließ seine Männer als Holzfäller verkleiden, die Feuerholz zur Burg Grand-Fougeray brachten. Die Waffen steckten in den Reisigbündeln. Als das Tor sich öffnete, zogen sie die Klingen und hielten es, bis die übrigen hereinstürmten. Später, als Konnetabel von Frankreich, mied er große Schlachten und holte Burg um Burg zurück, während englische Heerzüge durchs Land zogen, ohne etwas zu erreichen.', use: '<b>Für den Roman:</b> Ein Tor öffnet sich für das, was jeden Tag kommt: Holz, Wasser, Händler. Das Alltägliche ist die beste Tarnung.', rel: '<b>Quelle:</b> Örtliche Burggeschichten, wohl nach der Reimchronik des Cuvelier. Eine davon schreibt selbst, der Rest gehöre zur bretonischen Legende. Das Jahr ist umstritten.' },
  { meta: 'Indien · 1398', title: 'Ein Wall aus Büffeln', text: 'Timurs Soldaten fürchteten die gepanzerten Kriegselefanten des Sultans von Delhi. Timur ließ deshalb vor seiner Front einen Graben ausheben und Palisaden setzen, dazu Büffel, Seite an Seite an Hals und Füßen mit Lederriemen zusammengebunden, als lebende Mauer. Das Fußvolk bekam „eiserne Krallen“, vermutlich Fußangeln. Seine Bogenschützen zielten auf die Elefantenführer.', use: '<b>Für den Roman:</b> Die Angst der eigenen Männer ist ein taktisches Problem und verlangt eine sichtbare Lösung. Vor der Schlacht ließ Timur nach beiden Quellen rund 100 000 Gefangene töten, ein Preis, über den kein Roman hinwegsehen sollte.', rel: '<b>Quelle:</b> Yazdis Zafarnama, die offizielle Hofgeschichte aus den 1420er Jahren. Brennende Kamele tauchen erst in viel späteren Berichten auf.' },
  { meta: 'Anatolien · 1402', title: 'Das Wasser des Gegners', text: 'Sultan Bayezid zog nach Osten, um Timur zu stellen, und fand ihn nicht. Timur war in einem weiten Bogen hinter ihn gezogen und hatte das osmanische Lager samt seinem Wasser besetzt, den Bach leitete er in ein Becken um. Die Osmanen kehrten in der Sommerhitze zurück und mussten durstig angreifen. Mitten in der Schlacht liefen die Kara-Tataren und die Truppen der anatolischen Fürstentümer zu Timur über, bei dem ihre früheren Fürsten ritten.', use: '<b>Für den Roman:</b> Timur hatte die Tataren laut einer türkischen Darstellung vorher durch Spione gewonnen. Über die Serben auf der Gegenseite sagte er, sie kämpften „wie Löwen“.', rel: '<b>Quelle:</b> Die Absprache mit den Tataren ist nur allgemein überliefert, ohne Einzelheiten. Alle Zahlen sind zweifelhaft.' },
];

L.kommandant = {

  body: [
    { h: 'Was die Großen gemeinsam haben', html: UL([

      '<b>Sie rechnen mit der Zeit.</b> Mahlzeiten, Marschtage, Gezeiten, Tageslicht. Scipio ließ seine Männer bei Ilipa vor Sonnenaufgang frühstücken, die Karthager mussten nüchtern ausrücken (<a href="#ilipa">Ilipa</a>). Die Perser bei Dara griffen erst nach Mittag an, weil sie selbst spät aßen und die Römer bis dahin hungrig glaubten.',
      '<b>Sie lesen den Gegner als Menschen.</b> Sun Bin kannte Pang Juans Ehrgeiz, Han Xin die Regelgläubigkeit Chen Yus (<a href="#maling">Maling</a>, <a href="#jingxing">Jingxing</a>).',
      '<b>Sie behalten etwas zurück.</b> Eine Reserve, einen versteckten Trupp, einen zweiten Plan. Hannibal hatte bei Cannae Veteranen an beiden Enden der Sichel, Belisar dreihundert Heruler hinter einem Hügel.',
      '<b>Sie können verzichten.</b> Belisar brach bei Dara die Verfolgung ab. Fabius verweigerte monatelang jede Schlacht und ließ sich dafür verspotten (<a href="#fabius">Fabius</a>).',
    ]) },
    { h: 'Exzentrik als Waffe', html: P('Was Zeitgenossen als Marotte erschien, hatte oft Methode.') + UL([
      '<b>Geheimhaltung bis zur Absurdität.</b> Bai Qi übernahm bei Changping heimlich das Kommando, auf Verrat stand der Tod. Nero ließ am Metaurus für seine Neuankömmlinge kein einziges neues Zelt aufschlagen (<a href="#metaurus">Metaurus</a>).',
      '<b>Rituale.</b> Scipio ging sein Leben lang vor jedem Geschäft allein in den Jupitertempel auf dem Kapitol, laut Gellius noch vor Tagesanbruch, und die Tempelhunde bellten ihn nie an. Polybios hielt das für Berechnung. Sertorius führte eine weiße Hirschkuh mit sich, die ihm angeblich Geheimnisse verriet (<a href="#kabinett">Kabinett der Listen</a>).',
      '<b>Masken.</b> Hannibal trug aus Angst vor gallischen Attentätern Perücken und wechselnde Kleider (Livius 22.1). Am Hydaspes stand laut Curtius ein Doppelgänger Alexanders in Königsrobe im Lager (<a href="#hydaspes">Hydaspes</a>).',
      '<b>Ruhe als Botschaft.</b> Als die Nachricht vom Sieg am Fei-Fluss eintraf, spielte der Minister Xie An seine Partie Weiqi in Ruhe weiter. Erst danach, so die Jin-Chronik, brach er sich an der Türschwelle einen Zahn seines Holzschuhs ab, ohne es zu bemerken (<a href="#fei">Fei-Fluss</a>).',
    ]) + P('Wie Eigenheiten auf den Leser wirken, erklärt die Lektion <a href="#eigenheiten">Ticks, Rituale, Marotten</a>. Viele weitere echte Beispiele mit Quelle findest du im <a href="#marotten">Archiv der Eigenheiten</a>.') },
    { h: 'Demütigung als Stärke', html: P('Als junger Mann wurde Han Xin auf dem Markt von einem Metzgerburschen gestellt: „Wenn du den Tod nicht scheust, stich mich nieder. Wenn doch, kriech mir zwischen den Beinen durch.“ Han Xin sah ihn lange an, dann kroch er auf allen vieren hindurch, und der ganze Markt lachte (Shiji 92). Jahre später, als König von Chu, gab er demselben Mann einen Posten als Polizeikommandant. Als sein Herr Liu Bang ihn fragte, wie viele Soldaten er führen könne, antwortete er sinngemäß: je mehr, desto besser. Liu Bang selbst könne höchstens 100 000 führen, verstehe sich aber darauf, Generäle zu führen.') + P('Fabius wurde in Rom als „Hannibals Pädagoge“ verspottet, weil er dem Feind wie ein Hauslehrer hinterherlief, ohne je zu kämpfen (Plutarch, Fabius 5). Aus dem Schimpfwort „Zauderer“ wurde später ein Ehrenname. Der Dichter Ennius schrieb: <i>Unus homo nobis cunctando restituit rem</i>, ein einziger Mann hat uns durch Zögern den Staat gerettet.') + P('Ein Feldherr, der Spott erträgt, ist nicht zu provozieren. Und Provokation ist das erste Werkzeug seiner Gegner.') },
    { h: 'Schwächen, die ihn menschlich machen', html: UL([
      'Alexander verschlief am Morgen von Gaugamela, Parmenion musste ihn wecken. Einen Nachtangriff hatte er am Vorabend abgelehnt: „Ich stehle meinen Sieg nicht“ (Plutarch, Alexander 31–32).',
      'Hannibal zog vier Tage und drei Nächte ohne Schlaf durch die überfluteten Sümpfe am Arno, auf dem letzten überlebenden Elefanten, und verlor dabei das Augenlicht auf einer Seite (Livius 22.2).',
      'Sun Bin hatte man auf Betreiben Pang Juans die Füße verstümmelt und das Gesicht tätowiert. Er plante seine Feldzüge von einem verdeckten Wagen aus.',
